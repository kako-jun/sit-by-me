- "文面ID": "PR.role"
  "区分": "プロンプト"
  "文面": "ROLE: 添付のモック画像（色付きの箱で作った間取りの斜め見下ろし図）を編集して、手作りミニチュア（段ボールの台座・綿の雪・紙粘土の木・木目の床の工作）の一枚絵に仕上げる。モックは**位置と大きさを正確にするための型**で、見た目の完成形ではない。"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt"
  "備考": ""
- "文面ID": "PR.geometry"
  "区分": "プロンプト"
  "文面": "GEOMETRY（固定。ここだけが『足さない・消さない・ずらさない』）: {text}"
  "変数": "text"
  "使用箇所": "oblique_build.build_prompt"
  "備考": ""
- "文面ID": "PR.fill"
  "区分": "プロンプト"
  "文面": "FILL（装飾。簡素にしない）: {text}"
  "変数": "text"
  "使用箇所": "oblique_build.build_prompt"
  "備考": ""
- "文面ID": "PR.reality"
  "区分": "プロンプト"
  "文面": "STRUCTURE（屋外。位置以外の形・配置・材質の種類は下の描写に従う。見た目は常に MINIATURE MATERIALS の工作の素材）: 添付のモックと座標は『最低限こういう位置関係にしろ』という位置の指定にすぎない。建物の形・家・庭・道との境界・植栽・木の大きさなど位置以外は、下に書いた具体的な描写（材質・色・形・雪の載り方）に従い、工作の素材（綿・紙粘土・紙やすり・段ボール・スタイロフォーム・樹脂）で作る。道と私有地・敷地・水際・段差の境目を『色の違いだけ』にしない。土塀・石垣・生垣・板塀・縁石・段差・石段・護岸・閉じた門や景色としての扉など、実体のある要素として、工作の素材で立体的に作る。歩けない場所は、段差・塀・閉じた門・水などの視覚的な理由があって歩けなさそうに見えること（入れそうな地面に見せない）。観光地の有名な建物の特徴を混ぜず、一般の景観として描く。"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（装飾プールの outdoor が true のとき）"
  "備考": "決定 SIT.real-reference-boundaries（Issue #191）。建物・塀・門の look が空欄の屋外MAPは oblique_build.outdoor_look_problems を validate がエラーにして生成を止める（probe では『生成停止（stopped）』）。木の大きさのばらつきはエリア固有の決定なのでここに置かず、装飾プールの reality_note（PR.reality.pool-note）で出す"
- "文面ID": "PR.reality.road-edge"
  "区分": "プロンプト"
  "文面": "ROAD EDGE: 道路・街路・路地・坂など歩く道がある場合、その道の両脇には必ず、段差・塀・側溝・縁石・護岸・石垣・生垣など実体のある境界を、工作の素材で立体的に作る。道の外側が歩けるように見えてはいけない（道の地面がそのまま外へ続いて見える道端にしない）。歩けない場所は歩けなさそうに見えること。通れなくする手段は1種類に固定せず、区間ごとに使い分ける（同じ塀が延々と続く単調さを避ける）（歩く道が無いMAPでは何も足さない）。"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（装飾プールの outdoor が true のとき、REALITY の直後）"
  "備考": "決定 SIT.road-edge-solid-boundary（Issue #191）。MAP ごとの plan に書かせず、屋外の全MAPに自動で出す。検査は verify_prompt_reflects_ledger.rb の check_reality。"
- "文面ID": "PR.reality.shosetsu"
  "区分": "プロンプト"
  "文面": "SHOSETSU: 消雪パイプの散水ヘッドを描く場合は、穴だけを描く。穴は道路の中央線の上にだけ、等間隔で一列に並べる（道が斜め・S字のときは、道の中央を走る線に沿って）。路肩・歩道・縁石際・路面の端・私有地・石畳の参道には置かない。路面と同じ高さの丸い穴と、その周りの茶色の絵具の輪・黒い光沢ニスの輪・雪の溶けた輪だけを描き、水の噴射・飛沫・水の柱・霧は描かない（静止画では水が動かず不自然になるため）。消雪パイプが無いMAPでは何も足さない。"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（装飾プールの outdoor が true のとき、REALITY の直後）"
  "備考": "決定 SIT.shosetsu-hole-only（Issue #191）。エリア固定ではなく、消雪パイプを描く全MAPで共通。屋外の全MAPに条件文として出す（消雪パイプが無ければ何も足さない）。検査は verify_prompt_reflects_ledger.rb の check_reality。"
- "文面ID": "PR.forbid.road-edge"
  "区分": "プロンプト"
  "文面": "道路の両脇に段差・塀・側溝・縁石・護岸などの実体が無い道端（道の外が歩ける地面に見える描き方）は描かない。両脇は必ず実体のある境界で閉じる"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（屋外MAPの FORBIDDEN）"
  "備考": "決定 SIT.road-edge-solid-boundary（Issue #191）。ROAD EDGE の禁止側"
- "文面ID": "PR.forbid.shosetsu"
  "区分": "プロンプト"
  "文面": "消雪パイプの散水ヘッドから水を噴き上げる描写（水の噴射・飛沫・水の柱・霧）は描かない。穴と周りの茶色の絵具の輪・光沢ニスの輪だけを、道路の中央線の上にだけ描く（中央線以外の場所に穴を描かない）"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（屋外MAPの FORBIDDEN）"
  "備考": "決定 SIT.shosetsu-hole-only（Issue #191）。SHOSETSU の禁止側"
- "文面ID": "PR.seam.head"
  "区分": "プロンプト"
  "文面": "SEAM（隣のMAPとのつなぎ目）: 道が隣のMAPへ続く端では、道の両脇の境界は隣と同じものが続く（隣で溝だった所を、こちらで別の塀に変えない）。端の外にはみ出して描かない。"
  "変数": ""
  "使用箇所": "oblique_build.seam_section（屋外MAP。台帳 接続 の edge 接続に隣の屋外MAPがあるとき）"
  "備考": "決定 SIT.road-edge-solid-boundary（Issue #191）。隣の境界の種類は隣の plan の boundaries/壁の look から機械的に取る（既存の語だけ。oblique_build.EDGE_KIND_GROUPS）"
- "文面ID": "PR.seam.item"
  "区分": "プロンプト"
  "文面": "- {side}の端は {other} と接する。つなぎ目では道の{kinds}が続く。"
  "変数": "kinds,other,side"
  "使用箇所": "oblique_build.seam_lines"
  "備考": ""
- "文面ID": "PR.reality.pool-note"
  "区分": "プロンプト"
  "文面": "{text}"
  "変数": "text"
  "使用箇所": "oblique_build.build_prompt（装飾プールに reality_note があるとき、REALITY の直後）"
  "備考": "エリア固有の現実の補足。寺町は決定 TRM.tree-size-uneven（木の大きさのばらつき）。他エリアの屋外プールには強制しない"
- "文面ID": "PR.miniature"
  "区分": "プロンプト"
  "文面": "MINIATURE MATERIALS: 最優先。この絵は実景の写真ではなく、机の上に置いた手作りミニチュア（ジオラマ）を撮影した模型の写真。画面のものはすべて、工作の素材で作った模型として描く。形・配置・材質の種類は下の描写に従い、見た目は常に工作の素材感にする。雪は本物の綿（脱脂綿・ポリエステル綿の繊維が見える。盛り、ちぎった質感）で、屋根・塀・地面・木の枝の雪もすべて綿。建物は厚紙・プラ板・段ボール・紙粘土の簡略な箱（屋根は段ボールの波、壁は指跡・ヘラ跡）。瓦・土塀・石垣・石積みは、紙粘土や発泡スチロールに粗く描いた石（荒削りの紙粘土）。柵・竹垣・格子・門柱は爪楊枝・割り箸・マッチ棒を並べたもの。木は鉄道模型の木のように簡略化した、スポンジ・毛糸・ドライフラワーの塊に着色したもの（枝は針金。松の形は台帳どおり）。地面・植え込みは鉄道模型のターフ・おがくず・フロッキング。道路は黒い画用紙か紙やすりに、つや消しの薄いニス。用水・氷は青いセロファンか透明レジン。電柱は割り箸（先を色紙で巻く）。スノーポールは赤白のテープを巻いた爪楊枝。散水ヘッドの穴などの小物はビーズ・ボタン。質感はプラスチックや土っぽく、粒子を荒くする。形は単純化し、縁は硬く、写真のように精密にしない。塗装は筆跡が見える。手作りの粗は、マップごとにばらつく自然な傷み・塗りムラ・糸くず・手で切った紙のギザギザの縁・材料の接ぎ目にとどめ、等間隔に並べた飾りは置かない。写真のような精細さ・自然な光の反射・フォトリアルな質感にしない。撮影は模型の接写: 浅い被写界深度（手前と奥が少しぼける）、台座の縁の厚みが見える。素材の質感を少し誇張する（紙粘土は指跡とヘラ跡、スポンジは小さな穴、綿は繊維のほつれ、つまようじや割り箸の木目と先の切り口が見える）。変化はマップごとにばらつく自然な傷み・塗りムラにとどめ、同じ形や等間隔の繰り返しは作らない。"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（全MAP。ROLE の直後。最優先の中核制約）"
  "備考": "決定 SIT.miniature-materials-not-photoreal（Issue #191）。旧 PR.reality.miniature（屋外の STRUCTURE 節の最後）を、ROLE の直後・全MAP共通に移した（D-prime。TRM-07 の素材感の実験で、冒頭に置く案が最良）"
- "文面ID": "PR.forbid.miniature"
  "区分": "プロンプト"
  "文面": "実写の写真のような質感・写真のような精細さ・自然な光の反射・フォトリアルな雪や塗装は描かない。すべて工作の素材（綿の雪・紙粘土・紙やすり・樹脂）で作った模型として描く"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（屋外MAPの FORBIDDEN）"
  "備考": "決定 SIT.miniature-materials-not-photoreal（Issue #191）。MINIATURE MATERIALS の禁止側"
