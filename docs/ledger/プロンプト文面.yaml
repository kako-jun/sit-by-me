- "文面ID": "PR.reference.base-era"
  "区分": "プロンプト"
  "文面": "- 基準MAP {base} の確定画像は、このMAP（{era}）と同じ部屋・同じ建物の別時期。間取り・家具・床・壁・窓・扉の細部を基準画像から継承し、時期差分（DECISIONS・FEATURES に書かれた変更）だけを変える。内装どうし（同じ家の別時期）は同一にする。外観と内装の比率は一致させなくてよい。構図・配置・位置・大きさはモックが正本でコピーしない。"
  "変数": "base,era"
  "使用箇所": "ledger_query.sections"
  "備考": "時期差分MAP（-kids/-fire/-burnt/-wc）で依存MAPに基準MAPがあるとき REFERENCE IMAGES 節に入る（#193）。文面は内装（同じ部屋の別時期）を前提にしている。外観の変種（TRM-03-wc・-burnt）に 時期差分 の行ができたら見直す（未決 U-2908）"
- "文面ID": "PR.trailer.blocked-base"
  "区分": "プロンプト"
  "文面": "# BLOCKED（基準の採用待ち）: 同じ部屋・建物の基準MAP {base} が台帳の素材表に未採用（状態=採用・種別=背景の行が無い）。素材表に採用行が入るまで、別時期のこのMAPは生成を起動しない。--adopt --canonical は manifest の確定印だけを書き素材表には触れないので、それだけでは解除されない（素材表に採用行を入れてからこのプロンプトを再生成する）。"
  "変数": "base"
  "使用箇所": "oblique_build.build_one"
  "備考": "PR.trailer.draft に続けて出る。manifest の prompt 段は blocked（#193）"
