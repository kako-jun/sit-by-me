# 表: プロンプト文面 — imagegen 用プロンプト・接続表・窓一覧・接続図に出る文面（{名前}=変数の差し込み口）。コードは oblique_text.text で読み、文面を直接持たない。
# 列: 文面ID / 区分 / 文面 / 変数 / 使用箇所 / 備考
# 全スカラーは文字列（引用符つき）。空欄は ""。複数行は |- ブロック。
- "文面ID": "PR.coord.head"
  "区分": "プロンプト"
  "文面": "COORDINATES（画素座標。画像 {W}×{H}・左上原点・x は右・y は下。plan とモックの射影から機械的に出した値。これらの位置・大きさは1画素も動かさない。建物全体を上下左右へずらさない。装飾は面の内側だけ）:"
  "変数": "H,W"
  "使用箇所": "oblique_build.coord_section"
  "備考": ""
- "文面ID": "PR.coord.slab-top"
  "区分": "プロンプト"
