  "区分": "プロンプト"
  "文面": "（下の SURFACES は壁ごとの look が無い面の既定。壁・box に look が書かれた建物・塀はその look を優先し、全部の建物に同じ壁・同じ屋根を当てない。家ごとに外壁・屋根・状態を変える）"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（屋外MAPの SURFACES 節）"
  "備考": ""
- "文面ID": "PR.surfaces.outdoor-note.all-look"
  "区分": "プロンプト"
  "文面": "（壁・屋根・扉・床の材質と形は各壁・各面の look に従う。下の SURFACES の各項目は look への案内。全部の建物に同じ壁・同じ屋根を当てない）"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（屋外MAPで全ての壁と床に look があり、窓が0件の場合の SURFACES 見出し行）"
  "備考": "各項目が『look に従う』のとき、『壁ごとの look が無い面の既定』という見出しと矛盾させない"
- "文面ID": "PR.tree.head.zones"
  "区分": "プロンプト"
  "文面": "TREE PLACEMENT（建物の外の木の配置の目安。台座の上面で建物の外壁の外側。合計{tmin}〜{tmax}本＝松{pmin}〜{pmax}本＋枯木{dmin}〜{dmax}本、松多め。木は下の『木を置ける範囲』の中だけに置く）:"
  "変数": "dmax,dmin,pmax,pmin,tmax,tmin"
  "使用箇所": "oblique_build.coord_section（plan に tree_zones がある MAP）"
  "備考": "木を置ける帯が plan にある MAP は『各辺に○本』を出さない（帯は北・南の隙間などで四辺に揃わない）"
- "文面ID": "PR.trees-total.zones"
  "区分": "プロンプト"
  "文面": "- 合計{tmin}〜{tmax}本。松{pmin}〜{pmax}本・枯木{dmin}〜{dmax}本（松多め）。置く場所は TREE PLACEMENT の『木を置ける範囲』の中だけ（範囲の外・歩く地面の上には置かない）"
  "変数": "dmax,dmin,pmax,pmin,tmax,tmin"
  "使用箇所": "oblique_build.build_prompt（plan に tree_zones がある MAP）"
  "備考": ""
- "文面ID": "PR.layer.building.from-look"
  "区分": "プロンプト"
  "文面": "建物・塀は外観。屋根・壁の材質と形は、下の SURFACES の壁ごとの look に従う（屋根や壁の形と材質は壁ごとに違う）。屋根の外形は建物の上端の外形に収め、屋根・笠・軒に綿の雪が積もる。"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（屋外MAPで全ての壁に look がある場合の LAYERS 建物行）"
  "備考": "全部の壁に look がある屋外MAPでは、プール既定の寄棟・漆喰を出さない"
- "文面ID": "PR.surfaces.wall.from-look"
  "区分": "プロンプト"
  "文面": "壁の材質は下の『壁 …』の行（壁ごとの look）に従う。"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（全ての壁に look がある屋外MAPの SURFACES wall）"
  "備考": ""
- "文面ID": "PR.surfaces.roof.from-look"
  "区分": "プロンプト"
  "文面": "屋根の材質と形は下の『壁 …』の行（壁ごとの look）に従う。屋根は建物の外形に収める。"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（全ての壁に look がある屋外MAPの SURFACES roof）"
  "備考": ""
- "文面ID": "PR.surfaces.door.from-look"
  "区分": "プロンプト"
  "文面": "戸・扉の見た目は DOORS／SCENERY DOORS／下の『壁 …』の行（壁ごとの look）に従う。"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（全ての壁に look がある屋外MAPの SURFACES door）"
  "備考": ""
- "文面ID": "PR.surfaces.floor.from-look"
  "区分": "プロンプト"
  "文面": "地面は綿の雪。各床の見た目は下の FLOORS の look に従う。"
  "変数": ""
  "使用箇所": "oblique_build.build_prompt（全ての床に look がある屋外MAPの SURFACES floor）"
  "備考": ""
- "文面ID": "PR.surfaces.window.none"
  "区分": "プロンプト"
  "文面": "窓は描かない（MAP KEYS『窓: 該当なし』）。壁に窓を足さない。"
  "変数": ""
  "使用箇所": "oblique_build.outdoor_pool_for_plan（屋外MAPで plan の窓が0件）"
  "備考": "プール既定の窓の文面が MAP KEYS・各壁の『窓は描かず』と矛盾しないようにする"
- "文面ID": "PR.forbid.walk-zones"
  "区分": "プロンプト"
  "文面": "{walk}の上には木・雪山・電柱を置かない（木は TREE PLACEMENT の『木を置ける範囲』だけ。雪山・電柱は歩く地面の外側の縁の帯に置く）"
  "変数": "walk"
  "使用箇所": "oblique_build.build_prompt（forbid_skip で外した『歩く地面への新規物』の代わり）"
  "備考": "forbid_skip で行ごと外すと道の上に木を置く禁止が消えるため、MAP の歩く床の名前で言い直した行を出す"
