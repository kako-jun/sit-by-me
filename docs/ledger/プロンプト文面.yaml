# 表: プロンプト文面 — imagegen 用プロンプト・接続表・窓一覧・接続図に出る文面（{名前}=変数の差し込み口）。コードは oblique_text.text で読み、文面を直接持たない。
# 列: 文面ID / 区分 / 文面 / 変数 / 使用箇所 / 備考
# 全スカラーは文字列（引用符つき）。空欄は ""。複数行は |- ブロック。
