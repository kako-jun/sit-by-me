- "規約ID": "BODY-RULE-001"
  "対象種別": "エリア"
  "対象ID": "body"
  "区分": "接続・空間"
  "内容": "以下は接続の向きを一意にする正本である。`→` の両側は必ず反対の画像辺とし、`door` は画像端でなく室内・階層遷移である。`event` は一方向の物語イベント、`oneway` は一方向の通常移動。`door-passage-*` は体内の抽象通路名で物理的な扉ではない。`pending` は旧仮説のID追跡だけの行で、隣接・通行路・生成契約ではない。`§3.1` 以降の旧試作時の図・発注文は履歴説明であり、ここにない辺指定を新規プロンプト、画像生成、マスクに使ってはならない。"
  "確度": "資料記載（本人の逐語決定とは区別）"
  "根拠": "docs/map-topology.md:118"
- "規約ID": "BODY-RULE-002"
  "対象種別": "エリア"
  "対象ID": "body"
  "区分": "接続・空間"
  "内容": "園庭（TRM-03境内の右の区画）→BDY-01口は一方向の物語イベント（TRM-03.event-kiss→BDY-01.event-mouth）。病院・海外からの体内経路や恒常的な徒歩口ではない。胴体は縦2MAP、上半身BDY-02→下半身BDY-03。頭BDY-04は上半身の上の迷路状通路。左右の手は上半身から斜め上へ伸び、左BDY-05→BDY-06（画面右上・上半身の東辺から出て、BDY-05の西辺から入る）／右BDY-07→BDY-08（画面左上・上半身の西辺から出て、BDY-07の東辺から入る）の各2MAPの一本道。左右の足は下半身から斜め下へ伸び、左BDY-09→BDY-10→BDY-11（画面右下・下半身の東辺から出る）／右BDY-12→BDY-13→BDY-14（画面左下・下半身の西辺から出る）の各3MAPの一本道。**左右は身体の本人から見る（本人は仰向け、それを正面から見る構図。画面左が本人の右手・右足、画面右が本人の左手・左足。心臓は本人の左側＝画面右、肺は画面左。kako-jun 2026-10-22、#142）。**手足末端は閉じ、手足相互の連絡や迂回路を足さない。方向は分岐の方位であり、各手足MAPには縦方向の通路ボリュームを持たせる。"
  "確度": "資料記載（本人の逐語決定とは区別）"
  "根拠": "docs/map-topology.md:688"
- "規約ID": "BODY-RULE-003"
  "対象種別": "エリア"
  "対象ID": "body"
  "区分": "接続・空間"
  "内容": "BDY-15胃・BDY-16心臓・BDY-17肺はそれぞれ独立したMAPで、胴体からの単純な分岐室。医学的解剖や写実的臓器ではなく、現実離れした幼稚園児の想像する架空人体の抽象概念、肌色寄りでよい。胃の盾役・エラー細胞と、心臓での水の精霊・火による復活という既存の物語を保持。BDY-02の作画契約: 口→上半身→下半身を中央主路でつなぎ、頭・左右の腕・心臓・肺を枝にする。各経路は模型（ジオラマ）の縁の辺まで届いて隣MAPへ遷移し（遷移位置は辺上の範囲指定、範囲値TBD。土台の板とまわりの机は見えたまま。接続は辺単位の判定のまま。kako-jun 2026-10-22）、洞窟状の穴や物理的な扉は描かない。体の外形を描かず、平面床と低い仕切りで道を作る。配置方位は `docs/topology/body.svg` のBDY-02接続線に従う（心臓=南東・画面右、肺=南西・画面左。南辺は肺=左寄り・下半身=中央・心臓=右寄り。BDY-16は北辺から、BDY-17は北辺中央から入る。首は広間から1本、上で頭（北）と口（北東）に分岐）。心臓・肺の部屋はBDY-02内に描かず、胃はBDY-03からBDY-15へ接続する。空間接続から新たな攻略順・肺ボス・全枝任意という条件を決めない。脳BDY-04は迷路（通路幅はキャラクター1人分で約77px、入口は南辺中央1本、行き止まりの迷路で出口なし）。胃BDY-15は分岐なしJ字の1袋（入口は西辺230px→ドーム→胃体最大460px→幽門130pxで丸く閉じる）。心臓BDY-16は丸い4部屋（右心房=画面左上・右心室=左下・左心房=右上・左心室=右下）を四角い環の通路でつなぐ（入口は北辺）。肺BDY-17は人間の肺が渦巻きでないため行き止まりなし（外周の環に右肺3葉=画面左・左肺2葉=画面右の丸い5部屋、入口は北辺中央、通路幅は人間1人分）。形の詳細（座標・格子）は検証の割付図（verification/body-layout）が正本。pixel/mask・発火条件はTBD。"
  "確度": "資料記載（本人の逐語決定とは区別）"
  "根拠": "docs/map-topology.md:690"
