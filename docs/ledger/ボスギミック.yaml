- "ギミックID": "G019"
  "内容": "**香林坊のボス: 下に室外機、上に巨大看板の2体が同時に出てくる。室外機がプロペラでFF5のアトモスのようにキャラを近づけ、近づきすぎると上の看板を落とされて一撃死**（#120 の原文）。**室外機は新しい敵（新規ID。割当・数値・属性・弱点は未記入）**。**上の看板は大型立体看板で、見た目は「無骨な骨組みと、ボロボロの看板と、クレーンみたいな感じ」**（kako-jun 決定、#120 コメント）。**序盤のボス（香林坊）**。**答えの1つ＝看板を先に倒す（基本）**。「一撃死」は FF の「デス」と同じ＝**対象の残りHPを一気に0にする＝戦闘不能（倒れた状態）。全滅ではない**（kako-jun 決定、#120 コメント。systems.md の「戦闘中のHP0は死でなく倒れた状態」と整合）"
  "出典": "kako-jun 2026-10-19（#120）"
  "実現可否": "要確認（`docs/design/enemy-ai.md`・name-name 実装を読んだ事実）。**複数体同時**: `enemies` は固定配列で複数体を同時に出せる（敵ごとに `行動:` を持てる）。形態変化・仲間の死への反応は「できない」（P4）。**デス相当（一撃死）**: 効果DSLに `damage_full`（対象のHPを全消しする＝デス型。`frontend/src/game/spellDsl.ts`）が既にあり、書ける見込み（`builtin.zaraki` は確率つきの即死で別物）。敵の `[特技]` に効果DSLで書く経路か builtin を呼ぶ経路かは、敵AI側（enemy-ai.md・battleEngine）で要確認。**近づける**: enemy-ai.md に戦闘位置・距離・引き寄せの機能の記述は無い。あるのは隊列（後衛）のみで、敵にも適用（「近づきすぎる」の実装は要実装。擬似案（近づく＝回数や周期の進行カウンターに置き換える）は不採用）。**本物を実装する（kako-jun 決定 2026-10-19）。実装Issue: name-name#887（戦闘中の距離・引き寄せ・前後衛の強制切替・地面の予兆範囲AoE）**。FF5 アトモス（Atomos）の仕様は一次情報で未確認のため書かない。**香林坊の序盤のボスは合体・変形を使わない（kako-jun 2026-10-19、#120）**。**残る要確認（#120。位置・距離の未決は name-name#887 を参照）**: ①室外機の新規ID ③「近づける」の実装（戦闘グリッド上の位置・距離として持てるか） ④答えの残り1つ以上（systems.md:16、decisions.md:193。「看板を先に倒す」のほかは kako-jun から）"
  "使う予定": "香林坊の序盤のボス（上＝大型立体看板、下＝室外機）。M107 を看板役に更新（案A、kako-jun決定 2026-10-19、#120。旧称お神輿型は不要と決定）"
  "採用状態": "案・決定混在（原文参照）"
  "特徴(自由記述)": ""
- "ギミックID": "G020"
  "内容": "**FF14での攻撃予兆を示す赤い色が地面に出る。キャラは後衛になったり前衛になったりして、戦闘中に踏まないように切り替える。強制前後衛交代攻撃**（#122 の原文）。呼び名: AoE（kako-jun 確認 2026-10-19）"
  "出典": "kako-jun 2026-10-19（#122）"
  "実現可否": "要確認（enemy-ai.md・name-name の隊列まわりのコードを読んだ事実）。**隊列（前衛・後衛。敵にも適用）**: できる（`BattleEntity.row` = `'front'`/`'back'`。後衛は物理の与ダメージ・被ダメージが各半分、`battleEngine.ts` の `applyRowToPhysicalDamage`、#747）。**強制前後衛交代**: 戦闘中に `row` を書き換える特技・効果DSL・UIは、読んだ範囲に見つからない（`row` は開始時の属性としてのみ設定）＝要実装の見込み。**地面の予兆範囲・踏む判定**: enemy-ai.md に戦闘位置・距離の記述は無く、グリッド上の範囲表示・踏む判定は読んだ範囲に無い（`at: {col,row}` は敵の群の配置指定）。擬似の実現方法は未検討。備考: 予兆そのものは G009（周期の大技＋予兆。できる＝`周期=`・`予兆`）と関わる。ただし G009 の予兆はメッセージ文言で、地面の範囲表示ではない。**本物を実装する（kako-jun 決定 2026-10-19）。実装Issue: name-name#887（戦闘中の距離・引き寄せ・前後衛の強制切替・地面の予兆範囲AoE）**。**要確認（#122。切り替え方・距離や範囲の座標系・各ボスの値は name-name#887 の未決を参照）**: ①前後衛の切り替え方（コマンドか自動か。「戦闘に特殊なコマンドは入れない」方針との関係） ②「地面の赤」を戦闘グリッド上の範囲として描くか・表示の仕様 ③強制交代の効果（全員か一部か、前衛↔後衛の被ダメージ差） ④答え2つ以上（systems.md:16、decisions.md:193） ⑤**実装の前提**: 位置・予兆範囲・隊列の書き換えが name-name に無いため、M008 の登場までに実装が要る"
