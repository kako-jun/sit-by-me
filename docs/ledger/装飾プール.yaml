  "決定参照": ""
- "プールID": "teramachi-winter-exterior"
  "項目": "layers.outside.look"
  "値": "厚く盛った綿の雪の地面。雪の間から土・枯れ草・苔色の草がところどころ覗く。足跡。木は TREES に従い、歩く地面（参道・墓地・園庭）の上には置かず、台座の縁の余白と建物の裏の余白に植える。白い素地のままの余白・のっぺりした白を作らない。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter-exterior"
  "項目": "layers.outside.fixed"
  "値": "台座の上面の台形は動かさない。参道・墓地・園庭の範囲は動かさない。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter-exterior"
