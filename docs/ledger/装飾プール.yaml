  "項目": "allow[1]"
  "値": "床の板目・継ぎ目・節・汚れ・木目の違い（床に描く模様・敷物の絵は可）"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "allow[2]"
  "値": "棚・机・舞台まわりの小物（積み木・ぬいぐるみ・絵本・玩具・緞帳・背景画）。箱の範囲内"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "allow[3]"
  "値": "建物の外の綿の雪・雪から覗く草・木（松と枯木の2種）・作業机の木目・台座の前縁の段ボール断面とテープ"
  "型": "文"
