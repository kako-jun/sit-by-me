  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter-exterior"
  "項目": "geometry_fixed"
  "値": "固定するのは幾何を決める要素だけ: 画像の寸法・視点・各層の境界（作業机/台座/台座の前縁/境内の地面/建物）・壁の位置と高さ・戸口の位置と幅と高さ・窓の位置と数と種別・家具の箱の位置と大きさと高さ。位置と大きさは下の COORDINATES の画素座標で与え、1画素も動かさない。『足さない・消さない・ずらさない』はこの要素に限る。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter-exterior"
  "項目": "fill_rule"
  "値": "装飾を許すのは『指定のない面の内側』（壁の面・床の面・棚や机の上・舞台の背景・建物の外の雪面・作業机・台座の前縁）だけ。建物の輪郭（壁の外形・壁の高さ・柱の位置・戸口・窓・家具箱の外形）を描き直す許可ではない。これらの外形線は COORDINATES の画素座標どおりに描き、建物全体を上下左右へずらさない。面の内側は簡素にせず、自然な工作の装飾（素材の凹凸・継ぎ目・小物・植物）で十分に埋める。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter-exterior"
  "項目": "layers.desk.label"
  "値": "作業机（最外層）"
  "型": "文"
  "決定参照": ""
