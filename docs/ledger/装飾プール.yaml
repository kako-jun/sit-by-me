# 表: 装飾プール — 装飾プールの設定。
# 列: プールID / 項目 / 値 / 型 / 決定参照
# 全スカラーは文字列（引用符つき）。空欄は ""。複数行は |- ブロック。
- "プールID": "_doc"
  "項目": "schema"
  "値": "sit-oblique-decor/1"
  "型": "文"
  "決定参照": ""
- "プールID": "_doc"
  "項目": "note"
  "値": "edit-prompt の『見た目（look）と許す/禁じる装飾』の再利用プール。幾何（位置・大きさ・戸口・窓・層の境界）は plan とモックが正本で固定。ここは固定されない面を『自然な工作の装飾で十分に埋める』ための文章。元の採用画像（TRM-02: git 9652459 の teramachi-kindergarten-interior-adopted.webp）を 見て拾った。MAP ごとの固有の見た目は plan の box.look / floors.look / walls.look に書く。 エリア単位の固定項目は `areas.<area>`（area_fixed: 机の天面の材質・木の種類・台座の素材）。各プールは `area` を指定して継承し、プール・plan 側で上書きできない（上書き指定はエラー）。新しいエリアを作るときは、そのエリアの area_fixed を 台帳（エリア表の必須キーと決定表）に決めてから `areas` に足す（他エリアの材質を発明しない）。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "name"
  "値": "寺町・冬の工作ジオラマ（室内MAP）"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "geometry_fixed"
  "値": "固定するのは幾何を決める要素だけ: 画像の寸法・視点・各層の境界（作業机/台座/台座の前縁/建物の外/建物）・壁の位置と高さ・戸口の位置と幅と高さ・窓の位置と数と種別・家具の箱の位置と大きさと高さ。位置と大きさは下の COORDINATES の画素座標で与え、1画素も動かさない。『足さない・消さない・ずらさない』はこの要素に限る。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "fill_rule"
  "値": "装飾を許すのは『指定のない面の内側』（壁の面・床の面・棚や机の上・舞台の背景・建物の外の雪面・作業机・台座の前縁）だけ。建物の輪郭（壁の外形・壁の高さ・柱の位置・戸口・窓・家具箱の外形）を描き直す許可ではない。これらの外形線は COORDINATES の画素座標どおりに描き、建物全体を上下左右へずらさない。面の内側は簡素にせず、自然な工作の装飾（素材の凹凸・継ぎ目・小物・植物）で十分に埋める。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "layers.desk.label"
  "値": "作業机（最外層）"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "layers.desk.fixed"
  "値": "モックの茶色の背景の範囲（台座の外側すべて）は動かさない。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "layers.slab_edge.label"
  "値": "台座の前縁（手前の厚み帯）"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "layers.slab_edge.fixed"
  "値": "台座の前縁の位置・厚み、テープと糊の位置はモックのまま。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "layers.outside.label"
  "値": "建物の外（台座の上面で建物の壁の外側）"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "layers.outside.look"
  "値": "厚く盛った綿の雪の地面。雪の間から枯れ草・苔色の草がところどころ覗く。木を各所に植える（種類・本数は TREES に従う。台座の四辺〔奥・手前・左・右〕すべてに散らす）。白い素地のままの余白・のっぺりした白を作らない。外観と位置は厳密に一致しなくてよい。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "layers.outside.fixed"
  "値": "台座の上面の台形は動かさない。外への戸口の前（出口の床パッチ）は雪の地面として低く保ち、木・小物を置かない。ピンクの色は残さない。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "layers.building.label"
  "値": "建物（壁・屋根なし・室内）"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "layers.building.look"
  "値": "室内は壁と床と家具で構成する。屋根は描かない（上から見下ろす）。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "layers.building.fixed"
  "値": "壁・戸口・窓・家具の箱の位置と大きさ。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "surfaces.wall"
  "値": "クリーム色の漆喰（紙粘土のざらつき・ひび）の壁面を、木の柱と梁で区切る真壁造り。壁の上端は段ボール断面の笠木、角に金属の角飾り。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "surfaces.floor"
  "値": "濃い茶色の木の板張り（板目・継ぎ目・節・使用感の汚れ）。単色にしない。"
  "型": "文"
  "決定参照": "TRM.no-tatami"
- "プールID": "teramachi-winter"
  "項目": "surfaces.door"
  "値": "木の板戸（縦板・取っ手）。戸口の位置・幅・高さはモックのまま。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "surfaces.window"
  "値": "細い木の桟で区切った引き違いのガラス窓。ガラス越しに見えるのは室内の床で、外の景色は描かない。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "kinds.shelf"
  "値": "木の低い棚（段ボール製）。段にはおもちゃ・積み木・ボール・絵本、天板にもぬいぐるみ・おもちゃ箱。小物は箱の範囲内に収める。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "kinds.chair"
  "値": "小さな子ども用の木の椅子。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "kinds.table"
  "値": "小さな木の机。天板にカラフルな積み木。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "kinds.round-table"
  "値": "丸い木の机。天板に赤・青・黄・緑の積み木。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "kinds.toy-rack"
  "値": "カラフルな縦長のおもちゃ棚。ボール・積み木・形合わせの玩具が詰まる。"
  "型": "文"
  "決定参照": ""
- "プールID": "teramachi-winter"
  "項目": "kinds.stage"
  "値": "一段高い木の板張りの舞台。前縁に暗い木の框。奥の壁に貼る背景画の城は**ヨーロッパ風の城**に固定（複数の尖塔・赤い円錐屋根・白い壁・時計塔、背景は雪山と雲）。和風の城・天守閣にしない。"
  "型": "文"
  "決定参照": "TRM-02.stage-castle"
- "プールID": "teramachi-winter"
  "項目": "allow[0]"
  "値": "壁の装飾（絵・季節の紙飾り・絵の額・ひび・柱と梁・笠木・角飾り。文字は入れない）"
  "型": "文"
  "決定参照": ""
