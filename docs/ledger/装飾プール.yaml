  "決定参照": ""
- "プールID": "teramachi-winter-exterior"
  "項目": "layers.building.look"
  "値": "建物は外観。灰色の瓦（波形の紙・段ボール）の寄棟屋根に綿の雪が積もる。屋根の外形は建物の上端の外形に収め、ひさしの出は最小。壁はクリーム色の漆喰と木の柱。"
  "型": "文"
  "決定参照": ""
