  "備考": "サンプルの唯一のマップ。背景は TRM-03 境内の採用済み画像（素材 A-1349、kako-jun 目視承認済み）の流用で、座標・画像は複製しない。E001〜E003 はこの1マップの中で同じマップ内のトリガーで起動する方針（docs/demo/README.md）。発火条件・出現位置はイベント台帳が正本。マップ端の切り替えは作らない。戦闘背景 BG012 を選んだ理由（事実）: 戦闘背景.yaml で寺町の屋外の道路の戦闘背景は BG012 だけが採用済み。BG011 は舞台（お遊戯会の劇戦闘 opening_battle 用）で屋外の戦闘に合わない。BG012 の絵は土塀・瓦屋根・雪囲いのある雪道で、TRM-03 境内の外装の絵（園庭・建物）とは景色が食い違う（戦闘背景は特定のMAPの再現でなく寺町の特徴だけを合わせる方針。決定 BTL.bg011-bg012-staff-judgment）。エンカウントはサンプル専用スイッチ（DEMO.sample-road-encounter-switch）で入れる。マップが1つだけなので『寺町の道路にだけ』の対象をこの1マップに読み替える参謀の既定（逐語ではない）。出す敵は台帳の実在の敵から選ぶ（実装タスク）。"
