  "備考": "サンプルの唯一のマップ。背景は本編のどのMAPも流用せず、サンプル専用の『時の最果て』風の抽象空間（暗い星空の虚空に浮かぶ円形の石の足場・数本の柱・淡い光源。決定 DEMO.sample-bg-last-place、Issue #281）。流用元MAP は自分自身（SMP-01）＝サンプル専用の素材（素材.yaml の所有者ID SMP-01。背景 A-1362・マスク A-1363）で、本編のどの MAP も流用しない（旧設計の TRM-03 境内・素材 A-1349 の流用は取り下げた）。入口の出現位置は再開点 sample_field_walk の位置が正本（E003 は本編の境内の背景で、位置を借りない）。背景・歩行マスクは採用（kako-jun 目視承認 2026-11-14。決定 DEMO.sample-bg-take2-approved・DEMO.sample-mask-bg013-approved）。モックと平面スペックは docs/production/sample-field/。本編の MAP.yaml・接続.yaml・素材.yaml の寺町の行は変えない。E001〜E003 はこの1マップの中で同じマップ内のトリガーで起動する方針（docs/demo/README.md）。発火条件・出現位置はイベント台帳が正本。マップ端の切り替えは作らない。戦闘背景を BG012 から BG013（時の最果て。サンプル専用に新規。素材 A-1364、採用。描画オフセットは BG011 の値の仮置き）へ差し替えた理由（事実）: BG012 の絵は土塀・瓦屋根・雪囲いのある雪道で、時の最果ての景色と合わない。BG011 は舞台（お遊戯会の劇戦闘 opening_battle 用）で屋外の戦闘に合わない。kako-jun「よい。つくればいい」（決定 DEMO.sample-bg-last-place-approved）で時の最果て風を新規に作った。BG012 は寺町の屋外用として台帳に残る。エンカウントはサンプル専用スイッチ（DEMO.sample-road-encounter-switch）で入れる。マップが1つだけなので『寺町の道路にだけ』の対象をこの1マップに読み替える参謀の既定（逐語ではない）。出す敵は台帳の実在の敵から選ぶ（実装タスク）。"
