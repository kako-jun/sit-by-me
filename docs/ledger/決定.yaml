- "決定ID": "SIT.S004-origin-fossil"
  "日付": "2026-10-19"
  "対象種別": "全体"
  "対象ID": "sit-by-me"
  "対象名": ""
  "決定の要点": "火の召喚獣（虎）の由来は、幼馴染と川で拾った化石。化石の中身は作中でも不明のままで、おそらくサーベルタイガー、白山火山帯から手取川で流れてきたものの欠片かもしれない（断定しない）。その程度の由来でよい。化石を哺乳類（サーベルタイガー）にしたのは、化石といえば恐竜という風潮へのアンチテーゼ（劇の竜・雷竜との対比とは別の理由として書く）。"
  "逐語": "（逐語の引用なし。Issue記録の決定文）追加決定（kako-jun 2026-10-19）— 虎の由来: 幼馴染と川で拾った化石が由来。化石の中身は分からないままだが、おそらくサーベルタイガー。白山火山帯から手取川で流れてきたものの欠片かもしれない。その程度の由来でいい（これ以上は作り込まない）。補足（kako-jun 2026-10-19）— 化石を哺乳類にした理由: 化石と言えば恐竜という風潮があるが、哺乳類の化石はあまり有名でない。そのアンチテーゼとして、化石をサーベルタイガー（哺乳類）にしている。"
