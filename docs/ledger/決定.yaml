- "決定ID": "SIT.twin-tower-bosses-rescue"
  "日付": "2026-10-18"
  "対象種別": "全体"
  "対象ID": "sit-by-me"
  "対象名": ""
  "決定の要点": "双塔のボスは、左が魔法のみ有効、右がアビリティのみ有効（物理攻撃は無い）。ボスは各塔の最上階にいる。救出は完全ステルスでも殲滅でもなく、ある程度バレている状況で最小限戦って脱出する。シャーは牢屋にいるわけでなく敵の中に紛れており、それに気づくのが救出の核（鍵探しのRPGテンプレにしない）。2体目のボスを倒すと塔間の空中通路に追い詰められ、敵の一人がシャーと判明し、『なんで来たんだ！』と責められながら共闘になる。"
  "逐語": "「左を魔法にしてくれ。ただ、こんなにボス戦など騒がしくしてゲリラ的な救出と言うのも変だな。仲間を呼ばれる前に倒すといってもスマホはあるわけだし。建物自体がボスというのはイマジナリーだが、ある程度はバレていて完全ステルスは無理だったくらいのバランスがいい。敵を全滅させるほど戦うのでなく、最小限戦って脱出だ。シャーは牢屋にいるわけでもないから鍵を探すとか奪うみたいなRPGのテンプレではない。敵の中に紛れているシャーに気づけ、というほうが面白いだろう」「ボスは塔の頂上にいるFF５と同様、それぞれの最上階だ。そして２つめを倒したときにその間の空中通路に追い詰められる。そこで敵の１人がシャーということで、なんで来たんだ！みたいに責められながらも共闘にしよう」"
  "出典": "Issue #71 の記録"
  "出典URL": "https://github.com/kako-jun/sit-by-me/issues/71#issuecomment-6248365687;https://github.com/kako-jun/sit-by-me/issues/71#issuecomment-6248387702"
