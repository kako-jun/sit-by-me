- "決定ID": "TRM.ledger-yaml"
  "日付": "2026-10-23"
  "対象種別": "エリア"
  "対象ID": "teramachi"
  "対象名": ""
  "決定の要点": "台帳の形式は YAML（CSV でなく）。マスター（人が書く）は全テーブル YAML（1エンティティ1ファイル）。人が編集している JSON（map-ids.json・areas.json・dependency-graph.json など）もマスターの YAML へ合流する。派生物（機械が作る plan・decor-pools・connections・manifest）は JSON のまま（既存ツール・検証・テスト・ゲーム実行側が読むため。先頭メタデータに入力ハッシュ・生成日時・再生成コマンド）。人が読む一覧は台帳からの md ビュー。理由: 決定の逐語・自由記述（複数行）、建物の窓列・部位・時期差分（入れ子）、コメントが CSV では扱いにくい。"
  "逐語": "「csvが本当にいいのか？yamlとかのほうが管理しやすいのではないのか」「JSONもyamlのほうがいいのではないのか」→（提案「人が編集するものは YAML、機械が作る派生物は JSON のまま」に）「よい」"
  "出典": "Issue #156"
