  "決定の要点": "S006（雷の召喚獣）は四段階変身にする。第1形態は夜空に浮かぶ、暗いが美しい積乱雲。第4形態はドクロの顔をした竜本体で、その周囲には龍状のいかずちを従わせる。竜本体は M001 に響く竜、周囲の龍状のいかずちは雷の軌跡として分離し、M003 匿龍の生物的な龍とは混同させない。第4段階を gridClass 2x6 とする。"
  "逐語": "（逐語の引用なし。Issue記録の決定文）## 追加決定（kako-jun）\n- 四段階にする。第1形態は夜空に浮かぶ、暗いが美しい積乱雲。\n- 第4形態はドクロの顔をした竜本体。その周囲には龍状のいかずちを従わせる。\n- 竜本体はM001に響く竜、周囲の龍状のいかずちは雷の軌跡として分離し、M003匿龍の生物的な龍とは混同させない。\n\nこれを受け、monsters.mdのS006説明・段階別ファイル名・各段階のgridClassとart-direction.mdの造形記述を更新する。第2・第3形態は雲から竜本体への形成過程として具体化し、第4段階を2x6とする。"
