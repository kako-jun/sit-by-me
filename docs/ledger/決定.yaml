  "日付": "2026-10-29"
  "対象種別": "全体"
  "対象ID": "sit-by-me"
  "対象名": ""
  "決定の要点": "フィールド共通UIの仕様を確定する。エリア名帯は保持2.5秒（上端スライド＋フェード、連続移動は即差し替え）。会話窓は足元yとH/2で上下を決め、ちょうど中央は下側、会話中は固定。メニュー9項目は どうぐ／まほう／そうび／アプリストア／まいし／ジョブ／ステータス／セーブ／せってい で、どうぐは つかう／せいとん／たいせつなもの、ならびかえは入れない。せっていはバトルモード・バトルスピード・メッセージスピード・カーソル・音量・PCキー割当を採用し、ウィンドウカラー・コマンド設定・ゲージ・サウンド・再装備は不採用。選択中は手のカーソル／アクスタの表示。開閉はPCがEsc/X/M、スマホは右上の≡、戻るは左下の「◀戻る」で1階層ずつ。セーブは3スロット。時間制限中、メニュー中はタイマーを止める。"
