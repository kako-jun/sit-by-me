  "決定の要点": "戦闘背景の構図。水平線は画面の上のほう、背景の大半は地面（約9割。数値は実物を見て調整）。視点は斜めの平行線が多くできるもの（キャビネット図のような斜投影）で、地面に奥行きの手がかり（タイル・道・線路・畳の目など）が出る場所を選ぶ。戦闘の配置（味方が右、敵が左、浅い擬似3D）と整合させる。"
  "逐語": "（逐語の引用なし。Issue記録の決定文）- **水平線は画面の上のほうにある**（FF らしい構図）。**背景の大半は地面**（画面の約 9 割が地面側）。※「上端 90% 付近」の指示を、この意味で読んだ。数値は実物を見て調整する\n- **視点は、斜めの平行線が多くできるもの**（キャビネット図のような斜投影。奥行きの線が斜めに平行に走る）。地面に奥行きの手がかり（タイル・道・線路・畳の目など）が出る場所を選ぶ\n- 戦闘の配置（味方が右、敵が左、奥行きに浅い擬似 3D = name-name #747）と整合すること"
