  "決定の要点": "寺町の寺は幼馴染の実家。家が広いので勝ち気。その寺が運営する私立の幼稚園が、幼稚園編（オープニングの劇）の舞台（2026-10-14 kako-jun）。 主人公の家は県営住宅の団地（2026-10-14 kako-jun。幼馴染の広い寺との対比）。団地は寺町のすぐ近く。寺町は河岸段丘の上にあり、団地は段丘の下の、川の側にある。モデルは、寺町と大桑の県営住宅の位置関係で、実際に古風な坂がある（2026-10-14 kako-jun）。県営住宅は昭和の世代の古い4階建てで、主人公は1階に住む（2026-10-14 kako-jun。4階から変更。車椅子になったあとも暮らしが成り立つように）。1階でも、玄関の段差や狭い廊下・風呂の扱いは未決。幼稚園へは坂をのぼって通う。主人公が団地生まれなのは、貧困まではいかないが片親だから（2026-10-14 kako-jun）。団地の背景を作るかは未決。勝ち気はヒロイン（ナム・女）の設定、優しさはヒーロー（オトン・男）の設定で、性別固定（2026-10-14 kako-jun）。"
