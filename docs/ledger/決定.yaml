  "決定の要点": "二周目は中盤から展開が変わり、世代交代する（2026-10-14 kako-jun）。 二周目も、主人公たち（主人公と配偶者）の子供3人が生まれる。ただし親2人＋子供3人の5人では4人パーティに入らず、入れてもDQ5に似すぎる。そこで、友人同士（主人公が選ばなかった異性の友達と、同性の友達）が結婚して子供が1人生まれ、主人公たちの子供3人＋友人たちの子供1人の、大人なし4人パーティになる。ラスボスも変わる（二周目のラスボスは顔の見えない巨人の親＝主人公自身、下の行）。一周目は3人目の子供と入れ違いに配偶者（ヒロイン）が亡くなるが、二周目は主人公・配偶者・子供2人の4人パーティの期間を作れ、それが主人公世代の最後の冒険となる。そのあと子供世代だけの終盤になる。子供の性別・性格・見た目、二周目の子供3人の名前もハク／ハツ／チュンで固定（2026-10-14）。友人たちの子供（4人目）の名前は花（ホワ）（花牌から。東南西北白發中の7枚は使い切っているため字牌の外の「おまけの1枚」。2026-10-14 kako-jun。読みは中国語の huā でホワに確定）、雷の使い手の子供は、長子以外（2人目か3人目のどちらか。2人目・3人目はキャラが薄いので、役割を持たせる。2026-10-14 kako-jun）。長子だけ召喚獣を持たず、ラストバトルで初登場する（隠しの召喚獣）。どちらが雷の使い手かは未定。そのほか、デザインはまだ決めない"
