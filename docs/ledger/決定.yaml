  "逐語": "（逐語の引用なし。Issue記録の決定文）## 決定（kako-jun）\n- シーサイドは**エキストラダンジョン**（FFでいう『かいはつしつ』に相当するおまけダンジョン。FFのどの作品の何を指すかは要確認）。\n- **ペー子しか知らない**場所。\n- **2階建て**。**2階の海側にベランダ**がある。\n- **むちゃくちゃ強い、作中最強のボス**と戦える。\n- 一周目は中に入れない（外観のみ）。二周目で中に入れる。\n- kako-jun の思い出の場所で、写真がある。内部の地図は kako-jun が持っているが今は渡せない。**内部MAPは地図を受け取るまで作らない・数えない**（階数は2階建てと決定済み。MAP数・敵・報酬は決めない）。\n- 実在の施設の被害・倒産は、裏取りができないので**事実として書かない**（ゲーム内の設定として書く。ジオラマは実在店に似せない）。"
