  "備考": "docs/decisions.md の行 273 の帰属記録（2026-10-15 kako-jun）。 記録の理由欄: 理由: 事前セットを採ると予習が有利になり、面白くないため。覚えた魔法の数は膨大になってよい。「次章のボスの弱点属性を先にラーニングしておく」方針（learning-schedule §0）は事前セットでなく自然な蓄積なので矛盾しない。置き換えた記述: 「魔法そのものの装着枠（同時に使える数の制限）は未決」(systems.md 55・212 行、learning-schedule.md §6-3・§7-3、decisions.md 269・270 行)。設計メモ（事実・決めない）: (a) ラーニング対象の敵技は種類が多いほどよい(systems.md 59 行付近。レアな技もレアな魔法)、(b) 属性の魔法は各属性で1つだけ(同 58 行付近)と「膨大」の整合は、属性以外の敵技（補助・状態異常・特殊）が膨大さを担うと読めるが記録に無く要確認、(c) 魔法メニューの一覧性（スクロール・分類）は UI の論点として未決。残る未決のうち「AP と魔法の関係」は回答済み（魔法の成長に AP は使わない）。残りは属性以外の魔法の種類。刀アプリ（スマホ・人物ごと）側の枠は別の論点。 確認: kako-jun『まほうにはつかわない』(2026-10-29)・魔法の成長に AP は使わない。魔法は使うほど成長するのみ、アビリティはその刀を装備して戦闘終了時に得る AP のみ。"
