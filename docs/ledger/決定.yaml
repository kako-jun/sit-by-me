  "決定の要点": "BDY-02: 通路は画像端でなく模型（ジオラマ）の縁まで届かせる。遷移のトリガー位置は画面端に固定せず、範囲（レンジ）で指定する。台座・周囲の机が見えない点は狙いではなく副作用だったので、『土台の板とまわりの部屋が見えたまま』（SKILL 目標の見た目）に戻す（体内以外にも共通）。中央の丸い部分が壁に見えて行き止まりの懸念があるため台座は廃止し、中央は壁で縁取った開けた丸い広間の床にする。"
  "逐語": "（逐語の引用なし。Issue記録の決定文）## kako-jun 決定（2026-10-22、BDY-02 v1 を見て）\n1. 「模型の縁まででいい。画面遷移のためにキャラが立つ場所は画面端固定でなく範囲指定すればいいのだ」— 通路は**画像端でなく模型（ジオラマ）の縁まで**届かせる。遷移のトリガー位置は画面端に固定せず、範囲（レンジ）で指定する。\n2. 台座・周囲の机が見えない点: 狙いではなく、割付図が画像全面を床と地形で埋めたための副作用だった。「土台の板とまわりの部屋が見えたまま」（SKILL 目標の見た目、2026-10-14承認）に戻す。体内以外にも共通。\n3. 中央の丸い部分が壁に見えて行き止まりの懸念 → 台座は廃止。中央は壁で縁取った**開けた丸い広間の床**にする（kako-jun 決定3「丸い広間に7本が接する」の本来の読み）。"
