- "決定ID": "SIT.growth-mechanism-ff2"
  "日付": "2026-10-15"
  "対象種別": "全体"
  "対象ID": "sit-by-me"
  "対象名": ""
  "決定の要点": "成長のしくみ（kako-jun 2026-10-15。FF2 を参照）: (1) アビリティ（刀）は使うほど強くならない。(2) 通常こうげきは無くす（通常こうげきだけしていればいいゲームになるため）。(3) 魔法だけが、使うほど強くなる（使用回数で成長）。その強さは4人で共有する"
  "逐語": "（逐語の引用なし。docs/decisions.md の帰属記録）"
  "出典": "docs/decisions.md の行 275（2026-10-15 kako-jun の帰属）"
  "出典URL": "https://github.com/kako-jun/sit-by-me/blob/main/docs/decisions.md#L275"
  "状態": "有効"
  "置換先": ""
  "プロンプト出力": "なし"
  "必須語": ""
  "禁止語": ""
  "対象MAP": ""
  "備考": "docs/decisions.md の行 275 の帰属記録（2026-10-15 kako-jun）。 記録の理由欄: FF2 の「使うほど成長する」を魔法にだけ採る。FF2 は武器も使うほど成長して通常攻撃だけで進められたので、そこは採らない。魔法の成長は魔法ごとに4人共有（共有ライブラリ・誰が食らっても覚える・離脱組も覚えた状態で加入する決定と整合。離脱組の成長遅れの論点が消える）。(a) 使うほど成長、(b) レベルによる魔力の自動成長のうち (a) を採る（(b) は未決。併用するか）。通常こうげきを無くす影響（要設計）: 戦闘コマンドの `たたかう`（`attack`）に代わる基本の行動が要る（systems.md のコマンド「わざ」＝刀アビリティが候補。決めない）。name-name のコマンド構成は `attack`/`spell`/`item`/`escape` で固定（`battle_command_labels` は表示名の上書きのみ）なので、コマンド構成を変えられる機能が要る（Issue 起票）。敵の通常攻撃（`こうげき`）への影響は未確認。アビリティの強化は使用回数でなく、解放段階（想像の刃の段階解放 #16・ジョブ）で行う。決めていない点: 魔法の成長の速さ・上限・コスト（MP 先の魔法の成長方針の案は、この決定で(a)に確定した。 確認: kako-jun『使うほどは魔法のみ。アビリティはその刀を装備して戦闘終了で手にはいるapでのみ』(2026-10-29)・矛盾なし。「アビリティは使うほど強くならない」は、アビリティの成長が、その刀を装備して戦闘終了時に得る AP のみという意味（SIT.post-battle-visible-growth とは矛盾しない）。 確認: kako-jun『まほうにはつかわない』(2026-10-29)・魔法の成長に AP は使わない（魔法は使うほど成長するのみ）。"
  "特徴(自由記述)": ""
