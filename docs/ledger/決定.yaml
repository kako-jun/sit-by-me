  "対象ID": "sit-by-me"
  "対象名": ""
  "決定の要点": "魔石には装備の概念がある。装備すると、その召喚獣を戦闘中に呼べる。1バトルで各人1回しか呼べない。レベルアップしたとき装備中の魔石に対応するボーナスがつき、魔石を変えても上がった分は残る。魔石の召喚獣に該当する属性が攻撃にも防御にも追加され、敵の属性攻撃への耐性がつく。タブレットの防具の属性防御と重なると、複数の属性に強い防御や、同じ属性の耐性が2重になって吸収できる場合もある。1人あたり属性を2つまでつけられる（応用のための仕組み）。"
  "逐語": "「魔石にも装備という概念があり、装備するとその召喚獣を戦闘中に呼べる。1バトルで各人1回しか呼べない。ほか、レベルアップしたときに魔石に対応するボーナスがつく。それは魔石を変えたあとも上がったぶんは残る。ほか、魔石の召喚獣に該当する属性が、攻撃にも防御にも追加される。なので敵の属性攻撃に対して耐性がつく。タブレットでの防御の属性と重なると、火にも氷にも強い防御や、火への耐性が2重になった結果、火攻撃を吸収できるようになったりもできる。1人あたり属性を2つまでつけられる応用のための仕組みだ。」"
  "出典": "Issue #134 の発言転記。元の会話そのものは未検証。"
