  "逐語": "「胴体を真ん中として頭は上方向に、両手は右上、左上方向に、足は右下、左下方向に、一本道の通路としてかけばいい。写実的にせず、現実離れした幼稚園児の想像するような架空の人間の体という抽象的な概念のマップだ。色も肌色気味でいい」「脳は迷路みたいな通路として書き、心臓や肺も単なる分岐の部屋のようにすればいい」"
