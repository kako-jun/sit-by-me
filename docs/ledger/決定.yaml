  "対象ID": "sit-by-me"
  "対象名": ""
  "決定の要点": "M001（段ボールのドラゴン）の意匠。角を稲妻のようなジグザグ形にし、目に限らずもう一か所、雷を思わせる意匠を入れる。全身（胴・翼・尾）をオレンジ段ボール下地にし、黄色いクレヨンを粗くジャギジャギ走らせる（蝋の粒・かすれ・塗りはみ出しを見せる）。観客向けの意匠で、作中の幼稚園児は雷竜を知らず意図的には模倣しない。"
  "逐語": "（逐語の引用なし。Issue記録の決定文）M001描き直し候補の追加訂正（kako-jun）: 角を稲妻のような形にする。加えて、目に限らずもう一か所、雷を思わせる意匠を入れる。全身（胴・翼・尾）をオレンジ段ボール下地にして、黄色いクレヨンを粗くジャギジャギ走らせる。丁寧な面塗りではなく、クレヨンの蝋の粒・かすれ・塗りはみ出しを見せ、見る人には雷っぽく感じさせる。作中の幼稚園児は雷竜を知らず、意図的には模倣しない。以前のM001候補は黄色が整った塗り分けで今回の仕様に合わないため、次の候補で置き換える。"
  "出典": "Issue #1 の記録"
