  "逐語": "（逐語の引用なし。Issue記録の決定文）## 追記（kako-jun 2026-10-19）\n被災後は **F12 の東から徒歩で入る（現行）のままでもよい**。先の「被災前の茂みの入口と同じ」と矛盾しないよう、入口は**同じ場所**として整理する: F12 は E29（蛸島駅）の被災後版で、同じ駅出口・線路終端の東側。被災前は E29 の東側の**茂み**を抜けて廃校の校庭へ、被災後は F12 の東の仮設導線から F18（潰れた廃校の校庭）へ。\n注意: 台帳の E29 は「東へ道路を出さない」とあるが、茂みの小径は道路ではない。E29 に東の接続口を足せるか（反対辺の規則・空き）は claude が確認し、無理なら別の被災前 MAP の道路側から入る案を台帳に書く（理由つき）。"
