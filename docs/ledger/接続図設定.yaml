- "図ID": "依存グラフ"
  "項目": "note"
  "値": "依存グラフ。判定基準=『同じ建物・扉・家具・場所を複数枚で描くか』。共有するなら先に確定した画像を参考画像として後続へ渡す（直列）。共有しないなら並列。屋内→屋外の順（扉・渡り廊下は室内が確定してから外観）。戸口で接続する2枚は扉を共有するので室内が親。道の端の連続（地面・用水の流れ）だけの接続は共有とみなさない（要確認の項目は dependency-notes.md）。TRM-01 は廃止（TRM-03 へ統合）。TRM-06〜17 の plan は別ブランチ teramachi-rest-mocks-20261023（読むだけ）。"
  "型": "文"
  "決定参照": ""
