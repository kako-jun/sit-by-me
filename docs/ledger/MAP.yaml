  "備考": "plan（平面スペック）を台帳へ取込み済み（2026-10-24）。モック画像・マスク・オクルージョンは新台帳から再生成済み（#191。docs/production/oblique-mocks/<MAP>/）。全体レビュー承認前。画像生成は承認後。屋外の見た目（建物・塀・井戸・境界・景色の扉・変化・木の帯）を台帳へ記入（#191、2026-11-02。出典は決定 TRM.looks-from-real-reference）"
  "設計意図": "井戸と用水が合流するS字。TRM-07西↔TRM-09東、上端は塀・壁で閉じる（歩行マスク=黒。外への接続なし）。水路と井戸の縁は黒マスク。"
  "plan追加JSON": "{\"boundaries\":[{\"id\":\"b-w-north\",\"rect\":[44,692,470,728],\"look\":\"道の北側（西半分）の私有地との境の古い土塀。戸室石の野面積みの低い石基礎（膝上の高さ、赤みのある石と青灰色の石が混ざる）の上に版築の土壁が大人の背より高く立ち、暗い灰黒の笠瓦が連なる。土は褪せた黄褐色で下部が剥落して石と藁すさが覗く。笠瓦の上と石基礎の肩に雪の帯。石基礎が作る段差で私有地は道より膝丈ほど高い。\"},{\"id\":\"b-diag-north\",\"poly\":[[472,694],[772,436],[772,468],[472,728]],\"look\":\"S字の斜め区間の北側。用水から分かれた細い側溝（雪解け水が流れる）と戸室石の縁石、板石の蓋がところどころ掛かる。縁に赤白のスノーポール、側溝沿いに除雪の雪山が積む。縁石の向こうは雪の私有地で膝丈の段差。\"},{\"id\":\"b-e-north\",\"rect\":[772,436,1556,470],\"look\":\"道の北側（東半分）の杉板の板塀。黒ずんだ縦張りの板塀（大人の胸の高さ）が低い石積みの基礎に載り、道側に除雪の雪を押し付けた雪の壁ができる。区間ごとに竹の支柱と藁の菰の雪囲いが掛かり、掛からない区間は板の割れと反りが見える。\"},{\"id\":\"b-w-south\",\"rect\":[44,992,568,1018],\"look\":\"道の南側（西）の雪囲いの垣。竹の四つ目垣に藁の菰を巻いた雪囲いと、雪で丸く沈む刈り込みの生垣が交互に続く。根元は戸室石の縁石で、道との境に膝丈の段差。\"},{\"id\":\"b-diag-south\",\"poly\":[[568,992],[868,732],[868,766],[568,1026]],\"look\":\"S字の斜め区間の南側。腰の高さの野面積みの低い石垣（赤みと青灰色の石、苔と霜の白）。石垣の上は私有地の雪面で、道より一段高く入れない。\"},{\"id\":\"b-e-south\",\"rect\":[870,732,1556,766],\"look\":\"道の南側（東）の側溝と縁石。コンクリートの側溝（雪解け水が流れ、鉄格子の蓋が並ぶ）と灰色の縁石、並ぶ赤白のスノーポール、除雪の雪山。縁石の向こうは雪の私有地で段差がある。\"},{\"id\":\"b-canal-b-south\",\"rect\":[460,412,1000,432],\"look\":\"用水（合流部）の南岸の石積み護岸。戸室石の野面積みで水面より膝丈ほど高く、縁に雪の帯、石の隙間に氷柱。護岸の上は雪の私有地で、水の際に近寄れない。\"},{\"id\":\"b-canal-a-west\",\"rect\":[352,100,380,410],\"look\":\"用水（上流）の西岸の石積み護岸。野面積みの戸室石、縁に雪と氷、民家の裏手側に一枚の板石の小さな渡しが架かるが雪に覆われ踏み跡がない。\"},{\"id\":\"b-canal-a-east\",\"rect\":[460,100,486,330],\"look\":\"用水（上流）の東岸の石積み護岸。野面積みの戸室石、縁に雪と氷、石の隙間に枯れ草。\"}],\"scenery_doors\":[{\"id\":\"sd-top-kuguri\",\"wall\":\"top-wall\",\"look\":\"寺の土塀の途中にある閉じた潜り戸（既定・要確認）。黒ずんだ杉板の小さな木戸（大人が屈んで通る高さ）、鉄の鋲と錆びた閂、上に小さな瓦の庇。戸の前に雪が吹き溜まり足跡はない。塀の東西の長さの左から約3分の1の位置。通行しない。\"},{\"id\":\"sd-nw-lattice\",\"wall\":\"house-nw\",\"look\":\"町家の閉じた格子戸（玄関）。細かい木の格子の引き戸が閉まり、敷居に雪。戸の前の雪の庭は雪かきされておらず、道へ踏み跡が続かない。通行しない。\"},{\"id\":\"sd-ne-gate\",\"boundary\":\"b-e-north\",\"look\":\"庫裏の閉じた冠木門。2本の太い木の柱に横木を渡し、上に黒瓦の小さな切妻屋根、杉板の両開きの戸が閉じ、錆びた鉄の閂が掛かる。柱と屋根に雪、足元に雪の塊。板塀の東半分のほぼ中ほど。通行しない。\"},{\"id\":\"sd-sw-doors\",\"wall\":\"house-sw\",\"look\":\"長屋の閉じた木の玄関戸が3つ横に並ぶ。板戸、各戸の上に雪よけの小さな庇、戸ごとに色褪せの度合いが違う。戸の前の雪は踏まれていない。戸は道に面する北面の壁にだけ描き、裏の塀に面する南面には戸を描かない。通行しない。\"},{\"id\":\"sd-se-kura\",\"wall\":\"house-se\",\"look\":\"土蔵の重い両開きの木扉が閉じる。鉄の金具と太い閂、扉の前の石の踏み段に雪が積もる。扉は道に面する北面の壁にだけ描き、裏の塀に面する南面には描かない。通行しない。\"}],\"variation\":[\"私有地の雪面に猫と鳥の足跡の点列、雪かき済みの路肩に人の足跡（合わせて6〜10か所）\",\"雪の薄い所の黒い土と枯れ草の露出（塀の根元・石垣の肩・軒下の雪が落ちた帯。5か所以上）\",\"道の縁の帯の上に、砂と泥で灰色に汚れた除雪の雪山（3〜4つ。大きさを変える）\",\"道の縁の帯に赤白のスノーポール（6〜8本。一部は傾く）\",\"路面中央の消雪パイプの散水ヘッドの穴の列（穴だけを描き水の噴射は描かない。道路の中央線の上だけに等間隔で一列。路面と同じ高さ（既定・要確認）。周りに錆色の輪と黒く濡れた艶）\",\"路面のタイヤの轍2本、泥のはね、砂と塩の白い残り\",\"道の縁の帯に電柱1〜2本（古い木製とコンクリートの混在（既定・要確認）。根元に雪山）\",\"屋根の軒のつらら、雪止め瓦で止まった雪、滑り落ちて瓦の地肌が覗く屋根\",\"庫裏の庭に雪吊りをした松1本（縄を円錐状に張る）\",\"1本だけ飛び抜けて高い古い欅の枯木（庫裏の裏。他の木の約3倍の高さ、幹が太く、枝は庫裏の屋根の上の空へ広げ、屋根の輪郭と道の上に被せない）。ほかは低い松と枯木で、長屋の裏には木を置かず低い南天だけ\",\"土塀の区間ごとの違い（古い剥落した土・塗り直した新しい土・菰を掛けた区間・掛けない区間）（既定・要確認）\"],\"tree_zones\":[{\"id\":\"tz-north-mid\",\"rect\":[490,58,1170,118]},{\"id\":\"tz-north-east\",\"rect\":[1190,58,1550,126]},{\"id\":\"tz-yard-ne\",\"rect\":[1180,386,1540,432]},{\"id\":\"tz-gap-s\",\"rect\":[510,1030,690,1215]},{\"id\":\"tz-gap-se\",\"rect\":[1110,770,1240,1210]}],\"forbid_skip\":[{\"match\":\"木は台座の縁の余白と建物の裏の余白だけ\",\"reason\":\"TRM-08 の木は tree_zones（民家の裏・民家の間の庭・塀の根元）に置く。歩く道の上には置かない（歩く床への新規物の禁止は別項で残る）\"}]}"
