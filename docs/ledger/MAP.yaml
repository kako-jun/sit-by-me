  "備考": "plan（平面スペック）を台帳へ取込み済み（2026-10-24）。2026-11-02: kako-jun の指示（Issue #191）で2DKの間取りに作り直し、モック承認を取り消し（要再モック）たうえでモックを再作成した。2026-11-02 kako-jun がモックを承認（「それでいい」、決定 TRM-12.mock-approved-191）。画像生成は承認後。2026-11-11: kako-jun の指摘（Issue #191。逐語は決定 TRM-12.neighbor-units-block）で、両隣の住戸を『中身を見せない灰色のコンクリートの塊』として台座の左右の端まで続ける形へ変え、モック承認を取り消し（要再モック）てモックを再作成した。解釈の確認は未了で、kako-jun がモック比較を見て上階の案Cを選び、「C」と回答したので『モック承認済み』に戻した（決定 TRM-12.mock-approved-191-c。範囲は案Cの選択まで。隣=灰色の塊の解釈・前縁スラブ断面・壁厚60は未回答の既定（要確認））。画像生成は kako-jun の指示後。"
  "設計意図": "車椅子の回転余地がある昭和の標準的な2DKの県営住宅の団地室。TRM-11の棟入口からドア遷移（入口は1つ。外は廊下）。玄関→台所（DK）→居室で、段差なし。両隣に住戸が続く。"
  "plan追加JSON": "{\"indoor\":true}"
  "特徴(自由記述)": "和風ではない。昭和に建てられた量産型の白いコンクリートの県営住宅。両隣にも部屋がある（団地の並んだ住戸の1室。側壁は隣室との境の壁）。隣の住戸は中身を描かず、灰色のコンクリートの塊（上面も灰色のコンクリート。部屋の壁より高く積まれて上の階を暗示し、上端は画面外で切れる）として台座の左右の端まで続く。隣との仕切りの壁は上から見て厚い鉄筋コンクリートの帯。東西の外側に雪・木は置かない（木・雪は手前=廊下側と奥=バルコニー側の外側だけ）。ワンルームではなく二部屋（2人暮らし）の2DK。入口（ドア）はただ一つで廊下に面している。風呂なし（銭湯 TRM-09 に行く）。浴室・風呂場は描かない。"
