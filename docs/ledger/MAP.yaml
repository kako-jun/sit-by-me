  "備考": "plan（平面スペック）を台帳へ取込み済み（2026-10-24）。モック画像・マスク・オクルージョンは新台帳から再生成済み（#191。docs/production/oblique-mocks/<MAP>/）。全体レビュー承認前。画像生成は承認後。敷地境界の塀の見た目のみ記入（#191、2026-11-02。団地の敷地境界は資料に無く既定（要確認）。出典は決定 TRM.looks-from-real-reference）。2026-11-11: 棟が住戸の連なりに見えるよう、南面（廊下側）に1階の1列の同じ窓の繰り返し（A棟4・B棟4・C棟10。上階の窓は描かず棟の壁高を上げて上端を画面外で切る。kako-jun 指摘 2026-11-11）。A・B棟の壁高は案Q（420）で kako-jun が確定（決定 TRM-11.mock-approved-191-q。範囲は案Qの選択まで。戸数・窓数は既定（要確認））と廊下の手すり・各戸の同じドアを look に指定（決定 TRM-11.danchi-facade-repeat。既定（要確認））。モックを再作成した。"
  "設計意図": "犀川側の県営住宅の中庭。TRM-10北↔TRM-13東（立位期だけの石段口）、棟入口→TRM-12（ドア遷移）。"
  "plan追加JSON": "{\"boundaries\":[{\"id\":\"b-entry-w\",\"rect\":[782,46,818,400],\"look\":\"TRM-10 から入る道の西縁。TRM-10 の下端から続く同じ擁壁。段丘の斜面の低い野面積みの擁壁（戸室石の赤みのある石と青灰色の石、苔と霜）の上に丸パイプの手すり。手すりの塗装は剥げて錆が出て、横木に雪が帯状に載る。擁壁の向こうは団地の敷地の外の雪の斜面で入れない。\"},{\"id\":\"b-entry-e\",\"rect\":[982,46,1018,400],\"look\":\"TRM-10 から入る道の東縁。TRM-10 の下端から続く同じ雪囲い。スロープの内側（折り返しの内）の雪囲い。縄と丸太の雪囲いと丸パイプの手すり、根元に雪をかぶった低い植え込み。柵の向こうは団地の敷地の外の雪の斜面で入れない。\"}],\"variation\":[\"ブロック塀の目地の霜と、塗装の剥げた錆が出た金網フェンスに付く雪\",\"擁壁の水抜き穴の氷柱と水垢の黒い縦筋\",\"塀・擁壁の根元に寄せた除雪の雪山\",\"雪で丸く沈んだ刈り込みの常緑の生垣\",\"中庭の石敷きの上の足跡\"]}"
  "特徴(自由記述)": "県営住宅の棟は和風ではない。昭和に建てられた量産型の白いコンクリートの団地。"
