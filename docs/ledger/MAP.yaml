  "寸法根拠": "台帳 map-topology v2 の接続行・map-specifications の寺町の行・map-asset-registry・teramachi-rebuild-candidates（TRM-01 は 2026-10-23 に TRM-03 へ統合・廃止）と Issue #51/#144 の決定。"
  "備考": "plan（平面スペック）を台帳へ取込み済み（2026-10-24）。モック画像・マスク・オクルージョンは新台帳から再生成済み（#191。docs/production/oblique-mocks/<MAP>/）。全体レビュー承認前。画像生成は承認後。屋外の見た目（建物・塀・境界・景色の扉・変化・木の帯）を台帳へ記入（#191、2026-11-02。出典は決定 TRM.looks-from-real-reference）"
  "設計意図": "寺の勝手口へ入る土塀の細道。TRM-15.bottom から入り、TRM-06.right→TRM-16.left へ戻るループの一部。住居の裏の道（map-specifications）。"
  "plan追加JSON": "{\"boundaries\":[{\"id\":\"b-lane-w-north\",\"rect\":[596,44,632,258],\"look\":\"細道の西側（庫裏の北）の寺の裏庭との境の古い土塀。笠瓦、戸室石の基礎、褪せた黄褐色の土、下部の苔と剥落。東側の土塀とあわせ、細道が土塀にはさまれる。\"},{\"id\":\"b-lane-w-south\",\"rect\":[596,822,632,926],\"look\":\"細道の西側（庫裏の南）の竹の四つ目垣と低い石積み。垣に藁の菰を巻いた雪囲い、根元に雪が溜まる。\"},{\"id\":\"b-lane-s\",\"rect\":[634,928,1556,964],\"look\":\"細道の南縁。コンクリートの浅い側溝（雪解け水が流れる）と戸室石の縁石、除雪した雪を押し付けた雪の壁。縁石の向こうは隣家の裏の雪面で段差がある。\"}],\"scenery_doors\":[{\"id\":\"sd-dobei-e-kuguri\",\"wall\":\"dobei-e\",\"look\":\"寺の土塀に埋め込まれた閉じた裏木戸（潜り戸）（既定・要確認）。黒ずんだ杉板、鉄の鋲と錆びた閂、上に小さな瓦の庇。戸の前に雪が吹き溜まり足跡はない。土塀の北寄りの位置。通行しない。\"},{\"id\":\"sd-dobei-s-gate\",\"wall\":\"dobei-s\",\"look\":\"土塀の途中の閉じた板戸の通用口。笠瓦をのせた小さな門型に閉じた古い板戸、敷居に雪。通行しない。\"},{\"id\":\"sd-neighbor-ne\",\"wall\":\"neighbor-ne\",\"look\":\"隣家の閉じた木の玄関戸（格子入りの引き戸）。戸の前に雪がそのまま積もる。通行しない。\"},{\"id\":\"sd-neighbor-se\",\"wall\":\"neighbor-se\",\"look\":\"隣家の裏の閉じた板戸の勝手口。敷居に雪、戸の脇に雪囲いの板。通行しない。\"}],\"variation\":[\"細道の中央に人の足跡、土塀の際に猫の足跡の点列（合わせて6〜10か所）\",\"雪の薄い所の黒い土と枯れ草の露出（土塀の根元・庫裏の軒下の雪が落ちた帯・南縁。5か所以上）\",\"細道の南縁の帯の内側に、砂と泥で灰色に汚れた除雪の雪山（2〜3つ）\",\"土塀の根元から路面へ流れる融雪水の筋と、濡れて黒ずんだ土の帯\",\"庫裏の軒下に積んだ薪の山と藁の菰の雪囲い、軒先のつらら\",\"細道の南の帯の内側に、古い木製の電柱1本（根元に除雪の雪山）（既定・要確認）\",\"土塀の区間ごとの違い（古い剥落した土・塗り直した新しい土・菰を掛けた区間）（既定・要確認）\",\"寺の裏庭に1本だけ飛び抜けて高い古い松（他の木の約3倍の高さ、幹が太く、枝は庫裏の屋根の上の空へ広げ、屋根の輪郭と細道の上に被せない）。ほかは低い松と枯木で、隣家の裏には木をほとんど置かない\"],\"tree_zones\":[{\"id\":\"tz-temple-back\",\"rect\":[60,56,600,240]},{\"id\":\"tz-west\",\"rect\":[60,260,170,820]},{\"id\":\"tz-southwest\",\"rect\":[60,830,600,1210]},{\"id\":\"tz-neighbor-back\",\"rect\":[1410,56,1550,630]}],\"forbid_skip\":[{\"match\":\"木は台座の縁の余白と建物の裏の余白だけ\",\"reason\":\"木は tree_zones（塀の根元・民家の間の庭・境内など実面積のある矩形）に置く。歩く道の上には置かない（歩く床への新規物の禁止は別項で残る）\"}]}"
