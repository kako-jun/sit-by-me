  "plan追加JSON": "{\"boundaries\":[{\"id\":\"b-canal-w-n\",\"rect\":[660,46,698,778],\"look\":\"用水の石積み護岸。戸室石の野面積み（赤みのある石と青灰色の石）で水面より膝丈ほど高く、縁に雪と氷の帯、石の隙間に枯れ草と氷柱。護岸の向こうは雪の私有地・境内で、水の際に近寄れない。\"},{\"id\":\"b-canal-w-s\",\"rect\":[660,942,698,1224],\"look\":\"用水の石積み護岸。戸室石の野面積み（赤みのある石と青灰色の石）で水面より膝丈ほど高く、縁に雪と氷の帯、石の隙間に枯れ草と氷柱。護岸の向こうは雪の私有地・境内で、水の際に近寄れない。\"},{\"id\":\"b-canal-e-n\",\"rect\":[772,46,808,778],\"look\":\"用水の石積み護岸。戸室石の野面積み（赤みのある石と青灰色の石）で水面より膝丈ほど高く、縁に雪と氷の帯、石の隙間に枯れ草と氷柱。護岸の向こうは雪の私有地・境内で、水の際に近寄れない。\"},{\"id\":\"b-canal-e-s\",\"rect\":[772,942,808,1224],\"look\":\"用水の石積み護岸。戸室石の野面積み（赤みのある石と青灰色の石）で水面より膝丈ほど高く、縁に雪と氷の帯、石の隙間に枯れ草と氷柱。護岸の向こうは雪の私有地・境内で、水の際に近寄れない。\"},{\"id\":\"b-stub-n1\",\"rect\":[44,758,288,792],\"look\":\"細道の北縁（西）。寺の土塀の根元の石の基礎と浅い側溝、苔と除雪の雪。土塀の向こうは雪の境内で入れない。\"},{\"id\":\"b-stub-n2\",\"rect\":[412,758,558,792],\"look\":\"細道の北縁（寺門前の石畳の東）。寺の土塀の根元の石の基礎と浅い側溝、苔と除雪の雪。\"},{\"id\":\"b-stub-n3\",\"rect\":[602,764,658,792],\"look\":\"細道の北縁（土塀と用水の間）。低い野面積みの石積みと雪囲いの竹垣。向こうは雪の空き地で入れない。\"},{\"id\":\"b-stub-s\",\"rect\":[44,928,688,962],\"look\":\"細道の南縁。コンクリートの浅い側溝と戸室石の縁石、除雪の雪山、民家の前の板塀。縁石の向こうは雪の前庭で段差がある。\"},{\"id\":\"b-gatepath-w\",\"rect\":[252,332,288,792],\"look\":\"寺門前の石畳の西の縁。低い玉石の縁取りと、雪をかぶった刈り込みの松。向こうは雪の境内で入れない。\"},{\"id\":\"b-gatepath-e\",\"rect\":[412,332,452,756],\"look\":\"寺門前の石畳の東の縁。低い玉石の縁取りと、雪をかぶった刈り込みの松。向こうは雪の境内で入れない。\"},{\"id\":\"b-diag-top-mid\",\"rect\":[810,742,860,778],\"look\":\"斜め道の縁。戸室石の縁石と石蓋の側溝、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の前庭・空き地で段差がある。\"},{\"id\":\"b-diag-nw-a\",\"poly\":[[862,778],[918,709],[890,686],[834,755]],\"look\":\"斜め道の縁。戸室石の縁石と石蓋の側溝、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の前庭・空き地で段差がある。\"},{\"id\":\"b-branch-w\",\"rect\":[882,46,918,684],\"look\":\"坂へ続く道の西縁。杉板の板塀が低い石積みの基礎に載り、竹の支柱の雪囲いが所々に掛かる。板塀の向こうは雪の空き地で入れない。\"},{\"id\":\"b-branch-e\",\"rect\":[1084,46,1122,458],\"look\":\"坂へ続く道の東縁。TRM-17 から南へ流れ下ってきた用水（この MAP を通り TRM-15 へ続く1本の用水）の石積み護岸。戸室石の野面積み（赤みのある石と青灰色の石）で水面より膝丈ほど高く、縁に雪と氷の帯、石の隙間に枯れ草と氷柱。護岸の向こうは雪の私有地・境内で、水の際に近寄れない。\"},{\"id\":\"b-diag-nw-b\",\"poly\":[[1084,504],[1210,350],[1186,330],[1084,462]],\"look\":\"斜め道の北縁（東寄り）。同じ1本の用水が道の北縁に沿って東へ流れる石積み護岸。戸室石の野面積み（赤みのある石と青灰色の石）で水面より膝丈ほど高く、縁に雪と氷の帯、石の隙間に枯れ草と氷柱。護岸の向こうは雪の私有地・境内で、水の際に近寄れない。\"},{\"id\":\"b-diag-top-e\",\"rect\":[1214,312,1554,348],\"look\":\"斜め道の北縁（東端）。同じ1本の用水の石積み護岸が、右端のつなぎ目で TRM-15 の用水に続く。戸室石の野面積み（赤みのある石と青灰色の石）で水面より膝丈ほど高く、縁に雪と氷の帯、石の隙間に枯れ草と氷柱。護岸の向こうは雪の私有地・境内で、水の際に近寄れない。\"},{\"id\":\"b-diag-bottom\",\"rect\":[810,942,938,978],\"look\":\"斜め道の縁。戸室石の縁石と石蓋の側溝、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の前庭・空き地で段差がある。\"},{\"id\":\"b-diag-se\",\"poly\":[[938,942],[1288,512],[1316,535],[966,965]],\"look\":\"斜め道の縁。戸室石の縁石と石蓋の側溝、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の前庭・空き地で段差がある。\"},{\"id\":\"b-diag-bottom-e\",\"rect\":[1290,512,1554,548],\"look\":\"斜め道の縁。戸室石の縁石と石蓋の側溝、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の前庭・空き地で段差がある。\"}],\"scenery_doors\":[{\"id\":\"sd-temple-gate\",\"wall\":\"temple-gate\",\"look\":\"寺の山門の閉じた扉。太い木の柱の間に、鉄の金具と太い閂のついた杉板の両開きの大扉が閉じる。扉の前の石畳の端から先に足跡はない。通行しない。扉の前は石畳が礎石の手前で終わり、一段高い礎石の段差が扉との間にあって上がれない。厚い雪の縁と錆びた閂で長く開けられていないと読める（段差は既定・要確認）。\"},{\"id\":\"sd-dobei-kuguri\",\"wall\":\"dobei\",\"look\":\"寺の土塀の途中にある閉じた潜り戸（既定・要確認）。黒ずんだ杉板の小さな木戸、鉄の鋲と錆びた閂、上に小さな瓦の庇。戸の前に雪が吹き溜まる。用水の側から見える位置。通行しない。\"},{\"id\":\"sd-house-ne\",\"wall\":\"house-ne\",\"look\":\"町家の閉じた格子戸。細かい木の格子の引き戸、敷居に雪。通行しない。\"},{\"id\":\"sd-house-sw\",\"wall\":\"house-sw\",\"look\":\"長屋の閉じた木の玄関戸が2つ並ぶ。戸ごとに色褪せの度合いが違う。戸の前の雪は踏まれていない。通行しない。\"}],\"variation\":[\"用水の縁の氷と雪の帯、水面の細かい波と雪解け水の筋、石橋の橋面の薄い雪\",\"道の縁の帯の上に、砂と泥で灰色に汚れた除雪の雪山（3〜4つ）\",\"道の縁の帯に赤白のスノーポール（6〜8本。一部は傾く）\",\"道の縁の帯に電柱1本（古い木製（既定・要確認）。根元に除雪の雪山）\",\"土塀の区間ごとの違い（古い剥落した土・菰を掛けた区間・掛けない区間）（既定・要確認）。寺の土塀の一部に藁の菰を掛けて縄で留める（既定・要確認）\",\"雪の薄い所の黒い土と枯れ草の露出（土塀の根元・護岸の際。5か所以上）\",\"石畳の上と細道の足跡、猫の足跡\",\"寺の境内に1本だけ飛び抜けて高い古い欅の枯木と、1本の高い古松（他の木の約3倍の高さ、幹が太く、枝は境内の上の空へ広げ、土塀・寺門の屋根の輪郭と道・用水の上に被せない）。ほかは低い松と枯木で、長屋の前には木をほとんど置かない\"],\"tree_zones\":[{\"id\":\"tz-temple-w\",\"rect\":[60,310,250,790]},{\"id\":\"tz-temple-e\",\"rect\":[456,320,552,790]},{\"id\":\"tz-east-mid\",\"rect\":[1320,560,1540,960]}],\"forbid_skip\":[{\"match\":\"木は台座の縁の余白と建物の裏の余白だけ\",\"reason\":\"木は tree_zones（塀の根元・民家の間の庭・境内など実面積のある矩形）に置く。歩く道の上には置かない（歩く床への新規物の禁止は別項で残る）\"}]}"
