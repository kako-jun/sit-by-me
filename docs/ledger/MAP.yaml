  "plan追加JSON": "{\"boundaries\":[{\"id\":\"b-fence-w-foot\",\"rect\":[46,604,700,640],\"look\":\"寺の長塀（西）の道側の根元。石の基礎が少し張り出し、足元に細い雪解け水の溝と玉石、塀に沿って除雪の雪が帯状に溜まる。\"},{\"id\":\"b-fence-e-foot\",\"rect\":[900,604,1554,640],\"look\":\"寺の長塀（東）の道側の根元。切石の基礎が張り出し、足元に石蓋の側溝、雪の帯と土の露出。\"},{\"id\":\"b-road-n-w\",\"rect\":[46,692,730,728],\"look\":\"道の北縁（西）。コンクリートの側溝（雪解け水が流れる）と灰色の縁石、除雪の雪山、赤白のスノーポールが並ぶ。縁石の向こうは雪の境内側で段差がある。\"},{\"id\":\"b-road-n-e\",\"rect\":[870,692,1554,728],\"look\":\"道の北縁（東）。戸室石の野面積みの低い石基礎（膝上の高さ）の上に版築の土壁が立つ古い土塀（暗い灰黒の笠瓦に雪の帯、下部の剥落と苔。右端のつなぎ目で TRM-08 の北縁の土塀に続く）。根元に戸室石の縁石と石蓋の側溝、除雪の雪山、赤白のスノーポール。石基礎が作る段差で私有地は道より高い。\"},{\"id\":\"b-road-s\",\"rect\":[46,992,1554,1030],\"look\":\"道の南縁。コンクリートの側溝と灰色の縁石、民家の前の雪囲い（竹の支柱と藁の菰）、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の民家の前庭で段差がある。\"},{\"id\":\"b-sando-w\",\"rect\":[672,60,730,516],\"look\":\"参道（境内側）の西の脇。低い玉石の縁取りと、雪をかぶった刈り込みの松。縁取りの向こうは雪の境内で入れない。\"},{\"id\":\"b-sando-e\",\"rect\":[870,60,928,516],\"look\":\"参道（境内側）の東の脇。低い玉石の縁取りと、雪をかぶった刈り込みの松。縁取りの向こうは雪の境内で入れない。\"}],\"scenery_doors\":[{\"id\":\"sd-fence-w-kuguri\",\"wall\":\"fence-w\",\"look\":\"寺の長塀の途中にある閉じた潜り戸（既定・要確認）。黒ずんだ杉板の小さな木戸、鉄の鋲と錆びた閂、上に小さな瓦の庇。戸の前に雪が吹き溜まり足跡はない。長塀の西端から約4分の1の位置。通行しない。\"},{\"id\":\"sd-fence-e-gate\",\"wall\":\"fence-e\",\"look\":\"寺の長塀の東寄りにある閉じた通用門。笠瓦をのせた小さな門型に杉板の両開きの戸が閉じ、錆びた鉄の閂。戸の前の雪は踏まれていない。通行しない。\"},{\"id\":\"sd-house-1\",\"wall\":\"house-1\",\"look\":\"町家の閉じた格子戸。細かい木の格子の引き戸、敷居に雪。通行しない。\"},{\"id\":\"sd-house-3\",\"wall\":\"house-3\",\"look\":\"長屋の閉じた板戸の玄関が2つ並ぶ。戸ごとに色褪せの度合いが違い、各戸の上に雪よけの小さな庇。通行しない。\"}],\"variation\":[\"路面中央の消雪パイプの散水ヘッドの穴の列（穴だけを描き水の噴射は描かない。道路の中央線の上だけに等間隔で一列。路面と同じ高さ（既定・要確認）。周りに錆色の輪と黒く濡れた艶、雪の溶けた半円）\",\"道の縁の帯の上に、砂と泥で灰色に汚れた除雪の雪山（東西に3〜4つ、大きさを変える）\",\"道の縁の帯に赤白のスノーポール（8〜10本。一部は傾く）\",\"道の縁の帯に電柱2本（古い木製とコンクリートの混在（既定・要確認）。根元に除雪の雪山）\",\"路面のタイヤの轍、泥のはね、砂と塩の白い残り、溶け残りのシャーベット雪\",\"雪の薄い所の黒い土と枯れ草の露出（長塀の根元・縁石の際。5か所以上）\",\"長塀の区間ごとの違い（古い剥落した土・塗り直した新しい土・菰を掛けた区間・笠が板の区間）（既定・要確認）\",\"山門の脇に雪吊りをした松1本（縄を円錐状に張る）\",\"境内に1本だけ飛び抜けて高い古い欅の枯木と、1本の高い古松（ほかの木の約3倍の高さ、幹が太く、枝は境内の上の空へ広げ、長塀の輪郭と道の上に被せない）。ほかは低い松と枯木で、民家の前庭には木をほとんど置かない\"],\"tree_zones\":[{\"id\":\"tz-precinct-w\",\"rect\":[60,60,690,500]},{\"id\":\"tz-precinct-e\",\"rect\":[910,60,1540,500]}],\"forbid_skip\":[{\"match\":\"木は台座の縁の余白と建物の裏の余白だけ\",\"reason\":\"木は tree_zones（塀の根元・民家の間の庭・境内など実面積のある矩形）に置く。歩く道の上には置かない（歩く床への新規物の禁止は別項で残る）\"}]}"
