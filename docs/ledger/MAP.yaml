  "寸法根拠": "台帳 map-topology v2 の接続行・map-specifications の寺町の行・map-asset-registry・teramachi-rebuild-candidates（TRM-01 は 2026-10-23 に TRM-03 へ統合・廃止）と Issue #51/#144 の決定。"
  "備考": "plan（平面スペック）を台帳へ取込み済み（2026-10-24）。モック画像・マスク・オクルージョンは新台帳から再生成済み（#191。docs/production/oblique-mocks/<MAP>/）。全体レビュー承認前。画像生成は承認後。屋外の見た目（建物・塀・境界・景色の扉・変化・木の帯）を台帳へ記入（#191、2026-11-02。出典は決定 TRM.looks-from-real-reference）"
  "設計意図": "寺町台地の入口の坂。擁壁と石積み、細い用水、坂の上に寺の屋根。北上しつつ蛇行して段丘へ。車椅子主坂。"
  "plan追加JSON": "{\"boundaries\":[{\"id\":\"b-top-w\",\"rect\":[782,46,818,169],\"look\":\"坂の縁。戸室石の縁石と石蓋の側溝（融雪水が流れる）、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の斜面・私有地で段差がある。\"},{\"id\":\"b-top-e\",\"rect\":[982,46,1020,267],\"look\":\"坂の縁。戸室石の縁石と石蓋の側溝（融雪水が流れる）、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の斜面・私有地で段差がある。\"},{\"id\":\"b-nw-diag\",\"poly\":[[420,369],[818,169],[802,137],[404,337]],\"look\":\"坂の縁。戸室石の縁石と石蓋の側溝（融雪水が流れる）、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の斜面・私有地で段差がある。\"},{\"id\":\"b-w-vert\",\"rect\":[382,375,418,747],\"look\":\"坂の西縁（擁壁の足元）。石積みの擁壁の根元の石蓋の側溝と、苔・枯れ草・除雪の雪山。擁壁は立ち上がって入れない。\"},{\"id\":\"b-sw-diag\",\"poly\":[[420,751],[918,1001],[902,1033],[404,783]],\"look\":\"坂の縁の低い野面積みの石積み（赤みのある石と青灰色の石、苔と霜）の上に雪囲いの竹垣。向こうは雪の斜面で入れない。\"},{\"id\":\"b-bottom-w\",\"rect\":[882,1003,918,1224],\"look\":\"坂の縁の低い野面積みの石積み（赤みのある石と青灰色の石、苔と霜）の上に雪囲いの竹垣。向こうは雪の斜面で入れない。\"},{\"id\":\"b-bottom-e\",\"rect\":[1082,903,1108,1224],\"look\":\"坂の東縁と用水の間。戸室石の縁石と、用水の石積み護岸。護岸の向こうは用水で、水の際に近寄れない。\"},{\"id\":\"b-canal-e\",\"rect\":[1162,802,1198,1224],\"look\":\"用水の東岸の石積み護岸。野面積みの戸室石、縁に雪と氷、石の隙間に枯れ草。護岸の向こうは雪の私有地で入れない。\"},{\"id\":\"b-ne-diag\",\"poly\":[[1080,899],[582,649],[598,617],[1096,867]],\"look\":\"坂の縁。戸室石の縁石と石蓋の側溝（融雪水が流れる）、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の斜面・私有地で段差がある。\"},{\"id\":\"b-bend-vert\",\"rect\":[582,505,620,610],\"look\":\"坂の縁。戸室石の縁石と石蓋の側溝（融雪水が流れる）、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の斜面・私有地で段差がある。\"},{\"id\":\"b-se-diag\",\"poly\":[[582,471],[980,271],[996,303],[662,470]],\"look\":\"坂の縁。戸室石の縁石と石蓋の側溝（融雪水が流れる）、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の斜面・私有地で段差がある。\"}],\"scenery_doors\":[{\"id\":\"sd-house-e\",\"wall\":\"house-e\",\"look\":\"町家の閉じた格子戸。細かい木の格子の引き戸、敷居に雪。戸の前の雪は踏まれていない。通行しない。\"},{\"id\":\"sd-house-sw\",\"wall\":\"house-sw\",\"look\":\"長屋の閉じた木の玄関戸が3つ並ぶ。戸ごとに色褪せの度合いが違い、各戸の上に雪よけの小さな庇。通行しない。\"},{\"id\":\"sd-closure-w1\",\"wall\":\"closure-w1\",\"look\":\"擁壁の上の土塀にある閉じた潜り戸（既定・要確認）。黒ずんだ杉板の小さな木戸、鉄の鋲と錆びた閂、上に小さな瓦の庇。戸の前に雪が吹き溜まり足跡はない。通行しない。\"}],\"variation\":[\"坂の縁の帯に赤白のスノーポール（8〜10本。一部は傾く）\",\"坂の路面の融雪水の筋、砂の撒布跡、轍、足跡\",\"擁壁の水抜きの穴から垂れる氷柱と、石を伝う融雪水の筋、石の間の苔と枯れ草\",\"寺の本堂の屋根の雪が滑り落ちて覗く瓦の地肌、軒先のつらら\",\"坂の縁の帯の内側に、砂と泥で灰色に汚れた除雪の雪山（3つ。折り返しの踊り場の脇に寄せる）\",\"坂の縁の帯に電柱1本（古い木製（既定・要確認）。根元に除雪の雪山）\",\"雪の薄い所の黒い土と枯れ草の露出（擁壁の根元・民家の軒下。5か所以上）\",\"寺の境内の端に1本だけ飛び抜けて高い古い欅の枯木と、1本の高い古松（他の木の約3倍の高さ、幹が太く、枝は本堂の屋根の上の空へ広げ、屋根の輪郭と道に被せない）。ほかは低い松と枯木で、長屋の前には木をほとんど置かない\"],\"tree_zones\":[{\"id\":\"tz-temple-north\",\"rect\":[520,60,700,190]},{\"id\":\"tz-east-north\",\"rect\":[1030,60,1190,740]},{\"id\":\"tz-east-mid\",\"rect\":[1200,520,1540,780]},{\"id\":\"tz-east-south\",\"rect\":[1200,820,1540,1210]}],\"forbid_skip\":[{\"match\":\"木は台座の縁の余白と建物の裏の余白だけ\",\"reason\":\"木は tree_zones（塀の根元・民家の間の庭・境内など実面積のある矩形）に置く。歩く道の上には置かない（歩く床への新規物の禁止は別項で残る）\"}]}"
