  "plan追加JSON": "{\"boundaries\":[{\"id\":\"b-paving-n\",\"rect\":[46,696,732,732],\"look\":\"石畳の北縁。段丘の石垣の足元の石積みと、浅い石蓋の側溝（雪解け水が流れる）、苔と枯れ草、除雪の雪山。石積みの向こうは雪の斜面で段差がある。\"},{\"id\":\"b-paving-s\",\"rect\":[46,868,732,904],\"look\":\"石畳の南縁。民家の前の低い石垣と刈り込みの生垣（雪で丸く沈む）、戸室石の縁石、赤白のスノーポール。縁石の向こうは雪の前庭で段差がある。\"},{\"id\":\"b-stairs-w\",\"rect\":[698,642,732,694],\"look\":\"石段の下端の西側の石積み（石垣の延長）。野面積みの石に苔と霜、手すりの支柱の根元。\"},{\"id\":\"b-stairs-e\",\"rect\":[868,334,906,866],\"look\":\"石段の東の縁。低い野面積みの石垣と、手すりの支柱、石垣の上の枯れ草と雪。石垣の向こうは雪の庭で入れない。\"}],\"scenery_doors\":[{\"id\":\"sd-closure-n1\",\"wall\":\"closure-n1\",\"look\":\"石垣の上の土塀にある閉じた潜り戸（既定・要確認）。黒ずんだ杉板の小さな木戸、鉄の鋲と錆びた閂、上に小さな瓦の庇。戸の前に雪が吹き溜まり足跡はない。通行しない。\"},{\"id\":\"sd-house-e\",\"wall\":\"house-e\",\"look\":\"町家の閉じた格子戸。細かい木の格子の引き戸、敷居に雪。戸の前の雪は踏まれていない。通行しない。\"},{\"id\":\"sd-house-sw\",\"wall\":\"house-sw\",\"look\":\"民家の閉じた木製の玄関戸（板の戸）。戸の前に雪が積もる。通行しない。\"}],\"variation\":[\"石段の各段に薄く積もった雪と、段の中央の踏み跡（足跡）、手すりの錆と霜\",\"石垣の水抜きの隙間から垂れる氷柱と、石を伝う融雪水の筋、石の間の苔と枯れ草\",\"石畳の上の足跡と撒いた砂、縁の除雪の雪山（2〜3つ）\",\"石畳の縁の帯に赤白のスノーポール（4〜6本）\",\"雪の薄い所の黒い土と枯れ草の露出（石垣の根元・民家の軒下。5か所以上）\",\"石畳の縁の帯に古い木製の電柱1本（根元に除雪の雪山）（既定・要確認）\",\"石垣の上の段丘に1本だけ飛び抜けて高い古い松と、1本の高い古い欅の枯木（他の木の約3倍の高さ、幹が太く、枝は石垣の上の空へ広げ、石段の上に被せない）。ほかは低い松と枯木で、南の民家の前には木をほとんど置かない\"],\"tree_zones\":[{\"id\":\"tz-terrace-nw\",\"rect\":[60,60,540,690]},{\"id\":\"tz-terrace-ne\",\"rect\":[1110,60,1540,470]},{\"id\":\"tz-south-gap\",\"rect\":[510,930,890,1215]}],\"forbid_skip\":[{\"match\":\"木は台座の縁の余白と建物の裏の余白だけ\",\"reason\":\"木は tree_zones（塀の根元・民家の間の庭・境内など実面積のある矩形）に置く。歩く道の上には置かない（歩く床への新規物の禁止は別項で残る）\"}]}"
