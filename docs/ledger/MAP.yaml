  "plan追加JSON": "{\"boundaries\":[{\"id\":\"b-sento-w\",\"rect\":[46,432,378,466],\"look\":\"道の北縁（銭湯の西）。左端のつなぎ目では TRM-08 の北縁から続く杉板の板塀（黒ずんだ縦張り、大人の胸の高さ、低い石積みの基礎、道側に除雪の雪の壁）が立ち、銭湯に近づくと隣の古い土塀（笠瓦に雪、戸室石の基礎、剥落と苔）に変わる。その根元の側溝と除雪の雪山。\"},{\"id\":\"b-sento-e\",\"rect\":[984,432,1180,466],\"look\":\"道の北縁（銭湯の東）。銭湯の薪置き場の板塀（黒ずんだ杉板、薪が見える）と石の基礎、足元の雪の帯。\"},{\"id\":\"b-apron-w\",\"rect\":[342,402,378,468],\"look\":\"銭湯前の石畳の西の縁。低い玉石の縁取りと雪をかぶった刈り込み。\"},{\"id\":\"b-apron-e\",\"rect\":[982,402,1018,468],\"look\":\"銭湯前の石畳の東の縁。低い玉石の縁取りと雪をかぶった刈り込み。\"},{\"id\":\"b-road-s\",\"rect\":[46,732,1018,768],\"look\":\"道の南縁。コンクリートの側溝と灰色の縁石、民家の前の板塀（黒ずんだ杉板）と雪囲い、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の前庭で段差がある。\"},{\"id\":\"b-slope-w\",\"rect\":[982,732,1018,1224],\"look\":\"下り坂の西縁。野面積みの低い石積みの擁壁（苔と霜）と縁石。擁壁の上は雪の私有地で入れない。\"},{\"id\":\"b-slope-e\",\"rect\":[1182,470,1252,1224],\"look\":\"下り坂の東縁（段丘の縁）。雪囲い（竹の支柱と藁の菰）と低い石積み。その向こうは犀川側へ落ちる雪の斜面で入れない。\"}],\"scenery_doors\":[{\"id\":\"sd-sento-entrance\",\"wall\":\"sento\",\"look\":\"銭湯の玄関。無地の藍色の暖簾が下がり、木の格子戸が閉まっている。玄関脇に木の下駄箱の棚、敷居に雪。通行しない。敷居の前に一段高い石の段差があり、前庭の床とはつながらない（段差は既定・要確認）。\"},{\"id\":\"sd-sento-woodshed\",\"boundary\":\"b-sento-e\",\"look\":\"銭湯の薪置き場の閉じた板戸。黒ずんだ杉板に錆びた閂、戸の前に雪が吹き溜まる。通行しない。\"},{\"id\":\"sd-house-sw\",\"wall\":\"house-sw\",\"look\":\"町家の閉じた格子戸。細かい木の格子の引き戸、敷居に雪。通行しない。\"},{\"id\":\"sd-house-e\",\"wall\":\"house-e\",\"look\":\"民家の閉じた木製の玄関戸（すりガラスは描かず板の戸にする）。戸の前の雪は踏まれていない。通行しない。\"}],\"variation\":[\"煙突の頂から立ち昇る白い湯気と、銭湯の屋根の排気口から出る薄い湯気\",\"銭湯前の路面の黒く濡れた艶、水たまりの薄い氷、溶けた雪の筋\",\"銭湯の屋根の雪に付いた煤の灰色の筋、軒先のつらら\",\"道の縁の帯の上に、砂と泥で灰色に汚れた除雪の雪山（3つ。大きさを変える）\",\"道の縁の帯に赤白のスノーポール（5〜7本）\",\"道の縁の帯に電柱1本（銭湯への引込み線の古い木製（既定・要確認）。根元に除雪の雪山）\",\"石畳の上の下駄と長靴の足跡、雪をかぶった自転車\",\"雪の薄い所の黒い土と枯れ草の露出（塀の根元・煙突の下の地面。5か所以上）\",\"銭湯の裏に1本だけ飛び抜けて高い古い欅の枯木（他の木の約3倍の高さ、幹が太く、枝は煙突の輪郭に被せない）。ほかは低い松と枯木\"],\"tree_zones\":[{\"id\":\"tz-sento-back-w\",\"rect\":[60,56,340,400]},{\"id\":\"tz-sento-back-e\",\"rect\":[1110,56,1540,460]},{\"id\":\"tz-south-gap\",\"rect\":[520,780,970,1216]}],\"forbid_skip\":[{\"match\":\"木は台座の縁の余白と建物の裏の余白だけ\",\"reason\":\"木は tree_zones（塀の根元・民家の間の庭・境内など実面積のある矩形）に置く。歩く道の上には置かない（歩く床への新規物の禁止は別項で残る）\"}]}"
