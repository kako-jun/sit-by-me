  "plan追加JSON": "{\"boundaries\":[{\"id\":\"b-w1\",\"rect\":[982,46,1018,200],\"look\":\"段丘の斜面の低い野面積みの擁壁（戸室石の赤みのある石と青灰色の石、苔と霜）の上に丸パイプの手すり。手すりの塗装は剥げて錆が出て、横木に雪が帯状に載る。擁壁の向こうは雪の斜面で入れない。\"},{\"id\":\"b-w2\",\"poly\":[[1018,237],[320,457],[320,421],[1018,201]],\"look\":\"段丘の斜面の低い野面積みの擁壁（戸室石の赤みのある石と青灰色の石、苔と霜）の上に丸パイプの手すり。手すりの塗装は剥げて錆が出て、横木に雪が帯状に載る。擁壁の向こうは雪の斜面で入れない。\"},{\"id\":\"b-w3a\",\"rect\":[282,463,318,558],\"look\":\"段丘の斜面の低い野面積みの擁壁（戸室石の赤みのある石と青灰色の石、苔と霜）の上に丸パイプの手すり。手すりの塗装は剥げて錆が出て、横木に雪が帯状に載る。擁壁の向こうは雪の斜面で入れない。\"},{\"id\":\"b-w3b\",\"rect\":[282,702,318,854],\"look\":\"段丘の斜面の低い野面積みの擁壁（戸室石の赤みのある石と青灰色の石、苔と霜）の上に丸パイプの手すり。手すりの塗装は剥げて錆が出て、横木に雪が帯状に載る。擁壁の向こうは雪の斜面で入れない。\"},{\"id\":\"b-w4\",\"poly\":[[320,860],[818,1060],[818,1094],[320,894]],\"look\":\"段丘の斜面の低い野面積みの擁壁（戸室石の赤みのある石と青灰色の石、苔と霜）の上に丸パイプの手すり。手すりの塗装は剥げて錆が出て、横木に雪が帯状に載る。擁壁の向こうは雪の斜面で入れない。\"},{\"id\":\"b-w5\",\"rect\":[782,1096,818,1224],\"look\":\"段丘の斜面の低い野面積みの擁壁（戸室石の赤みのある石と青灰色の石、苔と霜）の上に丸パイプの手すり。手すりの塗装は剥げて錆が出て、横木に雪が帯状に載る。擁壁の向こうは雪の斜面で入れない。\"},{\"id\":\"b-e1\",\"rect\":[1182,46,1220,359],\"look\":\"スロープの内側（折り返しの内）の雪囲い。縄と丸太の雪囲いと丸パイプの手すり、根元に雪をかぶった低い植え込み。柵の向こうは雪の斜面で入れない。\"},{\"id\":\"b-e2\",\"poly\":[[1180,363],[482,583],[482,617],[1180,397]],\"look\":\"スロープの内側（折り返しの内）の雪囲い。縄と丸太の雪囲いと丸パイプの手すり、根元に雪をかぶった低い植え込み。柵の向こうは雪の斜面で入れない。\"},{\"id\":\"b-e3\",\"rect\":[482,581,520,746],\"look\":\"スロープの内側（折り返しの内）の雪囲い。縄と丸太の雪囲いと丸パイプの手すり、根元に雪をかぶった低い植え込み。柵の向こうは雪の斜面で入れない。\"},{\"id\":\"b-e4\",\"poly\":[[482,742],[980,942],[980,908],[482,708]],\"look\":\"スロープの内側（折り返しの内）の雪囲い。縄と丸太の雪囲いと丸パイプの手すり、根元に雪をかぶった低い植え込み。柵の向こうは雪の斜面で入れない。\"},{\"id\":\"b-e5\",\"rect\":[982,948,1020,1224],\"look\":\"スロープの内側（折り返しの内）の雪囲い。縄と丸太の雪囲いと丸パイプの手すり、根元に雪をかぶった低い植え込み。柵の向こうは雪の斜面で入れない。\"}],\"scenery_doors\":[{\"id\":\"sd-house-nw\",\"wall\":\"house-nw\",\"look\":\"民家の閉じた木製の玄関戸（板の戸）。戸の前に雪かきされていない雪が積もる。通行しない。\"},{\"id\":\"sd-house-ne\",\"wall\":\"house-ne\",\"look\":\"町家の閉じた格子戸。細かい木の格子の引き戸、敷居に雪。通行しない。\"},{\"id\":\"sd-house-se\",\"wall\":\"house-se\",\"look\":\"土蔵造りの商家の重い両開きの木扉が閉じる。鉄の金具と太い閂、扉