  "plan追加JSON": "{\"boundaries\":[{\"id\":\"b-a-n-w\",\"rect\":[46,312,593,348],\"look\":\"道に沿う細い用水（幅は大人の歩幅1つ分ほど。TRM-16 の用水に連なる。既定（要確認））。戸室石の野面積みの護岸、水面は灰青で雪解け水が流れ、縁に氷と雪の帯。護岸の向こうは雪の私有地で入れない。\"},{\"id\":\"b-a-diag-ne\",\"poly\":[[596,346],[983,727],[1006,704],[618,324]],\"look\":\"道に沿う細い用水（幅は大人の歩幅1つ分ほど。TRM-16 の用水に連なる。既定（要確認））。戸室石の野面積みの護岸、水面は灰青で雪解け水が流れ、縁に氷と雪の帯。護岸の向こうは雪の私有地で入れない。\"},{\"id\":\"b-a-s-w\",\"rect\":[46,512,527,548],\"look\":\"道の南縁（西）。コンクリートの側溝と灰色の縁石、除雪の雪山、赤白のスノーポール。縁石の向こうは民家の雪の前庭で段差がある。\"},{\"id\":\"b-a-diag-sw1\",\"poly\":[[527,512],[632,615],[607,641],[502,538]],\"look\":\"斜めの区間の南西縁（西側）。戸室石の縁石と石蓋の側溝、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の前庭で段差がある。\"},{\"id\":\"b-a-diag-sw2\",\"poly\":[[771,750],[936,911],[913,941],[771,775]],\"look\":\"斜めの区間の南西縁（東側）。戸室石の縁石と石蓋の側溝、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の前庭で段差がある。\"},{\"id\":\"b-branch-w\",\"rect\":[596,650,632,1224],\"look\":\"細道の西縁。杉板の板塀が低い石積みの基礎に載り、竹の支柱の雪囲いが所々に掛かる。板塀の向こうは雪の庭で入れない。南端（TRM-06 との境）に近づくと、板塀は寺の古い土塀（版築の土壁、暗い灰黒の笠瓦に雪の帯、戸室石の野面積みの基礎、下部の剥落と苔。TRM-06 の細道の土塀と同じもの）に変わって続く。\"},{\"id\":\"b-branch-e\",\"rect\":[772,802,808,1224],\"look\":\"細道の東縁。杉板の板塀と、雪で丸く沈む刈り込みの生垣が交互に続く。根元は戸室石の縁石で段差がある。南端（TRM-06 との境）に近づくと、板塀は寺の古い土塀（版築の土壁、暗い灰黒の笠瓦に雪の帯、戸室石の野面積みの基礎、下部の剥落と苔。TRM-06 の細道の土塀と同じもの）に変わって続く。\"},{\"id\":\"b-roadb-n\",\"rect\":[1008,694,1554,728],\"look\":\"広い道の北縁。コンクリートの側溝と灰色の縁石、除雪の雪山と赤白のスノーポール。縁石の向こうは雪の空き地で段差がある。\"},{\"id\":\"b-roadb-s\",\"rect\":[942,992,1554,1026],\"look\":\"広い道の南縁。コンクリートの側溝と灰色の縁石、民家の前の雪囲い、除雪の雪山と赤白のスノーポール。縁石の向こうは雪の前庭で段差がある。\"}],\"scenery_doors\":[{\"id\":\"sd-house-nw\",\"wall\":\"house-nw\",\"look\":\"町家の閉じた格子戸。細かい木の格子の引き戸、敷居に雪。戸の前の雪は踏まれていない。通行しない。\"},{\"id\":\"sd-house-ne\",\"wall\":\"house-ne\",\"look\":\"寺の坊の閉じた門。2本の太い木の柱に横木を渡した冠木門で、杉板の両開きの戸が閉じ、錆びた鉄の閂。柱に雪、足元に雪の塊。通行しない。\"},{\"id\":\"sd-house-sw\",\"wall\":\"house-sw\",\"look\":\"長屋の閉じた木の玄関戸が3つ並ぶ。戸ごとに色褪せの度合いが違い、各戸の上に小さな庇。戸の前の雪は踏まれていない。通行しない。\"},{\"id\":\"sd-house-se\",\"wall\":\"house-se\",\"look\":\"民家の閉じた木製の玄関戸（板の戸）。敷居に雪。通行しない。\"}],\"variation\":[\"火の見櫓の部材（筋交い・踊り場・半鐘の屋根）に載る雪と、足元の踏み固めた雪\",\"用水の縁の氷と雪の帯、水面の細かい波と雪解け水の筋\",\"道の縁の帯の上に、砂と泥で灰色に汚れた除雪の雪山（3〜4つ）\",\"道の縁の帯に赤白のスノーポール（6〜8本。一部は傾く）\",\"広い道の路面中央の消雪パイプの散水ヘッドの穴の列（穴だけを描き水の噴射は描かない。道路の中央線の上だけに等間隔で一列。路面と同じ高さ（既定・要確認）。周りに錆色の輪と黒く濡れた艶）\",\"道の縁の帯に電柱1本（古い木製（既定・要確認）。根元に除雪の雪山）\",\"道の路面のタイヤの轍、泥のはね、砂と塩の白い残り、足跡\",\"雪の薄い所の黒い土と枯れ草の露出（板塀の根元・軒下。5か所以上）\",\"北の敷地に1本だけ飛び抜けて高い古い欅の枯木と、1本の高い古い松（他の木の約3倍の高さ、幹が太く、枝は火の見櫓より低く保ち、櫓の輪郭に被せない）。ほかは低い松と枯木で、長屋の前には木をほとんど置かない\"],\"tree_zones\":[{\"id\":\"tz-north-mid\",\"rect\":[440,60,860,300]},{\"id\":\"tz-east-mid\",\"rect\":[1100,340,1540,680]},{\"id\":\"tz-west-south\",\"rect\":[60,560,490,700]}],\"forbid_skip\":[{\"match\":\"木は台座の縁の余白と建物の裏の余白だけ\",\"reason\":\"木は tree_zones（塀の根元・民家の間の庭・境内など実面積のある矩形）に置く。歩く道の上には置かない（歩く床への新規物の禁止は別項で残る）\"}]}"
