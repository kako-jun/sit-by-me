  "plan追加JSON": "{\"boundaries\":[{\"id\":\"b-ground-w\",\"rect\":[2,425,22,1250],\"look\":\"境内の西の境。寺の古い土塀（版築の土壁、暗い灰黒の釉薬瓦の笠に雪の帯、戸室石の野面積みの基礎、下部の剥落と苔。釉薬瓦と基礎は既定・要確認）。土塀の向こうは雪の私有地・隣の敷地で入れない。\"},{\"id\":\"b-ground-sw\",\"rect\":[24,1252,708,1270],\"look\":\"境内の南西の境（参道の西）。寺の古い土塀（版築の土壁、暗い灰黒の釉薬瓦の笠に雪の帯、戸室石の野面積みの基礎、下部の剥落と苔。釉薬瓦と基礎は既定・要確認）。道側の根元に雪かきで寄せた雪が溜まる。\"},{\"id\":\"b-ground-se\",\"rect\":[892,1252,1590,1270],\"look\":\"境内の南東の境（参道の東・園庭の南）。寺の土塀の根元の石の基礎と浅い側溝、苔と除雪の雪。寺の古い土塀（版築の土壁、暗い灰黒の釉薬瓦の笠に雪の帯、戸室石の野面積みの基礎、下部の剥落と苔。釉薬瓦と基礎は既定・要確認）。\"}],\"variation\":[\"土塀の再築した区間（色が均一で笠瓦がきれい）と古い区間（土色が褪せ下部が剥落）の混在（既定・要確認）\",\"土塀の根元の黒い土と枯れ草の露出\",\"参道の石畳の上の足跡\",\"境内の雪の薄い所の土の露出\"]}"
