  "plan追加JSON": "{\"boundaries\":[{\"id\":\"b-cliff\",\"rect\":[500,262,1100,298],\"look\":\"手すりの向こうの段丘の斜面。雪の急斜面に葉を落とした枯木の梢が覗き、下方に黒瓦の家並みの屋根が連なる。落ち込んでいて入れない。\"},{\"id\":\"b-plaza-w\",\"rect\":[462,342,498,738],\"look\":\"広場の西の縁。低い野面積みの石垣と刈り込みの生垣（雪で丸く沈む）。向こうは民家の雪の前庭で入れない。\"},{\"id\":\"b-plaza-e1\",\"rect\":[1102,342,1140,416],\"look\":\"広場の東の縁（学校側の道の北）。低い石積みの縁と雪囲いの竹垣。向こうは雪の前庭で入れない。\"},{\"id\":\"b-plaza-e2\",\"rect\":[1102,584,1140,738],\"look\":\"広場の東の縁（学校側の道の南）。低い石積みの縁と雪囲いの竹垣。向こうは雪の前庭で入れない。\"},{\"id\":\"b-plaza-s-w\",\"rect\":[500,742,732,778],\"look\":\"広場の南縁（石段の西）。戸室石の縁石と石蓋の側溝、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の斜面で段差がある。\"},{\"id\":\"b-plaza-s-e\",\"rect\":[868,742,1100,778],\"look\":\"広場の南縁（石段の東）。戸室石の縁石と石蓋の側溝、除雪の雪山、赤白のスノーポール。縁石の向こうは雪の斜面で段差がある。\"},{\"id\":\"b-road-n\",\"rect\":[1142,382,1554,418],\"look\":\"学校側の道の北縁。コンクリートの側溝と縁石、除雪の雪山と赤白のスノーポール。縁石の向こうは民家の雪の前庭で段差がある。\"},{\"id\":\"b-road-s\",\"rect\":[1142,582,1554,618],\"look\":\"学校側の道の南縁。コンクリートの側溝と縁石、除雪の雪山と赤白のスノーポール。縁石の向こうは民家の雪の前庭で段差がある。\"},{\"id\":\"b-stairs-w\",\"rect\":[696,780,732,1224],\"look\":\"石段の西の縁。低い野面積みの石垣と手すりの支柱、石垣の上の枯れ草と雪。向こうは雪の庭で入れない。\"},{\"id\":\"b-stairs-e\",\"rect\":[868,780,904,1224],\"look\":\"石段の東の縁。低い野面積みの石垣と手すりの支柱、石垣の上の枯れ草と雪。向こうは雪の庭で入れない。\"}],\"scenery_doors\":[{\"id\":\"sd-house-w\",\"wall\":\"house-w\",\"look\":\"町家の閉じた格子戸。細かい木の格子の引き戸、敷居に雪。通行しない。\"},{\"id\":\"sd-house-ne\",\"wall\":\"house-ne\",\"look\":\"民家の閉じた木製の玄関戸（板の戸）。戸の前の雪は踏まれていない。通行しない。\"},{\"id\":\"sd-house-sw\",\"wall\":\"house-sw\",\"look\":\"土蔵造りの商家の重い両開きの木扉が閉じる。鉄の金具と太い閂、扉の前の踏み段に雪。通行しない。\"}],\"variation\":[\"広場の石敷きの上の足跡と撒いた砂、縁の除雪の雪山（3つ。大きさを変える）\",\"手すりの横木に帯状に載る雪、塗装の剥げた錆の赤茶、霜\",\"石段の各段の薄い雪と中央の踏み跡、手すりの錆\",\"広場と道の縁の帯に赤白のスノーポール（8〜10本）\",\"学校側の道の縁の帯に電柱1本（古い木製（既定・要確認）。根元に除雪の雪山）\",\"雪の薄い所の黒い土と枯れ草の露出（石垣の根元・民家の軒下。5か所以上）\",\"手すりの向こうの斜面の梢に1本だけ飛び抜けて高い古い欅の枯木（他の木の約3倍の高さ。幹が太く、梢は斜面の上の空に収め、手すりの輪郭と歩ける床の上に被せない）。ほかは低い松と枯木\"],\"tree_zones\":[{\"id\":\"tz-slope-north\",\"rect\":[500,50,1100,255]},{\"id\":\"tz-south-gap\",\"rect\":[510,790,690,1210]},{\"id\":\"t