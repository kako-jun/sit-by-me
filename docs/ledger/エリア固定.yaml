- "エリアID": "teramachi"
  "項目": "slab.look"
  "値": "段ボールの台座。側面（前縁の帯）は波形の段ボール断面を主役にする: 波形（フルート）の縦線を約10px間隔で前縁の全長に細かく描き、線ごとに濃淡をつけ、上端と下端に茶色の細い縁取り、マスキングテープ数枚、白い糊の垂れ。上面は綿の雪を盛る土台。素材（段ボール・綿の雪）を変えない。"
  "型": "文"
  "決定参照": ""
- "エリアID": "teramachi"
  "項目": "trees.note"
  "値": "寺町の木は松と枯木の2種に固定。本数と比率は既定（要確認）。"
  "型": "文"
  "決定参照": "TRM.trees-pine"
