  "型": "文"
  "決定参照": ""
- "エリアID": "teramachi"
  "項目": "trees.pine.look"
  "値": "雪をかぶった日本の松。幹は太くうねり、太い枝が横へ張り出し、針葉は段状の丸い房（雲形）になる。和風の盆栽のような形で、1本ずつ幹の曲がりと枝ぶりを変える。紙粘土の幹とスポンジ・綿の針葉。"
  "型": "文"
  "決定参照": ""
