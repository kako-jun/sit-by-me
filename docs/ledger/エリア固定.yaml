- "エリアID": "teramachi"
  "項目": "status_note"
  "値": "机の天面は採用済み4枚（幼稚園・本堂・住居・境内外観）に共通する見た目を既定として固定（要確認）。板目の向きは4枚中3枚が画面の左右方向（本堂は混在）の実測から『横』を既定にした。"
  "型": "文"
  "決定参照": "TRM.desk"
- "エリアID": "teramachi"
  "項目": "desk.look"
  "値": "温かい茶色の木の板張りの机の天板。細長い板を並べた板目と節・小さな傷。板目（板の継ぎ目と木目の流れ）は画面の左右方向（横）に走る。台座の外側いっぱいに広がる。机の材質・色・板目の向きを変えない（MAPごと・テイクごとに変えない）。"
  "型": "文"
  "決定参照": ""
