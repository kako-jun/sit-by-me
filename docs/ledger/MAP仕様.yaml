- "仕様ID": "SPEC-017"
  "MAP_ID": "KRB-05"
  "原文ID表記": "KRB-05"
  "節": "香林坊〜武蔵ヶ辻"
  "時期": "壮年（ラスボス付近）"
  "一言特徴": "デパート4階（隠し階・条件つき）"
  "経路・通行": "door-elevator（階選択遷移。選択肢に出る条件はシナリオ側）"
  "暫定固定": "最初は無く、最終章で兼六園へ向かう途中にデパートに寄り道すると、階選択で4階も選べるようになる(決定 2026-10-19)。最終章の兼六園への道（茶屋街→香林坊→広坂→兼六園）の途中の、香林坊のデパートに入ると階選択に4階が出る。専用イベントなし（デパートに入ること自体が条件。kako-jun決定 2026-10-19、#87）。強い何か=ものまね（FF5/6の隠しアビリティに相当。kako-jun決定 2026-10-19、#87）。魔法扱い（パーティ共通の共有ライブラリ。全員が使える）。4階の敵は「鏡」=映った自分たち自身（パーティの姿）で、ボス扱い。兼六園の最終救済には出ない（これまでのボスは兼六園でも雑魚敵として出さない）ので、ものまねはここでしか覚えられない。鏡の技「ものまね」を食らった味方が戦闘終了時に自動でラーニング（既存規則）。ものまねの効果=直前の味方の行動を、ノーコスト（MP・AP等の消費なし）で真似る。敵の行動は真似ない（回数・対象の選び方などの細部は未決）。要確認(#87): 鏡の敵の新規ID・映り込みの流用方法（鏡像・色味・何人映るか。味方の映り込みを流用できるならしたい。実現可否と作り方は要確認）・戦闘仕様。行き方は決定済み: エレベーターの扉→階選択ウィンドウ（B案）。4階は最終章の兼六園途中の寄り道で選択肢に出る。実在店に似せないジオラマ。画像生成blocked。"
