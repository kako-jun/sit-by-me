  "暫定固定": "2階は最初から解放されている（解放条件なし。kako-jun決定 2026-10-19）。隠し階（#87の決定 2026-10-19）。階移動はエレベーターだけ（扉に入るとウィンドウで階を選ぶ）。2階は四角い吹き抜けの廊下だけのフロアで売場は無い（kako-jun決定 2026-10-19、#87）。中央の吹き抜けから下の1階が見えるが侵入はできない。歩行域=廊下の環のみ、吹き抜け部分はblocked。見える1階=KRB-02(同じ場所を2階から見下ろす視点で描く。決定 2026-10-19)。契約: KRB-02の背景を作るときはKRB-03の吹き抜け越しの絵と整合させる(KRB-02の吹き抜け・時計・床の見た目が共通の参照)。吹き抜けの縁では落下しない（見えるだけで侵入不可、落下イベントなし。吹き抜けは歩行不可のblockedで、落下の仕組みは無い。kako-jun決定 2026-10-19、#87）。隠し階（2階）への行き方は決定済み: エレベーターの扉に入ると階選択ウィンドウで選ぶ（箱はMAPにしないB案）。KRB-04（3階・玩具売場）とKRB-03は無関係（決定 2026-10-19）。実在店に似せないジオラマ。画像生成blocked。"
