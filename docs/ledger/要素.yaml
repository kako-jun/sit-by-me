  "要素ID": "block-a"
  "種別": "壁"
  "名称": "県営住宅 A棟（棟入口）"
  "建物部位ID": ""
  "見た目": "昭和に建てられた量産型の白いコンクリートの団地棟（A棟）。一軒家に見せない: 同じ形の住戸が5戸、横に連なる長い板状の棟（既定・要確認）。4階建（既定・要確認）で、画面に見える南面（廊下側・片廊下型）は1階の1列の同じ並びの繰り返し（上の階の窓は描かず、棟が画面の上端で切れて上の階が続くことを示す）: 1階の廊下の手すり（腰高のコンクリートの腰壁に丸パイプの手すり。棟の端から端まで切れ目なく続く）、その奥に各戸の玄関の鉄のドア（公団型スチールドアに倣った同じ形・同じ色）と、戸の隣の台所の小さな窓1つ（窓は計画の窓の位置どおり）。1階の4つの同じ窓（と同じドア）を一つずつ同じ寸法で並べ、戸ごとに形を変えない。モックの濃いピンクの戸口（TRM-11.door）だけが出入口で、他の戸のドアは出入口ではない飾りの繰り返し。裏面（北・バルコニー側）は画面に見えず描かない: 各戸に掃き出し窓とベランダ（吹き放し・サンルーム化していない）が同様に連なる（既定・要確認）。面は打ち放しの質感: 型枠の継ぎ目、ひび、水垢の黒い縦筋、手すりの錆、腰壁の上の雪の染み。"
  "決定参照": "TRM-danchi.showa-white-concrete;TRM-11.danchi-block-spec;TRM-11.danchi-facade-repeat"
  "属性JSON": "{\"color\":\"#d9d3c4\",\"h\":420,\"kind\":\"building\",\"rect\":[60,150,780,380],\"top_color\":\"#6c7077\",\"window_count\":4}"
  "特徴(自由記述)": ""
