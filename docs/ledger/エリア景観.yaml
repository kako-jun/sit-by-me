      【仮想】風除け: 海に面した側に高さ5m ほどの竹の垣（間垣）か板を打った風除け、根元に綿の雪が吹き溜まり。間垣は輪島側の特徴なので、使うなら NTB-03・NTB-05 の海側に1区画に留める。
      【仮想】海: 鉛色。岸の岩とテトラポッドに白い泡（波の花）がまとまって付き、風に飛ばされた泡が道路に点々と残る。
      【仮想】山: 杉は濃い緑の円錐、枝に雪。低木の茂みは枯れ茶の塊に雪帽子。
      【仮想】船揚げ場: 斜路のコンクリートに濡れた黒い苔。屋根付きの小屋は波板トタン、雪が薄く載る。漁具（浮き、網、発泡スチロール箱）が雪に半分埋まる。路面は濡れた黒い舗装、端に圧雪の灰色の線。
      【仮想】廃校の中庭（NTB-08）: 窓ガラスが抜けた木造2階建ての校舎、軒先の雪が庇を作り中庭に厚く積もる。
      【仮想】NTB-01 駅: 小さなコンクリートの駅舎（低い箱型）、1面1線のホーム、車止めで線路が終わる、外は雪の綿。NTB-02 漁村坂: 両脇に黒瓦の家と石垣、海は下に鉛色。NTB-03: 杉林、枯れた畑、木の小さな社と雪を載せた屋根。NTB-04: 船揚げ場の屋根・斜路・波の花。NTB-05: 黒瓦・白壁と板壁・窓の橙明かり。NTB-06: 荒波・白い泡・立入禁止の標識。
  "描いてはいけないもの": |-
