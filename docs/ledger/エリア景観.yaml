      【砂丘の規模】約10km×約1km、平均標高約20m。横列砂丘で、冬の季節風（西風）と海岸流が砂を運んで形成。[高]
      【植生】ニセアカシア（白い花）、クロマツ、ネムノキ。防砂林は接収の見返り事業で大規模植林、背後に農地と住宅地。夏はハマナス。[中]
      【風車】サンセットウイング内灘。ローターまで65m、羽根の先で約100m、2003年に発電開始。1〜4月の西風で発電量が多い。[中]
      【海岸】浜は水際まで約200m（別資料で300m超）。風紋、足跡、貝殻。町指定のシロチドリ。海岸沿いに道路とサイクリングロード。[中]
      【施設】サンセットブリッジ内灘（斜張橋）、道の駅サンセットパーク、風と砂の館。[中]
      【鉄道】金沢駅から北陸鉄道浅野川線で約17分、内灘駅から海岸まで徒歩約15分（ゲームの内灘線は架空）。[高]
      【気象】雨が多く湿度が高い。高い山から離れているため雨雪は県内では少なめ。[高]
      【歴史】米軍試射場接収と内灘闘争。粟ヶ崎遊園（失われたレトロ遊園地）。[高]
