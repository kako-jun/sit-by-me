- "エリアID": "teramachi"
  "一言で言い当てる特徴": "道沿いに途切れず続く寺院の古い土塀（版築の土壁＋戸室石の低い石の基礎＋笠）が主役の、犀川の南西側の高台（寺町台）の寺と住居の町。寺の境内には飛び抜けて高い古木があり、木の大きさは均等でない。"
  "実景の特徴": |-
      【土塀】旧野田道沿いの旧野田寺町は、直線上に寺院の土塀が道沿いに連なる（寺町として特徴的な景観）。[複数出典]
      【土塀】旧野田道は1921年の市電敷設に伴って拡幅されたが、土塀の再築により寺社の連続する景観が保たれている。つまり再築（新しい）部分と古い部分が混じる。金沢市は1970年度から寺院等土塀山門修復事業補助制度を持つ。[1出典]
      【石の基礎】寺町寺院群の石積みは赤と青の2色の戸室石が特徴で、通りに連なる寺社の土台を支える。[1出典]
      【土塀の構造】版築（rammed earth）で重く頑丈、低い野面積みの石垣の上に造り、上に雨除けの小さな傾斜屋根（笠）を載せる。これは長町武家屋敷跡の解説であり、寺町の土塀も近いと推定（要確認）。笠の材質は瓦か板かで資料が割れる（長町の大屋家は東・南が瓦葺き、北が木端葺き）。[転用・1出典]
      【配置】旧鶴来道沿いの泉寺町は、通りからは寺社が直接見えにくく、通り沿いには門前の町家が連なる（寺は町家の背後）。野田寺町は直線の道沿いに寺院が並ぶ。保存地区は52寺院。[1出典]
      【建物】寺院本堂は切妻造平入または妻入が多く、江戸期のものが密に残る。門前町家は真壁造・切妻平入・桟瓦葺・二階建が基本で平屋もある。[1出典]
      【門】寺町通り沿いの寺の薬医門（柱の下に邪鬼の石像）、山門の前の垣根に雪吊りをした例、山門が通りから奥まって距離がある寺（龍渕寺）。[口コミ・各1件]
      【木】長久寺は樹齢約400年のギンモクセイの大木2本が並ぶ（本堂の屋根よりはるかに大きい）。龍渕寺は寺地全体が市の保存樹林で杉・赤松・樫・欅と竹林があり薄暗い。同一寺院内でも高木・竹林・低い刈り込みが混在する。[口コミ中心・長久寺の樹齢400年は百科事典でも一致]
      【坂・段丘】犀川から寺町へ上がる長い階段（W坂＝石伐坂）、頂上は開けた広場。寺町台は犀川を越えた高台（段丘）上にある。六斗の広見は藩政時代の火除け地が由来の市内最大の広見。[複数出典]
      【電線】地区として無電柱化・軒下配線を進めている（皆無とは限らない）。[1出典]
  "出典": |-
      https://www.pref.ishikawa.lg.jp/kyoiku/bunkazai/kisya-happyou/documents/jyuden.pdf
      https://www.bunka.go.jp/seisaku/bunkazai/shokai/hozonchiku/pdf/94428201_24.pdf
