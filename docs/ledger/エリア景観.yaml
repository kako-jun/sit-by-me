  "信頼度": "百科事典・自治体資料は1〜複数出典。広坂の規模・並木、犀川大橋の塗色、アトリオの吹き抜けは検索要約のみ（要裏取り）。"
  "冬の姿(確認できたもの)": |-
      金沢市は消雪パイプ等の消融雪装置273km、排雪場8か所で、バス路線・幹線道路896kmと歩行者の多い歩道165kmを除雪の重点にする。市民には道路や用水路に雪を出さないよう呼びかけている。[1出典]
      茶屋街は雪の日の散策が勧められる一方「雪が降ると不便なことも多い」。[1出典]
      犀川大橋は国道157号の幹線で除雪・融雪の対象になる。[推論。橋ごとの消雪装置は未確認]
  "冬の景色の仮想表現": |-
      【仮想】香林坊（KRB-01）: 交差点の四隅を、高さの違う紙箱のビル4〜5棟で固める。百貨店は大きな直方体に白い紙貼りで窓の列を横にひき、隣の複合ビルはガラス面を青いセロファンで表す。角にバス停の屋根（透明プラ板）。歩道の端に除雪で寄せた綿の雪山が縁石に沿って連なり、車道は灰色の砂、白線は白い砂。交差点の一角に地下駐車場の出入口（斜めに下る黒いスロープ、入口に雪の吹き溜まり）。広場にメグスリノキの小さな枯れ木。
      【仮想】デパート内（KRB-02〜06）: 雪は靴の水滴と傘立てで表す。窓の外は鉛色の曇天と横に流れる雪。床は濡れた艶。
      【仮想】犀川鉄橋（KRB-07）: ワーレントラス（連続した三角形の骨組み）の鉄橋を細い木ひごで組み、青緑のグラデーションに塗る。上弦に綿の雪が細く載る。川は雪解けの濁った水。岸は雪を被った石積み、柳の枯れ木の枝先に雪。
      【仮想】茶屋道（KRB-08）: 石畳（灰色の小さな紙やすり片、目地に雪）。両側に高さの揃った2階建ての町家。1階は黒い木ひごの出格子、2階も格子窓と障子の薄明かり、黒い瓦の屋根の軒に綿の雪が厚く載って先が垂れる。外壁は暗い木と土の色で、弁柄色は主役にしない（室内の色）。軒先の小さな赤い提灯は夜景の定番としての創作。通りは狭く、雪かきされた細い黒い筋だけが人の通る幅。
      【仮想】茶室（KRB-09）: 室内。朱や群青の壁に雪明かりの障子、間仕切りのない広い座敷。
      【仮想】コンビニ（KRB-10）: 駐車場の端に綿を盛った除雪の雪山（表面は砂をまぶした汚れた灰色）、軒に氷柱。
      【仮想】武蔵ヶ辻（KRB-11）: 十字の大交差点、バスの屋根が連なり大きな横断歩道。市場入口は屋根付きアーケード（屋根は透明プラ板に雪、柱は割り箸。現状の屋根材は未確認）。
      【仮想】広坂（KRB-12）: 幅広の坂道。中央分離帯に細い水路（透明レジンの薄い帯、縁に雪）と、雪を被った松と桜の枯れ木を間隔を置いて並べる。両側に赤煉瓦（赤い厚紙）の古い校舎とアカマツ、アメリカフウの高い枯れ木。坂の先に松が石垣の上から枝を張り出す（石垣は兼六園側の景で広坂通りそのものにあるとは未確認）。
      【仮想】病院（KRB-13）: 白い2階建て・車寄せ・スロープ、坂の途中に建つ。車寄せの庇に厚い雪、スロープは雪かき済みの黒い筋。実在の病院を写さない。
  "描いてはいけないもの": |-
      主計町茶屋街（浅野川沿い・千本格子・暗がり坂・桜）やひがし茶屋街（広見）の特徴をにし茶屋街に混ぜない。弁柄色を外壁の主役にしない。
      兼六園の雪吊り・石垣を広坂や市街地に持ち込まない。2013年に武蔵ヶ辻で行われた金箔の雪吊り型オブジェは一過性の装飾で常設の景色ではない。
      大和4階の時計サロンとアトリオの時計を混同しない。実在の特定病院・実店舗の外観を写さない。
  "確認できなかったこと": |-
      香林坊交差点を横断する歩行者用の地下入口があるか。
      にし茶屋街の通り幅・石畳の色・外壁の色・提灯の有無・冬の雪囲い。
      広坂通りの石垣、冬の用水の状態（凍るか雪の下か）、雪吊りの有無。近江町市場アーケードの現在の屋根材。
      犀川岸の柳の実在（柳の枯れ木はエリア固定の決定であり、実景の裏付けは未確認）。北陸の私立病院の外観資料。
  "備考": "エリア固定: 木は枯木（川岸は柳の枯れ木）と松。市街地の道路は灰色の砂のアスファルト＋白い砂の白線（art-direction）。大和8階レストラン街は実在、ゲーム内は5階（決定済み）。"
- "エリアID": "station"
  "一言で言い当てる特徴": "2本の太い木の柱が螺旋状に組み上がり反った屋根を載せる高さ約13.7mの木造の門（鼓門）と、その背後の3,019枚のガラスとアルミ合金の大屋根（もてなしドーム＝雨や雪の日に傘を差し出す意匠）。"
  "実景の特徴": |-
      【鼓門】加賀宝生（能楽）の鼓をイメージした木造の門。高さ約13.7m、集成材、2005年3月20日完成。柱は2本で螺旋状に組み上げ、屋根は緩やかに反る。柱の中には天井に溜まった雨や雪を流す水管が通る（消雪用かは未確認）。[複数出典]
      【ライトアップ】鼓門は日没から24時まで毎正時に2分間、加賀五彩（臙脂・藍・黛・黄土・古代紫）でライトアップ。[1出典]
      【もてなしドーム】「駅を降りた人に傘を差し出す、もてなしの心」を表現した、3,019枚のガラスとアルミ合金のドーム。東口大屋根はアルミ合金のシステムトラス、スパン約80m・奥行約60m・最高約30m。[ドームは複数出典、大屋根の寸法は検索要約のみ]
      【駅】高架駅。ホーム全体が雪害対策で屋根に覆われる（4番線のみ屋根なし）。ドームの内部に地下広場、駅前広場の地下に北鉄金沢駅、東口バスターミナルが広場にある。中2階の待合室に能登ヒバの壁と輪島塗の展示。[1出典]
      【広場の木】広場の木の樹種は確認できなかった。木は松で決定済み（kako-jun 指示）。
  "出典": |-
      https://ja.wikipedia.org/wiki/金沢駅
      https://matcha-jp.com/jp/1109
      https://tabi-mag.jp/is0391/
      https://www.aluminum.or.jp/alken/event/pdf/20231115.pdf（検索要約）
      調査メモ: area-landscape-A.md 第2章（2026-11-02）
  "信頼度": "鼓門・ドームの基本事実は百科事典＋観光サイトで複数出典。大屋根の寸法は検索要約のみ。冬の運用（融雪設備・傘貸出）は未確認。"
  "冬の姿(確認できたもの)": |-
      設計の考え方自体が「雨や雪の多い金沢で傘を差し出す」。[複数出典]
      ホーム全体が雪害対策の屋根に覆われる。[1出典]
      雨雪の日にガラス天井・床の反射・傘の人流が金沢らしい、は撮影ガイドの見方。[検索要約のみ]
  "冬の景色の仮想表現": |-
      【仮想】STN-01（左右対称、手前から奥へ）: 中央に鼓門。太い木の2本柱（茶色の丸棒に螺旋の溝を細い紐で巻く）、柱頭に舟のように両端が反った屋根（厚紙を曲げた濃い茶）。柱の頂に綿の雪が載り、屋根の反りに沿って雪が滑り落ちた跡（屋根の中央だけ薄く茶色が覗く）。
      【仮想】門の背後に、半透明プラ板を菱形の格子（細い銀の線）に割ったガラスの大屋根。ガラスの稜線ごとに雪が薄く縞状に載る（大屋根の積雪の実景は未確認）。
      【仮想】広場は雪かきされた弧を描く黒い道（下の左右へ）、その外側に綿の雪。松は雪をかぶった和風の形（決定済み）で門の脇に数本。夜は鼓門の足元がうっすら赤紫・藍に光る（加賀五彩のライトアップは実景、色の出し方は仮想）。
      【仮想】傘の人（小さな紙人形）が数人、色とりどりの傘を差す（傘の人流は撮影ガイドの見方に基づく創作）。
  "描いてはいけないもの": |-
      兼六園・金沢城の要素（石垣・雪吊り）を駅前に混ぜない。
      もてなしドームを「駅舎の屋根」にしない（広場側の大屋根）。
      西口（金沢港口）の景を混ぜない。鼓門・ドームは東口（兼六園口）の景。
  "確認できなかったこと": |-
      広場の木の樹種と本数、噴水・水時計の現況。
      鼓門・ドームの融雪設備、傘の無料貸出。
      鼓門の木の色、屋根の厳密な形。柱の螺旋の巻き数。
  "備考": "エリア固定: 木は松のみ（kako-jun 指示「金沢駅の木は松だ」）。MAP は STN-01 の1枚。"
- "エリアID": "castle"
  "一言で言い当てる特徴": "【江戸時代（幕末・1858年以降）の姿に統一した、金沢城（イマジナリー）】天守のない白い城。白漆喰の塗り込め壁・腰の海鼠壁・銀白の鉛瓦の屋根と、台地の上に重なる石垣の段々。中心は本丸ではなく二の丸の大きな御殿（約3,200坪）。"
  "実景の特徴": |-
      【時代の統一】kako-jun 決定（2026-11-02）: 金沢城はイマジナリー（想像の城）で、復元前の姿＝江戸時代の姿、時代は幕末（1858年以降）。現況の復元工事（仮囲い・足場）・近代の要素は描かない。三十間長屋（1858年再建）・鶴丸倉庫（1848年建替）・河北門（1772年再建）・橋爪門（1809年再建）が建つ。[公式サイト複数ページ]
      【天守】天守は1602年に落雷で焼失、再建されず。代わりの三階櫓（3重）も1759年の大火で焼失し以後再建されず。1759年以降、本丸の櫓群は再建されず、幕末の本丸には三十間長屋だけ（本丸附段）。[公式サイト]
      【中枢】1631年の大火後に二の丸が拡張されて城の中枢になった。二の丸御殿は約3,200坪・60超の部屋。玄関は総ケヤキ造りで前田家の梅鉢紋と「波に犀」の彫刻、表式台は63畳で壁や襖に金箔、障壁画は若松、虎の間は岸駒の虎。1808年に二の丸全焼、翌年再建。表向の能舞台は1759年の大火後再建されず。[公式サイト・複数出典。御殿の屋根材は未確認]
      【外観の3点セット】白漆喰の大壁・腰の海鼠壁・銀白の鉛瓦（完成直後は鼠色、酸化や雨で銀白色）。屋根の軒丸瓦に梅鉢紋。櫓や長屋の石落しに唐破風・入母屋の出窓。[公式サイト複数ページ]
      【石川門（現存・重文、搦手）】高麗門→枡形→櫓門（櫓部 桁行24.9m・棟高12.04m、唐破風の出し1）、南に菱形平面の二重櫓（棟高13.55m）、続櫓は一重。鉛瓦、白漆喰、腰回りに海鼠壁、隅柱は鉄板包み。左右に太鼓塀。1788年再建。石垣は枡形正面が切石積み、南側は粗加工石積みで大型の刻印。[公式サイト・Wikipedia複数出典。門前の橋は公式に記述なし]
      【河北門】実質的な正門。一の門（総欅の高麗門）、二の門（二階の櫓門）、枡形土塀（表は漆喰壁、内部は石垣の「かくし石垣」）。1772年再建の姿はニラミ櫓がなく出し付きの土塀。[公式サイト]
      【橋爪門】二の丸御殿に至る最後の門で最も格式が高い。一の門（高麗門）→二重塀に囲まれた城内最大の枡形（445m²）→二の門（櫓門、鉛瓦、門内に番所、床に戸室石）→続櫓（三層三階、物見櫓）。1808年焼失・1809年再建。[公式サイト]
      【菱櫓・五十間長屋】1632年創建、1809年再建の建物が明治14年まで残った。菱櫓は三層三階・入母屋・唐破風の石落し・鉛瓦・海鼠壁・総漆喰塗込で、平面は80度と100度の菱形、江戸後期の金沢城で最も高い建物。五十間長屋は二層二階の多聞櫓で各所に石落し、普段は倉庫。[公式サイト]
      【三十間長屋（現存・重文）】幅約5.3m×長さ約48.2m・高さ約8.9m、二階建て、壁は漆喰・腰に海鼠瓦。安政の再建時は板葺きで、後に瓦葺、1969年の保存修理で現在の鉛瓦葺き（公式サイトの別ページは鉛瓦葺きと記し食い違う）。西面が本来の表側で唐破風と千鳥破風があり城下町に向いていた。[公式サイト]
      【鶴丸倉庫（現存・重文）】東の丸附段、1848年建替。現存する江戸期の城郭土蔵で建築面積最大。腰壁に灰緑色の凝灰岩。鶴の丸の土塀は太鼓塀（海鼠壁）で内部に小石を詰め裏に隠し狭間。[公式サイト・Wikipedia]
      【鼠多門】玉泉院丸にあり城外の金谷出丸への出入口。櫓門・入母屋・木造二階建て、鉛瓦、白漆喰、腰壁の海鼠壁は目地が黒漆喰（他の門と異なる）。木橋（鼠多門橋）は城内最大規模。[公式サイト]
      【石垣】戸室山産の戸室石。赤みがかった灰色の「赤戸室石」と青みがかった灰色の「青戸室石」の対比（どの石垣がどちらかは記述なし）。公式の積み方の区分は自然石積み（東の丸北面、初期）・粗加工石積み（二の丸など郭の外周）・切石積み（門や庭園など人目につく場所）。色紙短冊積みは玉泉院丸に面する石垣群。金場取り残し積み（三十間長屋）・鏡積み（尾坂門）・亀甲石（土橋門）。[公式サイト]
      【玉泉院丸庭園】1634年に三代利常が作庭。池泉回遊式、辰巳用水が水源、池底から周囲の石垣の最上段まで約22m、色紙短冊積みの石垣と一体の滝（発掘で4段、1856年に造られた）。橋は木橋・石橋・土橋。1688年に千宗室に命じて亭・露地・花壇。廃藩まで存続。[公式サイト・国交省資料で複数出典。現況の庭は2015年の復元で玉泉庵・唐傘・舟小屋は現代の施設]
      【堀・城の枠組み】台地先端の平山城、本丸と城外周の高低差約30m、区域約30ha。外堀は大手堀・いもり堀・蓮池堀・白鳥堀の4つ（いもり堀は江戸期は幅最大約40m・深さ10m以上の水堀）。1632年に辰巳用水が開かれ城内に水が引かれた。[公式サイト]
  "出典": |-
      https://shiro-niwa.pref.ishikawa.lg.jp/kanazawa-castle/explore/change.php（縄張りの変遷）
      https://shiro-niwa.pref.ishikawa.lg.jp/kanazawa-castle/explore/feature.php（金沢城の特徴）
