      https://www.pref.ishikawa.lg.jp/kisya/h30/documents/0123kanko.pdf（冬の段ライトアップ案内）
      https://ja.wikipedia.org/wiki/辰巳用水
      調査メモ: area-landscape-A.md 第4章（2026-11-02）
  "信頼度": "雪吊りの数値は石川県の公式一次資料（令和7年）で1出典（年により数が違う）。園内の各所の寸法・来歴は百科事典＋観光サイトで1〜複数出典、根上松・花見橋・夕顔亭は検索要約のみ。"
  "冬の姿(確認できたもの)": |-
      雪吊り: 2025年は11月1日9時に唐崎松から着手し12月中旬完了。りんご吊り50本（唐崎松・巣籠り松ほか）、幹吊り59本（根上松・播州松ほか）、その他約700か所（ツツジほか）。わら縄約4,000kg（径6mmと8mm）。芯柱はアテ丸太と真竹。延べ約500人。[公式一次資料]
      撤去は3月15日から約1週間、唐崎松は最後。[1出典]
      雪をまとった雪吊りは円錐形のシルエット。[1出典]
      霞ヶ池に映る雪吊り、徽軫灯籠・内橋亭・噴水を、冬の夜間ライトアップ「幽玄空間」で照らす。[1出典]
  "冬の景色の仮想表現": |-
      【仮想】雪吊りの松（夕方）: 割り箸か竹串の芯柱を松の幹の脇に1本立て（唐崎松のみ5本）、先端から細い白糸を放射状に垂らして各枝の先に結び、全体で円錐のシルエットにする。糸は唐崎松で非常に多く密に、他の松は少なく。松の枝は水平に張り、上に綿の雪。松ごとに幹の曲がり・高さ・枝ぶりを変える。
      【仮想】梅は葉のない細い枝、先に薄い雪、1本ごとに形を変える。夕方の光は橙〜桃色が雲の隙間から差し、池面が濁った空を映す。池の水は鏡のように灰青で、岸は雪を被った石組み。
      【仮想】唐崎松（GRD-06）: 5本の高い芯柱と放射状の糸、横に長く張り出した大きな松。ゲームの中でもっとも雪吊りが映える場所。
      【仮想】徽軫灯籠（GRD-05）: 高さ約2.7mの二股の脚の石灯籠（灰色の紙粘土）、片脚は池の水中・片脚は岸の石、脚の長さが違う、頭に雪の帽子。
      【仮想】根上松（GRD-07）: 細い水路（透明レジンの薄い帯、縁に雪）が築山の裾を巡る。根が足のように何十本も立つ（根の本数・高さは1出典のため数値を固定しない）。幹に縄を縦に添わせる幹吊り。
      【仮想】時雨亭・長谷池（GRD-02）: 低い瓦屋根（茶色の厚紙、雪が厚く載る）の茶屋、池は凍りかけて縁が白い、細い枝の枯れ梅を数本（梅林は約半世紀で幹は細めで揃い気味）。
      【仮想】瓢池・夕顔亭・翠滝（GRD-03）: ひょうたん形の小池、中島に小さな石塔、亭は小さな茅葺き風（屋根材は未確認）、翠滝は細い白い水の筋で滝壺なし、苔の緑が雪から覗く。栄螺山（GRD-04）: 土を盛った円錐形の小山、頂に三重の小さな石塔、渦巻く道は螺旋の確認が取れていないため創作。
      【仮想】入口（GRD-01・10）: 真弓坂口は雪かき済みの石の坂道と脇の松の低い雪吊り。桂坂口・石川橋（GRD-10）: 坂を上りきると霞ヶ池が見渡せる、橋の向こう（北）は金沢城石川門、下を道路が走る高低差。
  "描いてはいけないもの": |-
      雪吊りを金沢城（玉泉院丸）・広坂・駅前へ持ち込まない（兼六園の特徴）。武蔵ヶ辻の金箔の雪吊り型オブジェは一過性の装飾。
      梅林を古木にしない（整備から約半世紀）。桂坂口と真弓坂口を取り違えない。
      こも掛け（土塀の雪囲い）は長町武家屋敷が知られ、兼六園での実施は確認できていない。
  "確認できなかったこと": |-
      唐崎松が霞ヶ池の東岸にあることの公式本文確認。根上松の樹高（11m／15m）と根の盛り上がりの高さ。
      栄螺山の螺旋の道、長谷池・夕顔亭の屋根材。梅林の品種数・本数・配置。
      園内のこも巻き（土塀などの雪囲い）の有無。雪の積もる深さと園路の除雪の実態。梅林・曲水など他の見どころの冬の姿。
  "備考": "エリア固定: 木は雪吊りの松と枯れ梅。art-direction は兼六園を夕方で描く。雪吊りの数は年により違う。"
- "エリアID": "mountain"
  "一言で言い当てる特徴": "浅野川の東岸、寺と坂と階段が迷路のように重なる斜面を、木立と展望台へ折れ曲がりながら登る城下町裏手の小さな里山（標高141m）。登るほど金沢の街・河北潟・日本海が下に広がる。"
  "実景の特徴": |-
      【位置・標高】標高141.15m、山頂に二等三角点。金沢城を見下ろす位置のため江戸時代は庶民の登山が禁止された。[高]
      【公園】卯辰山公園は約67ha・1914年開園の総合公園。循環園路、望湖台・見晴らし台・横空台・眺望の丘・四百年の森・花菖蒲園などの区画。[高]
      【山麓】浅野川に隣接し、坂道・長い階段・迷路のような小路が続き、約50の寺社が点在する。[高]
      【展望】望湖台（山頂部）から金沢市街・日本海・河北潟、医王山・宝達山・金沢城址公園が見える。眺望の丘は金沢駅〜河北潟を見渡す（階段しかない）。[中]
      【登山道】小道が各所にあり整備されている。窯の横や四百年の森付近に階段。春日山方面の途中に竹林（風で鳴る）。各所にベンチ。春日山112mの標識、愛宕・卯辰・豊国の三社が並ぶ。[中・2024年1月の個人記録]
      【木】四百年の森に桜約300本、花木園にツツジ約8,000本、花菖蒲園に木道。秋は11月下旬〜12月上旬に紅葉。[中]
      【歴史】春日窯（九谷焼再興）、養生所跡、1958〜1993年の金沢ヘルスセンター（遊興施設）、泉鏡花句碑、徳田秋聲文学碑、相撲場。[高]
  "出典": |-
      https://ja.wikipedia.org/wiki/卯辰山
      https://www4.city.kanazawa.lg.jp/soshikikarasagasu/midoritohananoka/gyomuannai/5/1/9410.html
      https://www.kanazawa-kankoukyoukai.or.jp/feature/temples/kokoro/index.html
      https://tabi-mag.jp/is0377/ ・ https://yamap.com/activities/29048597/article ・ https://www.minnacamera.com/spots/1766
      https://www.data.jma.go.jp/niigata/menu/kisetsu/2021winter.pdf ・ https://www.data.jma.go.jp/niigata/menu/kisetsu/2025winter.pdf（北陸の冬の一般）
      調査メモ: area-landscape-B.md 第1章（2026-11-02）
  "信頼度": "位置・規模・山麓は公的資料・百科事典で高。展望・登山道・木は観光・個人記録で中。冬の実景は薄い。"
  "冬の姿(確認できたもの)": |-
      冬晴れは夜景・日本海・白山方面が狙い目。雪化粧の景色も四季の一つとして紹介。冬は凍結で滑りやすい。雨天は坂と落ち葉で滑りやすい。[中]
      北陸の冬一般: 寒波の年は降雪量がかなり多く、暖冬の年は少ない。12月は冬型が続きやすく日照が少ない傾向。[高。ただし卯辰山固有の数値は未確認]
  "冬の景色の仮想表現": |-
      【仮想】全体: 低い里山。綿の雪は薄めで、道の中央は人の通り道として土の茶と濡れた石が見える。杉は暗緑、広葉の枯木は茶の枝に綿を点付け。竹は少数の細い棒が雪の重みで曲がる。登山道は茶色の厚紙＋灰色の砂（踏み固めた雪解けの濡れ道）、階段は段ボールを重ねた段、手すりは割り箸、石垣は灰色紙粘土の積み。道の幅は車椅子で押せる幅を保ち、階段は景観の脇（リポ決定どおり）。
      【仮想】UTS-01（浅野川橋の先の寺門の登り口）: 川沿いの平場→橋→麓の寺の石段・小路。橋は低い木桁で欄干に雪。寺門は小さな屋根つきで雪の庇、門脇に石灯籠に綿の帽子。小路は左右の寺塀の隙間だが寺町の土塀と同じにせず、石段と生垣・低い石積みを混ぜる。杉の根元だけ雪が薄く濡れた石と落ち葉と泥。
      【仮想】UTS-02（廃遊具の脇の山腹道）: ベンチは雪の座面、竹林の細い葉が雪で垂れる、錆びたジャングルジムを雪が半分埋める（廃遊具はゲーム内設定で実景なし）。
      【仮想】UTS-03（展望東屋を回り込む尾根道）: 四角い屋根の東屋に厚い雪、手すり柵に雪、尾根は左右が落ちて遠景の街と海の灰色帯が見える（東屋の実在は未確認）。
      【仮想】UTS-04（崩れた石垣を避けるヘアピン坂）: 山麓の石積みの雰囲気（坂・階段・石積み）を転用し、苔と雪の混じった石積みが一部崩れて土と根が見える、柵で黒マスク、主坂は踏み固めた雪（崩れた石垣はゲーム設定）。
      【仮想】UTS-05（氷の召喚獣と対峙する風穴のある山頂広場）: 凍った広場、雪を被った標識、岩肌に口を開ける小さな風穴、氷の柱（風穴は実景で確認できずゲーム設定）。
  "描いてはいけないもの": |-
      山麓の寺の坂と階段を、寺町台（TRM）の「古い土塀の列」と同じ見た目にしない。ひがし茶屋街の格子の町家を混ぜない。
      公園の花の名所（桜・ツツジ・花菖蒲）は春夏の観光要素。冬の絵には枝だけで入れ、花は出さない。
      サニーランド跡（ゲーム固有設定）を実在のヘルスセンターの事実と取り違えない。廃遊具・東屋・崩れた石垣・風穴は実景で確認できないゲーム内設定。
  "確認できなかったこと": |-
      卯辰山に杉が実在するか（公開資料に樹種の記載を確認できず、杉はゲームの決定として扱う）。
      積雪時の登山道の実景、山頂広場・風穴の実在。東屋・廃遊具・崩れた石垣の実在。杉の雪の付き方、山道の除雪の実態。
  "備考": "エリア固定: 木は杉と枯木。杉の実在はゲームの決定。本人の記憶・過去の写真で補うのが最も確実（調査メモの付記）。"
- "エリアID": "school"
  "一言で言い当てる特徴": "山の木に囲まれた小さな学校。実景で確認できた範囲の地域の特徴は、海と山に挟まれたイカ漁の港町（小木）の小さな漁村。学校自体の外観・校庭・立地の細部は確認できなかった。"
  "実景の特徴": |-
      【所在】小木小学校は能登町立。日本海側有数の遠洋イカ釣り漁業基地「イカの町」。[中]
      【学校の特色】2015年4月から教育課程特例校。5・6年に海洋教育「里海科」（年35時間）。[中]
      【周辺地形】九十九湾はリアス式で入り組んだ海岸に森林と農地が近接する。小木港近くに鉢伏山。[低〜中]
      【集落】港へ向かう狭い住宅地の道で軒が寄り添って並ぶ。イカ漁で成功した漁業者の住宅が多い。[低・旅行記]
      【児童数】令和6年度に51人という記述（原本未確認）。[低]
      学校の校舎形状・色・校庭の広さ・体育館・門・周囲の木は公開資料で確認できなかった。
