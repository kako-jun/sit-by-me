  "一言で言い当てる特徴": "日本海と河北潟のあいだに延びる細長い砂丘に、防砂のクロマツとニセアカシアの林が帯状に張りつき、頂の風車に冬の西風が当たる町。日本海側はなだらかで河北潟側は急な断面。"
