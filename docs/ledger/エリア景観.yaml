  "信頼度": "石川県「金沢城公園」公式サイトの本文を確認した項目は公式1出典（複数ページで一致するものは複数出典）。二の丸御殿基本方針PDFは本文が取れず検索要約のみ。復元建物の寸法は復元値（江戸期の寸法と断っていないものは復元値）。"
  "冬の姿(確認できたもの)": |-
      鉛瓦は完成直後は鼠色、酸化・雨で銀白色になる。壁の厚みは15cm超で雨雪から建物を守る。[公式サイト複数ページ]
      「鉛瓦は冬の積雪に耐えるよう軽い鉛を使った」はWikipediaのみの記述で、公式の鉛瓦ページには無い。[1出典]
      城内の江戸期のこも巻き・雪吊り・雪囲い・雪かきの記録は確認できなかった。長町武家屋敷の土塀のこも掛けは現代の風物詩として紹介されている（城内ではない）。氷室（玉泉院丸、元禄6年）は検索要約のみ。
  "冬の景色の仮想表現": |-
      【仮想】全体: 夜景・マッチ棒工作・LED（art-direction 優先）。建物はマッチ棒を並べた模型。壁はマッチ棒の側面に白い紙粘土を厚く塗った塗り込め壁（窓は小さく深い）、腰は四角い平瓦タイルを格子状に貼り目地を白で盛り上げた海鼠壁（目地の向きは公式で未確認のため斜め格子と断定しない）、屋根は鼠色〜銀白の短いアルミ箔を魚鱗状に貼った鉛瓦。軒丸の先に小さな梅鉢の丸。壁の裏や窓から橙〜電球色のLED。
      【仮想】屋根の雪: 鉛瓦の屋根に綿の雪を軒から棟へ薄く載せ、軒先は雪が垂れた線、棟は雪の上に銀の線として出る。入母屋の破風に雪がたまる。唐破風の石落しの庇にも小さな雪。
      【仮想】石垣: 灰茶と灰青の2色の紙粘土片を混ぜた戸室石。積み方は場所で変える（東の丸北面＝自然石積み、二の丸外周＝粗加工、門と玉泉院丸＝切石積み）。目地と段に雪が溜まり、上端に雪庇のように綿が張り出す。
      【仮想】二の丸（CST-05）: 御殿が建つ。大きな平屋の御殿群として描き、屋根の素材は断定しない（未確認）。復元工事の仮囲いは描かない。
      【仮想】石川門（CST-01）: 高麗門→直角に折れて櫓門→菱形平面の二重櫓の枡形、太鼓塀が続く。足元は雪かきされた黒い石畳の筋。石川橋のコンクリートアーチは描かない（江戸期の橋は未確認）。
      【仮想】三の丸・河北門（CST-02）: 総欅の高麗門＋櫓門＋出し付きの土塀（ニラミ櫓なし）。広場は雪原。菱櫓・五十間長屋（CST-03）: ひし形平面の三層の櫓と二階建ての長い多聞櫓、窓や石落しからLEDの橙。橋爪門（CST-04）: 門・広い枡形・続櫓、門内の番所に行灯風の小さな橙LED。
      【仮想】玉泉院丸（CST-06）: 低地。背の高い石垣（大小の石を短冊状に積み分ける）に囲まれ中央に池（黒い透明レジン、縁が凍って白く）。石垣から細い滝が階段状に落ちる（凍結せず細く流れる設定は創作）。木橋・石橋。松（アカマツ・クロマツ）とモミジの枯れ木。鼠多門と木橋が隣接。
      【仮想】本丸・附段（CST-07・09）: 三十間長屋は石垣の上に一直線の二階建て、板葺きの屋根（幕末の姿。公式の別ページと食い違うため要確認）に雪、西面に唐破風・千鳥破風。本丸の櫓群は無く、一段高い曲輪。鶴丸倉庫（CST-08）は白い厚い壁の大きな土蔵、腰に灰緑の石、切妻。
      【仮想】人の気配: 枡形の土塀の端に雪かきで寄せた小さな雪の山、石畳の細い通り道だけ雪が踏まれて黒ずむ、足跡は草履の細長い跡。提灯は番所の灯りとして創作。人物は置かないか蓑笠の小さな人影。
      【仮想】CST-10（本丸内のイマジナリー天守上層）: 架空。白壁・鉛瓦の層を重ね全面にLED。天守の史実（階数不明・図面なし）や三階櫓（3重）を断定しない。
  "描いてはいけないもの": |-
      近代の要素: 金沢大学の校舎・体育館・テニスコート、県体育館・スポーツセンター、旧陸軍第六旅団司令部庁舎などの明治の軍施設、軍が積み直した石垣・トンネル・石垣の階段。
      現況の復元工事の仮囲い・足場、復元建物の現代設備（エレベーター・スプリンクラー）、鼠多門橋の鋼構造、玉泉庵・唐傘・舟小屋、現代の石敷き。
      百間堀通り・石川橋のコンクリートアーチ橋、舗装道路・アスファルト・白線、芝生広場、コンクリート建築、自動販売機、近代の案内板・柵・ロープ、街灯・電柱・車両、ライトアップの投光器。
      天守・三階櫓を建てない（天守は1602年に、三階櫓は1759年に焼失）。本丸の櫓群（1759年以降再建されず）を建てない。
      兼六園の雪吊り（城内の江戸期の雪吊りは未確認）。現況の本丸園地の森（スダジイ等は後世）を江戸期の植栽と断定しない。
  "確認できなかったこと": |-
      二の丸御殿の屋根材（瓦か板か鉛瓦か）、庭、能舞台の配置。三階櫓の屋根材。天守の外観（図面なし）。
      江戸時代の城内の雪吊り・こも巻き・雪囲い・雪かき・屋根雪下ろしの記録。江戸期の城内の樹木・本丸の植栽。
      極楽橋・本丸附段の橋・いもり坂の江戸時代の姿。石川門前の橋が土橋だったかの公式確認。
      番所・柵・土塀による城と城下町の境界の外観。三の丸・新丸・東の丸の藩政期の用途。海鼠壁の目地の向き。
      三十間長屋の幕末の屋根（公式の別ページ同士で板葺きと鉛瓦葺きが食い違う）。「江戸末期の絵図による玉泉庵」は公式の玉泉院丸ページでは確認できず。
  "備考": "エリア固定: 木は松とモミジ（玉泉院丸庭園の植栽は復元整備のもので江戸期の樹種の記述ではない。要確認）。時代は決定（2026-11-02、Issue #191 コメント 6569737985）。現況ベースの area-landscape-A.md 第3章（二の丸の復元工事・極楽橋・本丸園地の森）はこの行では採用しない。"
- "エリアID": "garden"
  "一言で言い当てる特徴": "雪吊り（芯柱から放射状に縄を張って松の枝を吊る円錐形）。とくに霞ヶ池ほとりの唐崎松は5本の芯柱と約800本の縄。小立野台地の先端の池泉回遊式庭園（約11.7ヘクタール）。"
  "実景の特徴": |-
      【全体】広さ約11.7ヘクタールの池泉回遊式庭園。小立野台地の先端にあり、園路を登る幽邃さ、高台の霞ヶ池の宏大さ、眼下の城下町の眺望。[複数出典]
      【霞ヶ池】園内最大の池。亀の形の蓬莱島。[蓬莱島は1出典、面積・水深は検索要約のみ]
      【徽軫灯籠】霞ヶ池の北岸。高さ2.7mの石灯籠で脚が二股、脚の長さが異なる。片脚は水に、片脚は石に置く。現在のものは昭和53年設置の2代目。[複数出典。片脚が水中は1出典]
      【唐崎松】霞ヶ池に面したクロマツ。13代藩主が琵琶湖の唐崎から種を取り寄せて育てた。推定樹齢約180年。[複数出典。霞ヶ池の東岸に立つことは公式本文で未確認]
      【根上松】地上2mあたりに40数本の根が盛り上がる。高さは約15mと約11mで資料が食い違う。[検索要約のみ]
      【曲水】園で一番高い築山の裾を流れてゆっくり霞ヶ池へ。辰巳用水が源。[複数出典]
      【花見橋】擬宝珠の欄干の木橋、曲水に沿って桜・カキツバタ・ツツジ。[検索要約のみ]
      【山崎山（紅葉山）】苔と紅葉。金沢城の惣構外郭土塁の一部で、その南の池は水堀の名残。[複数出典]
      【栄螺山】1837年に池を掘り足した土で築いた山、頂に三重の石塔（戸室石）。[1出典。螺旋の道は未確認]
      【瓢池・夕顔亭・翠滝】瓢池はひょうたん形の池で園内で最も古い区域、中島に海石塔。夕顔亭は1774年に建てた古い建物。翠滝は落差約6.6mの人工滝、滝壺なし、苔と緑に囲まれる。[瓢池・翠滝は1出典、夕顔亭は検索要約のみ]
      【時雨亭・梅林】時雨亭は2000年に復元された茶屋。梅林は1969年（昭和44年）に整備されたもので古木ではない。[時雨亭は1出典、梅林は検索要約（石川県資料）]
      【入口】桂坂口は北端の金沢城側入口（坂を上ると霞ヶ池が見渡せる）。真弓坂口は「広坂・21世紀美術館」バス停に近い。石川橋はコンクリートのアーチ橋で下を旧百間堀の道路が走る。[1出典]
  "出典": |-
      https://ja.wikipedia.org/wiki/兼六園
      https://www.gltjp.com/ja/article/item/10324/
      https://tabi-mag.jp/kenrokuen-yukitsuri/
