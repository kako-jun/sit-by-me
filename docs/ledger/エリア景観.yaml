  "実景の特徴": |-
      【正本】八角形の玄関・格子状水槽・ピラルク・巨大シャチホコ・ゲームセンター・昭和の屋外檻・海底探検洞窟・和室宿泊棟は、kako-jun の記憶を正本とする（公的資料が少なく、実在資料では確認できなかった）。
      【前身】1958-11完成の「金沢ヘルスセンター」。大広間や大浴場を中心とした娯楽施設で、のち動物園などが作られた。1983年に「金沢サニーランド」に改称、1993年に閉鎖。[高]
      【水族館】隣に1963-08開館の「金沢水族館」。のちヘルスセンターと水族館はロープウェーで結ばれた。閉鎖後、動物はいしかわ動物園（能美市）へ。[高]
      【現況】卯辰山では官民の施設が利用者減で廃止され、跡地は緑地・広場に再整備された。旧動物園の跡は展望芝生広場「見晴らし台」。[中・検索要約]
