      https://www.mlit.go.jp/tagengo-db/H30-00648.html（長町の土塀の構造。寺町へは転用）
      https://www.kanazawa-kankoukyoukai.or.jp/spot/detail_50534.html（長町の大屋家）
      https://ja.wikipedia.org/wiki/寺町寺院群
      https://4travel.jp/dm_shisetsu/11360221 ・ https://4travel.jp/dm_shisetsu/11360202 ・ https://4travel.jp/dm_shisetsu/11322148（利用者投稿）
      調査メモ: teramachi-real-landscape-research.md（2026-11-02）
  "信頼度": "公的資料（石川県・文化庁）と観光協会は複数出典。木・門は利用者投稿（口コミ）。土塀の構造・こも掛けは長町の例の転用（要確認）。"
  "冬の姿(確認できたもの)": |-
      冬（12月〜3月）は凍結による亀裂・壊れを防ぐため、藁のむしろ（菰）で土塀を覆う「こも掛け」を行う。ただし確認できたのは長町武家屋敷の例で、寺町台で行うかは未確認。[複数出典・転用]
      凍結融解で壁が破損する恐れがある（割れ・剥落が起こる）という事実のみ。[1出典]
      金沢の消雪パイプは地下水を路面に散水して雪を溶かす設備（市内道路に延長約110kmなど）。寺町通りに設置されているかは未確認。[1出典・検索要約]
  "冬の景色の仮想表現": |-
      【仮想】土塀: 版築の土の壁、下に低い戸室石（赤みのある石と青灰色の石が混在）の野面積みの基礎、上に暗い灰黒の釉薬瓦の笠。笠の上に雪が帯状に載る。再築部分（色が均一で笠瓦がきれい）と古い部分（土色が褪せ、下部が剥落して下の土やわらがのぞく）を混在させる。菰を掛けた区間と掛けない区間を混ぜる程度にとどめる（寺町台での菰掛けは未確認のため既定・要確認）。
      【仮想】木: 同じ画面に、巨木の寺（本堂の屋根より高いギンモクセイ・ケヤキ・杉・赤松）、低い植栽の寺、木のほとんど無い寺を混在させる（サイズ比3倍以上）。木が塀の外まで枝を張り境内が暗く見える寺があってよい。雪吊りは松などの庭木にだけ。
      【仮想】門と境界: 山門は薬医門か大きな四脚門風。通りから奥まって距離がある寺もある。入れない場所は土塀＋石基礎の立ち上がり＋道との段差の実体で表し、閉じた木の門＋小さな潜り戸（雨と雪で黒ずむ）を景色の扉として置く（潜り戸の実例は未確認のため既定・要確認）。
      【仮想】道と用水: 道は直線で、アスファルトの路面中央に消雪パイプのノズル穴が並ぶ（既定・要確認）。幅1m未満の石積み護岸の細い用水が道沿いにあり、門前で小さな石橋で渡る（寺町を流れる用水の実例は出典なしのため既定・要確認）。
      【仮想】台地の縁: 擁壁・石積み・長い石段（W坂）で段差を必ず描く。
  "描いてはいけないもの": |-
      妙立寺（忍者寺）など観光寺院の特徴を混ぜない。松月寺の大桜（国の天然記念物）を一般の寺の木にしない。
      長町武家屋敷の特徴（足軽は生け垣、土塀を巡らせられたのは平士以上、大野庄用水、長屋門、キムスコの格子の家並み）を寺町の確認済みの事実として混ぜない。
      卯辰山麓の寺院群（全性寺）・小立野寺院群の景を寺町台の景として混ぜない。
      色の違いだけの境界（歩けるように見えて入れない面）。木を同じ大きさで並べること。
  "確認できなかったこと": |-
      寺町台の土塀の高さ・具体的な土色・笠瓦の形と材質・石の基礎の高さ・剥落や苔や補修跡の見え方。
      潜り戸・通用口・袖塀・景色だけの扉の実例。道幅・舗装・側溝・縁石・段差・生垣や板塀の実例。
      寺町台での消雪パイプ・雪の壁・雪囲い・こも掛けの有無。寺町を流れる用水の名前・護岸。
      火の見櫓・銭湯・県営住宅・バリアフリースロープが寺町にあるか。巨木の高さ・幹周りの数値。
      寺院本堂・庫裏・鐘楼の屋根材の色と素材（黒瓦の釉薬瓦の実態は出典未確認）。
  "備考": "TRM-06〜17 の見た目は既にこの調査を反映した決定 TRM.looks-from-real-reference（要素.yaml の見た目）で記入済み。この行はそれと一貫させるための要約で、MAP の見た目の正本は要素・MAP の plan追加JSON。団地（TRM-11・12）の外観は別調査（昭和の白いコンクリート4階建て）で決定 TRM-danchi.showa-white-concrete。"
- "エリアID": "city"
  "一言で言い当てる特徴": "香林坊は、百貨店（大和）と商業複合ビル（香林坊アトリオ・東急スクエア）が角を固め、バス停が周囲に6地点ある北陸随一の繁華街の大交差点。茶屋街は黒い瓦と出格子の2階建て茶屋が石畳の細い通りに並ぶ。広坂は幅36mの並木道で中央分離帯に辰巳用水が流れる。"
  "実景の特徴": |-
      【香林坊】北陸随一の繁華街。交差点の角に香林坊アトリオ（大和と一体の再開発ビル）と香林坊東急スクエア。バス停が周辺に6地点。交差点の地下に県営の香林坊地下駐車場（台数は資料間で食い違うので使わない）。再開発された広場にメグスリノキが植えられている。[W香・1出典]
      【香林坊アトリオ】地下1階〜4階の吹き抜けの明るい空間。[検索要約のみ。からくり時計のある吹き抜けは決定済み]
      【武蔵ヶ辻】武蔵交差点（国道157号などの起点）。バス停7地点。百貨店（金沢エムザ）・近江町市場・ホテル・銀行が囲む。近江町市場は約170〜180軒、アーケードは1956年建設で老朽化により再開発が進められた（現在の屋根材は未確認）。[1出典]
      【にし茶屋街（KRB-08のモデル）】犀川南側（野町）に1820年に開かれた。出格子が美しい2階建ての茶屋建築が立ち並ぶ。[複数出典]
      【ひがし茶屋街の記述（にしではない）】黒い瓦屋根・出格子・石畳の両脇にお茶屋と町屋。弁柄色（朱）や群青は茶屋の2階客間など室内の色で、外観の壁色とは確認できていない。[複数出典]
      【犀川大橋】1924年完成のワーレントラスの鉄橋、国登録有形文化財（2000）。国道157号。塗色は青系〜青緑系のグラデーション。[複数出典（塗色は検索要約）]
      【広坂】長さ443m・幅36mのシンボルロード。中央分離帯沿いに辰巳用水のせせらぎ、松と桜の高木。沿道に旧県庁・赤煉瓦の旧四高校舎・アカマツ・イチョウの大木・アメリカフウ。[広坂通りの規模・並木は検索要約のみ、赤煉瓦・樹木は1出典]
      【病院】小立野の台地上（金沢城の南東）は住宅地・学生街。実在の特定病院は下敷きにしない創作。[1出典]
