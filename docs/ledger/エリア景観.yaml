- "エリアID": "noto_after"
  "一言で言い当てる特徴": "同じ道と家のまま、青いシートを掛けた黒瓦の屋根と、崩れた土の赤茶、傾いた電柱。港のコンクリートが海から持ち上がっている（2024年能登半島地震の後）。"
  "実景の特徴": |-
      【地震】2024-01-01 16:10発生。Mj7.6、震源は珠洲市の地下16km、最大震度7。[高]
      【隆起】能登半島北部で最大約4mの隆起。輪島市の五十洲漁港で約4.1m、鹿磯漁港で約3.9m、珠洲市の長橋観測点周辺は海底が露出。隆起で港が干上がり、防潮堤や岩礁の生物が遺骸になった。[高〜中]
      【海岸施設】珠洲市の直・正院海岸で波返工の傾き・ずれ、平張コンクリートの沈下、噴砂が記録された。[中]
      【建物】珠洲市は築年の古い建築物が多く倒壊が多かった。輪島市河井町周辺の木造建物全壊率31.5%。穴水町では土砂崩れが住宅3棟を巻き込んだ。珠洲市狼煙町で軒瓦が崩れ落ちたままの屋根が見られた。[高〜中]
      【屋根】屋根の被害が多く、本格修理までの保全にブルーシートが広く使われ、劣化するため定期的な張り替えが必要。能登瓦は倒壊家屋でも割れずに残るものが多かった。[中・石川県資料は検索要約のみ]
      【暮らし】奥能登では2026年時点でも生活インフラの復旧が完全でなく、仮設住宅暮らしが多い。道路のひび割れや地盤の隆起。仮設住宅は長屋型プレハブ等。2024年9月の豪雨による追加被害もあった。[低〜中]
      【終着駅跡】車止めは廃止後に撤去され、駅跡に代替物が置かれた。[高]
