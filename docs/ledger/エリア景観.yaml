  "信頼度": "地域の特徴は中〜低。学校自体の外観は出典が無い（学校公式ページは取得拒否、Wikipediaに項目なし）。以下の仮想表現はすべて一般的な北陸の小学校像。"
  "冬の姿(確認できたもの)": "小木地区固有の冬景色は確認できなかった。能登の冬の一般（荒れた冬の海、鉛色、黒瓦、波の花）はリポの map-topology.md に記述があるが実景出典は未確認。北陸の学校の冬（雪遊び、除雪、スノーポール）は雪国共通語彙として仮想で扱う。"
  "冬の景色の仮想表現": |-
      【仮想】校舎: 2階建ての鉄筋コンクリート、薄い灰ベージュの外壁、横長の窓列、平らな屋根に雪の板（厚紙に綿）。
      【仮想】校門と坂（SCH-01）: 低い門柱2本と雪の手すり、赤白のスノーポールが道の縁に並ぶ。除雪済みの黒い路面、両側に積まれた除雪の雪山、融雪水の細い筋。坂の山側に山の木（暗緑と枯木混じり、樹種を特定しない塊＝スポンジ＋綿）、海側の遠景は灰色の帯。坂の下の古い民家に「狭い道に軒が寄る」特徴を少し足してよい（根拠は低信頼）。
