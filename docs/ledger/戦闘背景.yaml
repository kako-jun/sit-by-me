  "備考": "決定 BTL.bg011-bg012-staff-judgment（2026-11-11 訂正）。当初の構図案『舞台の正面を中心に手前に遊戯室の床と両脇の壁を少し入れる』は参謀の判断ミスだった（kako-jun「戦闘画面はあくまでイメージなのだから、実際のマップと完全一致する必要はない。戦うのは舞台の上だろ」）。実マップの再現は不要。参照画像は採用済み TRM-02（assets/images/fields/reference/teramachi-kindergarten-playroom-trm02-adopted.webp）の舞台の部分（書き割り・緞帳・舞台の板が写る範囲）の切り出しで、素材感の見本として使う（構図のコピーに注意）。別担当の実験結果（Issue #267 のコメント）は、参照見本シート・prompt の構成として SKILL.md の生成手順に取り込み済み。生成は sit-battle-background の『無駄な生成を防ぐ手順』に従う。採用後の台帳・デモ配線の手順は SKILL.md『採用後の台帳・デモ配線』（BG011 は暫定採用で実施済み。BG001 は退役済み）。 2026-11-12 採用（kako-jun 目視承認 2026-11-12「よい」。逐語 https://github.com/kako-jun/sit-by-me/issues/191#issuecomment-6816061585）: take11（拡大なし1.0倍。床板を細くして巨大な1枚板に見えないようにした。take10 は板幅が大きく差し替え）を採用。素材 A-1360、配信用複製は WebP quality85（251,018B）。BG001（没・暫定残置）は SKILL の手順（BG011 採用後に素材・台帳から削除）に従い削除。"
