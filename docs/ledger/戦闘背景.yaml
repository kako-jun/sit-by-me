  "備考": "決定 BTL.bg011-bg012-staff-judgment（2026-11-11 訂正）。kako-jun『寺町での戦闘背景もマップのどれとも一致しない特徴だけ合わせた景色でいいんだよ』。寺町の特徴=古い土塀と戸室石の基礎、寺の瓦屋根、雪囲い、薄雪の道（路面の黒が約7割見える薄く積もった雪道。厚い綿は路肩・縁石の脇・土塀の根元だけ。消雪パイプの穴は戦闘背景では描かない。kako-jun 2026-11-12「雪道でいいのでは」「雪がつもりすぎ」）、道の脇の側溝・縁石・段差、綿の雪。参照は特定の1枚に固定せず、採用済みの寺町の絵から素材・様式の見本として切り出した見本シートを渡す。TRM-07 の作り直しを待たない（依存を外した）。別担当の実験結果（Issue #267 のコメント）は、参照見本シート・prompt の構成として SKILL.md の生成手順に取り込み済み。使う戦闘は寺町の屋外通路での戦闘全般（現状この対応を使うイベントは台帳に無い）。 2026-11-12 採用（kako-jun 目視承認 2026-11-12「これでいい」。逐語 https://github.com/kako-jun/sit-by-me/issues/191#issuecomment-6815782548）: take5（平らな路面・均一な薄い粉雪の層。拡大1.15倍・crop 70,52,1454,818。枠の上端帯に石・縁石が入らず余裕の大きい候補を zoom-search で選んだ。穴のある道路 take2・厚い雪 take3・うねって見えた take4 は kako-jun の指摘で差し替え）。素材 A-1361。BG012 は計5回生成（指示は1回。take1 は BG011 のオフセットを継承して奥の縁が大きく下に描かれ、拡大では3倍超が要り使えなかったため、BG012 の描画オフセットを路肩の下端の目視読み取りで台帳に持たせて再生成）。使う戦闘はまだ無い（opening_battle には登録しない）。"
