  "使う戦闘": "opening_battle"
  "カメラ": "構図はミニチュアのジオラマを、舞台の正面でなく少し斜め左の位置から撮った写真（舞台を少し右へ向けて見る。右へ奥行きが抜ける。kako-jun 2026-11-12「少し斜め左のカメラ位置から撮ったような構図にしろといったし」「板に張り付けたようになってる。普通にジオラマを斜めから撮ったような構図にしろ」。角度の数値は未決 U-2912。発明しない）。マップより寄り、見下ろし角が浅い。物自体（幕・書き割り）は傾けない（既存決定 SIT.battle-bg-diorama-view）。舞台板に奥行きがあり、書き割りと緞帳は舞台の奥・両端に厚みをもって立つ。真正面で平面的にしない。戦うのは舞台の上。背景は舞台そのもの。舞台の絵は採用済み TRM-02 の舞台どおり: 濃茶の木の柱に真鍮のランタン、緑フェルトの緞帳（金の飾り紐・房）、青空に綿の雲・雪山・白い城（赤い円錐屋根の塔・時計つきの中央塔・木の扉）・雪をかぶったもみの木・床に綿の雪の書き割り、濃茶の板張りの舞台（床）。TRM-02 に無い物は足さない。遊戯室の床・壁・おもちゃ棚・テーブル・椅子は入れない。境界は右端yを左端yより40 logical px以上小さくする（実px換算は『配置』の備考）。戦闘はキャラが水平な地面に立てないなら再作成でなく拡大で解決する（kako-jun 2026-11-12「戦闘はキャラが水平な地面にたてないとかなら再作成でなく拡大によって解決したらいい。舞台セットが見切れたほうが臨場感がでる」。決定 SIT.battle-bg-diorama-view の補足で、新決定ではない）: 舞台の床を画面いっぱいに拡大し、敵・味方の枠が全て床の上に載るようにする。枠に重なる背景物（城の胴・樅・柱・ランタン・緞帳）は拡大で画面の外へ追い出す。見切れてよいのは上端・左右端の舞台セット（書き割り・緞帳・柱）だけで、安全矩形ルール（枠の上に背景物を置かない）は変えない。戦闘UIの安全矩形（味方4枠・敵の枠・ログ帯・下段の窓）・床の四隅・各物（城・樅・緞帳・柱・ランタン・書き割り）の位置は『配置』列が正本（数値をここに書かない）。物（城・樅・緞帳・柱・ランタン）は安全矩形に置かない。緞帳の上部の飾り（バランス）は、ログ帯と味方1枠が上端を塞ぐため描かない。前縁は画面の外（見えない）で、床は画面の下端まで続く。床板の線は奥の縁と同じ右上がりの遠近（手前ほど間隔が広く、奥ほど狭い）で、水平な線を入れない（kako-jun 2026-11-12「なんで戦闘画面の下端に水平線を入れることにこだわるの？」）。下段の窓の位置には床だけが来る（背景物なし）。電線・架線は描かない（SIT.no-power-lines）。"
  "配置": "{\"canvas\":[1672,941],\"floor\":{\"back_left\":[120,170],\"back_right\":[1640,-10],\"front_left\":[-200,1100],\"front_right\":[1800,1100],\"min_rise_px\":35},\"items\":[{\"box\":[715,-40,190,130],\"cutoff\":true,\"id\":\"castle\",\"kind\":\"castle\",\"object\":true,\"名\":\"白い粘土の城（時計塔・赤い円錐屋根の塔・木の扉）\"},{\"box\":[140,-80,45,250],\"cutoff\":true,\"id\":\"post_l\",\"kind\":\"post\",\"object\":true,\"名\":\"濃茶の木の柱（左）\"},{\"box\":[85,50,55,75],\"cutoff\":true,\"id\":\"lantern_l\",\"kind\":\"lantern\",\"object\":true,\"名\":\"真鍮のランタン（左）\"},{\"box\":[0,-100,140,250],\"cutoff\":true,\"id\":\"curtain_l\",\"kind\":\"curtain\",\"object\":true,\"名\":\"緑フェルトの緞帳（左）金の飾り紐と房\"},{\"box\":[120,-150,1440,320],\"cutoff\":true,\"id\":\"backdrop\",\"kind\":\"backdrop\",\"object\":false,\"名\":\"段ボールの書き割り板（青空・綿の雲・低い雪山）\"}],\"safe_rects\":[{\"box\":[16,16,1640,56],\"id\":\"log\",\"名\":\"ログ帯\"},{\"box\":[16,809,240,116],\"id\":\"cmd\",\"名\":\"コマンド窓\"},{\"box\":[262,809,180,116],\"id\":\"enemyname\",\"名\":\"敵名窓\"},{\"box\":[448,809,1208,116],\"id\":\"status\",\"名\":\"status窓\"},{\"box\":[920,78,256,320],\"id\":\"ally1\",\"名\":\"味方1枠\"},{\"box\":[1080,213,256,320],\"id\":\"ally2\",\"名\":\"味方2枠\"},{\"box\":[1240,348,256,320],\"id\":\"ally3\",\"名\":\"味方3枠\"},{\"box\":[1400,483,256,320],\"id\":\"ally4\",\"名\":\"味方4枠\"},{\"box\":[228,184.5,480,480],\"id\":\"enemy\",\"名\":\"敵の枠\"}],\"備考\":{\"castle\":\"城は奥の縁の上（x715〜905、敵の枠x228〜708と味方1枠x920〜の隙間）に立ち、画面の上端で見切れる。以前カメラ欄にあった『x715〜905・y95〜242』は参謀が a312a0e8 で足した数値で、台帳・decisions・Issue の kako-jun の決定には無かったため訂正（誤りを認める）。\",\"cutoff\":\"cutoff の許容は画面の外とログ帯（y16〜72）への重なりだけ。味方・敵の枠と下段の窓（コマンド・敵名・status）には重ねてはならない（pre_check が検査）。\",\"floor\":\"床の四隅は左右の縁と奥の縁だけで決めた値（見下ろし角などの数値は発明しない。前縁は画面の外＝描かない・見えない。手前の2点 y=1100 は画面外の下に置いただけで、前縁の位置を表さない）: 奥の縁を左は敵の枠の上端(y184.5)の少し上 y=170、右端は直線が x=920 で y≈75（味方1枠の上端 y78 より上）になるよう (1640,-10) とした。上がりは180px で規則の35px 以上。右の縁は (1640,-10)→(1800,1100) で味方4枠の右端(x1656)の y=483 で x≈1711 とその外、左の縁は (120,170)→(-200,1100) で敵の枠の左端(x228)の外。床は画面の下端まで続き、下段の窓の位置は床だけ。敵・味方の5枠と下段の窓3枠の四隅は全て床の四角形の中（pre_check が検査）。床板の線は奥の縁と同じ右上がりの遠近（手前ほど間隔が広く、奥ほど狭く、消失点へ収束）で、水平な前縁を置かない（kako-jun 2026-11-12「なんで戦闘画面の下端に水平線を入れることにこだわるの？そのせいでフローリングの線が変になり歪な立体感になってるのに」）。舞台セットは奥の縁より上＝画面の上端・左端に見切れて収まる（cutoff）。\",\"min_rise_px\":\"規則『境界は右端yを左端yより40 logical px以上小さくする』（1920x1080 の logical）を 1672x941 の実pxへ換算: 40×1672/1920=34.83→切り上げて35（Issue 記録の『約36px』は丸め。35 を採る）\",\"valance\":\"緞帳の上部の飾り（バランス）は、ログ帯（y16〜72）と味方1枠（x920〜1176・y78〜）が上端を塞ぐため描かない\",\"描画オフセット\":\"モデル（codex image_gen）は奥の縁と書き割りを割付図より下に描く再現的なずれがある（観測値）。take9（現行の配置と同じ構図・前縁なし）の生の絵で、書き割りの下端（青空・白い雪の最下端）を x=300〜1500 の12列で測り、割付図の奥の縁との差を出した: x=300 で 91px、x=1500 で 120px（その間は 91〜120px、中央値 108px）。左右2点の値を直線でつなぎ、build が割付図・送信文の奥の縁と舞台セット（cutoff の物）をこの分だけ上へ寄せる（台帳の床・物の値＝狙いは変えない。検査は台帳の値）。見切れの物は画面に最低 min_visible=40px 残す。take8 の実測は城・雲が測定列を乱し（中央値 30px、前縁ありの別構図）、根拠にしない。見下ろし角の数値は発明していない。\",\"物の色判定\":\"城の赤い屋根・ランタンの金の色判定（battle_bg_build.py の red_roof_mask・gold_mask）は採用済み TRM-02 の実色に合わせた（屋根らしい赤みの画素の中央値 (200,94,55)・r-g≈107、拾えた画素の中央値 (207,91,50)・r-g≈117、ランタンの真鍮の中央値 (207,143,74)）。屋根の r-g>95 は中央値に近い崖で、床の誤検出を抑えるため take10 の1枚で調整した値。複数の絵では検証していない。\"},\"出典\":\"name-name computeSideBattleLayout の実測（1672x941・味方4人・敵1体・敵名窓あり）\",\"描画オフセット\":{\"dy_left\":91,\"dy_right\":120,\"min_visible\":40,\"x_left\":300,\"x_right\":1500}}"
