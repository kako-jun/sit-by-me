  "カメラ": "特定のMAPの再現ではなく、寺町の特徴だけを合わせた、どのマップとも一致しない景色。マップより寄り、見下ろし角が浅い（数値は未決 U-2912。発明しない）。境界は右端yを左端yより40 logical px以上小さくする。戦闘UIの安全矩形は BG011 と同じ（1672x941 の実測値）。 構図・安全矩形・床の四隅の規則は BG011 と同じ（『配置』は BG011 を継承）: 少し斜め左のカメラ（角度の数値は未決 U-2912）、前縁は画面の外で下端まで道が続く、薄雪の路面は平らで水平（うねり・盛り上がり・湾曲した轍・左端の弧は描かない）。路面の継ぎ目の線は奥の縁と同じ右上がりの遠近で水平な線を入れない、枠（味方4枠・敵の枠・窓3枠）に物を置かない、土塀・瓦屋根・雪囲いは上端と左端で見切れてよい。"
  "配置": "{\"items\":[{\"box\":[120,-150,1440,320],\"cutoff\":true,\"id\":\"wall\",\"kind\":\"wall\",\"object\":false,\"名\":\"古い土塀（紙粘土のひび割れた面）と戸室石の基礎\"},{\"box\":[560,-120,520,150],\"cutoff\":true,\"id\":\"roof\",\"kind\":\"roof\",\"object\":true,\"名\":\"寺の瓦屋根（灰色の波板の瓦）\"},{\"box\":[140,-30,300,110],\"cutoff\":true,\"id\":\"fence\",\"kind\":\"fence\",\"object\":true,\"名\":\"雪囲い（竹ひごと縄と藁）\"}],\"備考\":{\"上端帯の石・縁石の検査\":\"薄雪の路面は暗い灰色の石・縁石・瓦を色で路面の黒と分けられないため、枠の上端帯（敵・味方の各枠の上端から15%）の『路面の黒（最大チャンネル110未満）』の割合で見る。根拠（実測）: BG012 take4 の拡大画像（crop 250,52,1286,724）では、味方1枠の上端帯が黒58%・敵の枠が44%（石・縁石・綿が入っている）で、石の入らない味方2枠の上端帯は94%（拡大前 take4 では91%）。アスファルトの細かい粒・轍・足跡で路面の黒は100%にならず約91〜94%なので、合格線は80%にした（石の入った帯 36〜58% と路面の帯 91〜94% の間）。check --zoomed と zoom-search の合格条件。見切れの上端セットは、この条件を満たす範囲でなるべく残す。\",\"地面\":\"BG012 の床は薄雪の路面。floor_mask は『地面=thin-snow』で、低彩度（最大-最小が55以下）で最大が20以上の画素（黒い湿ったアスファルト・灰色・白い雪）を床と数える。物は色のある面（土塀・藁・青・緑・金・赤。最大-最小が55超）。瓦・戸室石・縁石の暗い灰色は色では路面と区別できないので、枠への侵入は overlay.png の目視で数える。\",\"描画オフセット\":\"BG012 の描画オフセット（観測値）。take1（BG011 のオフセットを継承して生成。道路・土塀の絵）の生の絵で、路肩（縁石・側溝）と路面の境界の下端を、オーバーレイ上で x=0・700・1100・1500・1672 の5点読んだ（目視の読み取りで、自動測定は未実装）。割付図の奥の縁との差は x=0 で約276px・x=700 で約199px・x=1100 で約111px・x=1500 で約93px。左右2点（x=100 で260px・x=1500 で93px）を採る。BG011（91〜120px）より大きいのは、BG011 のオフセットを継承して生成した take1 で道路の奥の縁が大きく下に描かれたため。見下ろし角の数値は発明していない。\",\"特徴\":\"寺町の特徴だけを合わせた景色（どのマップとも一致させない。決定 BTL.bg011-bg012-staff-judgment）: 古い土塀と戸室石の基礎・寺の瓦屋根・雪囲い・雪道（綿の雪をかぶった道。消雪パイプの穴・金属蓋は戦闘背景では描かない。kako-jun 2026-11-12「融雪装置が大きすぎる」「雪道でいいのでは」）・側溝縁石段差・綿の雪。電線・電柱なし（SIT.no-power-lines）。参照は採用済み TRM-08 の縁石・土塀・瓦屋根・石の基礎・雪の地面の見本シート（穴のある路面は入れない）。\",\"継承\":\"安全矩形・床の四隅・画面サイズは BG011 の『配置』を単一正本として継承する（BG011 と同じ安全矩形・窓3枠・床の遠近規則）。描画オフセットは BG012 専用（下の『描画オフセット』。take1 で実測した路肩の下端の値）。\",\"路面の平らさの検査\":\"路面のうねり・盛り上がり・湾曲した轍（kako-jun 2026-11-12）の間接検査: 画面左端300px・y260〜900の帯を半径40px で平滑化した明るさの、行ごとの平均を引いた残差の標準偏差（左端の低周波のむら）。実測: 平らな路面の take5（拡大後）で3.5、うねって見えた take4（拡大後、crop 90,124,1286,724）で9.2。合格線は6.5（両者の間）。サンプルは2枚で、閾値は暫定。目視（左端が直線的か・平らか・雪の層に見えるか）が最終判断。\",\"路面は平ら\":\"路面は平らで水平（kako-jun 2026-11-12「戦闘画面の道路の左端がなんか曲線状にゆがんでるし雪でなく道路がぐねぐね凹凸があるようにみえている」）。轍・足跡のくぼみは描かない（湾曲した轍・左端の弧は禁止。奥の縁と平行なごく浅い直線の跡のみ可）。雪は路面全体にごく薄く均一にかかった白い粉雪の層で、黒い路面は透けてよいが、うねる地形に見えない。厚い綿は路肩・縁石の脇・土塀の根元だけ。左端（画面端）の路面は曲線・弧にならず、奥の縁と同じ向きの直線的な遠近。check の間接検査: 路面の低周波の明るさのむら（路面のうねり・盛り上がり）。\",\"雪の量\":\"薄雪の道（kako-jun 2026-11-12「雪がつもりすぎ」）。雪の量は採用済み TRM-08 の道路の写りを実測して決めた: 路面の領域（右の直線部 x760〜1500・y350〜430、左の直線部 x110〜500・y500〜590、中央 x600〜900・y380〜500。穴を避けた）で、黒い路面（最大チャンネル110未満）が67〜82%、白い雪（最小150以上・低彩度）が1〜9%、その他の灰色が14〜24%。BG012 は、路面の黒が約7割（6割以上）・白い雪は路面の1割前後（2割以下）を目安にし、厚い綿の盛り上がりは路肩・縁石の脇・土塀の根元だけ。路面の黒が見える面積は check の overlay で目視で数える（自動の目安: 路面の画素の暗い画素の割合）。穴（消雪パイプ）は引き続き描かない。\",\"雪の量の閾値\":\"check --zoomed の合格線（敵・味方の枠の中の画素）: 黒い面（最大チャンネル110未満）45%以上、白い雪（最小150以上・低彩度）35%以下。TRM-08 の道路の実測（黒67〜82%・白1〜9%）より甘くした。生成物は路肩・縁石・土塀の影を枠内に含みうるため。目安は黒約7割・白1割前後。\"},\"参照見本\":{\"parts\":[[\"黒い路面と轍\",780,345,440,90],[\"黒い路面の端\",330,500,200,100],[\"縁石と側溝\",720,330,380,140],[\"土塀\",210,25,560,60],[\"瓦屋根と石の基礎\",735,560,395,200],[\"雪の路肩\",160,330,300,110]],\"rows\":2,\"sheet_w\":1400,\"source\":\"assets/images/fields/reference/teramachi-road-well-canal-trm08-adopted.webp\",\"tile_h\":200},\"地面\":\"thin-snow\",\"地面色\":[60,58,56],\"描画オフセット\":{\"dy_left\":260,\"dy_right\":93,\"min_visible\":40,\"x_left\":100,\"x_right\":1500},\"文面\":{\"floor\":\"floor-road\",\"head\":\"head-road\",\"materials\":\"materials-road\",\"only\":\"only-road\",\"subject\":\"subject-road\"},\"継承\":\"BG011\",\"雪の量\":{\"black_min\":0.45,\"flat_left\":{\"blur\":40,\"max\":6.5,\"w\":300,\"y0\":260,\"y1\":900},\"top_band\":{\"black_min\":0.8,\"frac\":0.15},\"white_max\":0.35}}"
