  "備考": "決定 BTL.bg011-bg012-staff-judgment（2026-11-11 訂正）。当初の構図案『舞台の正面を中心に手前に遊戯室の床と両脇の壁を少し入れる』は参謀の判断ミスだった（kako-jun「戦闘画面はあくまでイメージなのだから、実際のマップと完全一致する必要はない。戦うのは舞台の上だろ」）。実マップの再現は不要。参照画像は採用済み TRM-02（assets/images/fields/reference/teramachi-kindergarten-playroom-trm02-adopted.webp）の舞台の部分（書き割り・緞帳・舞台の板が写る範囲）の切り出しで、素材感の見本として使う（構図のコピーに注意）。別担当の実験結果を待って取り込む（実験の記録の置き場=Issue #267 のコメント。結論が出たら #267 に投稿され、参照見本シート・prompt の構成を本欄と SKILL.md の項目4へ取り込む）。生成は sit-battle-background の『無駄な生成を防ぐ手順』に従う。採用したら画像パスと配信用複製（assets/images/fields/play/ に1MiB以下で再圧縮）を埋め、opening_battle の『戦闘背景』に配信用複製を入れ、BG001 を素材・台帳から削除する。"
