  "カメラ": "構図はミニチュアのジオラマを、舞台の正面でなく少し斜め左の位置から撮った写真（舞台を少し右へ向けて見る。左側面が見え、右へ奥行きが抜ける。kako-jun 2026-11-12「少し斜め左のカメラ位置から撮ったような構図にしろといったし」「板に張り付けたようになってる。普通にジオラマを斜めから撮ったような構図にしろ」。角度の数値は未決 U-2912。発明しない）。マップより寄り、見下ろし角が浅い。物自体（幕・書き割り）は傾けない（既存決定 SIT.battle-bg-diorama-view）。舞台板に奥行きがあり、書き割りと緞帳は舞台の奥・両端に厚みをもって立つ。真正面で平面的にしない。戦うのは舞台の上。背景は舞台そのもの。舞台の絵は採用済み TRM-02 の舞台どおり: 濃茶の木の柱に真鍮のランタン、緑フェルトの緞帳（金の飾り紐・房）、青空に綿の雲・雪山・白い城（赤い円錐屋根の塔・時計つきの中央塔・木の扉）・雪をかぶったもみの木・床に綿の雪の書き割り、濃茶の板張りの舞台と板の前面。TRM-02 に無い物は足さない。遊戯室の床・壁・おもちゃ棚・テーブル・椅子は入れない。境界は右端yを左端yより40 logical px以上小さくする（実px換算は『配置』の備考）。戦闘UIの安全矩形（味方4枠・敵の枠・ログ帯・下段の窓）・床の四隅・各物（城・樅・緞帳・柱・ランタン・書き割り・前縁）の位置は『配置』列が正本（数値をここに書かない）。物（城・樅・緞帳・柱・ランタン）は安全矩形に置かない。緞帳の上部の飾り（バランス）は、ログ帯と味方1枠が上端を塞ぐため描かない。舞台の前縁・下端は素のまま: 前面は濃茶の無地の板、下端は波形の段ボール断面で、テープも糊も置かない（決定 SIT.base-edge-decor-random）。電線・架線は描かない（SIT.no-power-lines）。"
