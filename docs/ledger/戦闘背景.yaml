- "背景ID": "BG011"
  "名称": "お遊戯会の舞台"
  "エリア": "TRM"
  "参照MAP": ""
  "使う戦闘": "opening_battle"
  "カメラ": "構図はミニチュアのジオラマを斜め上から撮った写真（TRM の各MAPと同じ斜め俯瞰のカメラ。kako-jun 2026-11-12「板に張り付けたようになってる。普通にジオラマを斜めから撮ったような構図にしろ」）。台座の上に立体の舞台があり、舞台板に奥行きがあり、緞帳と書き割りは舞台の奥・両端に厚みをもって立ち、舞台の前縁と側面が斜めの遠近で見える。真正面で平面的にしない。戦うのは舞台の上。背景は舞台そのもの（書き割りの城と山・緞帳・舞台の板張りの床・足元の灯り・舞台袖の緞帳）。遊戯室の床・壁・おもちゃ棚・テーブル・椅子は入れない。舞台の上に敵（左）・味方（右）が立てる広さの舞台面を画面中ほどに置き、上下を手前の舞台の縁と緞帳で挟む。マップより寄り、見下ろし角が浅い（数値は未決 U-2912。発明しない）。境界は右端yを左端yより40 logical px以上小さくする。戦闘UIの安全矩形（1672x941。name-name の computeSideBattleLayout 実測。味方4人・敵1体・敵名窓あり）: ログ帯 x16 y16 w1640 h56／下段の窓 y809〜925（コマンド x16 w240・敵名窓 x262 w180・status x448 w1208）／味方の斜め一列4枠（幅256・高さ320、左上 (920,78)・(1080,213)・(1240,348)・(1400,483)）／敵1体（大きさ480、x228 y184.5〜、足元 y664.5）。これらの上に背景物を置かない。舞台の前縁（y770以下の正面・下端の段ボール断面）は素のまま: 手前の縁は並べたアイスの棒、正面は無地の板、下端は波形の段ボール断面で、テープも糊も置かない（決定 SIT.base-edge-decor-random。継ぎ目が無ければテープも糊も無い。kako-jun「テープも等間隔でどのマップでも同じなのでaiくさい」）。足元の灯りは手作りらしく間隔をばらす。城（目立つ物）は敵と味方の枠の間 x715〜905・y95〜242 に収め、味方の枠と敵の足元に被せない。電線・架線は描かない（SIT.no-power-lines）。"
  "状態": "未生成"
  "画像パス": ""
  "配信用複製": ""
  "備考": "決定 BTL.bg011-bg012-staff-judgment（2026-11-11 訂正）。当初の構図案『舞台の正面を中心に手前に遊戯室の床と両脇の壁を少し入れる』は参謀の判断ミスだった（kako-jun「戦闘画面はあくまでイメージなのだから、実際のマップと完全一致する必要はない。戦うのは舞台の上だろ」）。実マップの再現は不要。参照画像は採用済み TRM-02（assets/images/fields/reference/teramachi-kindergarten-playroom-trm02-adopted.webp）の舞台の部分（書き割り・緞帳・舞台の板が写る範囲）の切り出しで、素材感の見本として使う（構図のコピーに注意）。別担当の実験結果を待って取り込む（実験の記録の置き場=Issue #267 のコメント。結論が出たら #267 に投稿され、参照見本シート・prompt の構成を本欄と SKILL.md の項目4へ取り込む）。生成は sit-battle-background の『無駄な生成を防ぐ手順』に従う。採用したら画像パスと配信用複製（assets/images/fields/play/ に1MiB以下で再圧縮）を埋め、opening_battle の『戦闘背景』に配信用複製を入れ、BG001 を素材・台帳から削除する。"
