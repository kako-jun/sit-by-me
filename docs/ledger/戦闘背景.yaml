  "備考": "決定 BTL.bg011-bg012-staff-judgment（2026-11-11 訂正）。kako-jun『寺町での戦闘背景もマップのどれとも一致しない特徴だけ合わせた景色でいいんだよ』。寺町の特徴=古い土塀と戸室石の基礎、寺の瓦屋根、雪囲い、消雪パイプの穴の並ぶ道（中央線上の穴だけ・水の噴射なし）、道の脇の側溝・縁石・段差、綿の雪。参照は特定の1枚に固定せず、採用済みの寺町の絵から素材・様式の見本として切り出した見本シートを渡す。TRM-07 の作り直しを待たない（依存を外した）。別担当の実験結果を待って取り込む（実験の記録の置き場=Issue #267 のコメント。結論が出たら #267 に投稿され、参照見本シート・prompt の構成を本欄と SKILL.md の項目4へ取り込む）。使う戦闘は寺町の屋外通路での戦闘全般（現状この対応を使うイベントは台帳に無い）。"
