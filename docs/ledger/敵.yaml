- "敵ID": "M025"
  "名称": "**ヘルナルキッソス**（地獄の花。FF5のハリカルナッソスがモデル。すべて魔法攻撃を使い、これまでラーニングできなかったすべての魔法をラーニングできるようにする。最強魔法名は**ヘルキルデスベル**。名前決定 2026-10-22、効果・属性・対象は未決）。花形の調査参考: Kew掲載のラッパスイセン `Narcissus pseudonarcissus` は、外側の花被片6枚を中央のラッパ状の副花冠が囲む。絵の候補ではこの形を採用し、花弁6枚とラッパ状副花冠を持つ一輪、茎1本で表す。参照種の花色に合わせ、花弁は明るい黄色、ラッパ状副花冠は暗い黄色にする。花頭はカメラ正面を0°、真右横顔を90°とするヨー角45°で右向きにする。茎の中ほどに毒々しい紫色のリボン結びを1つ付け、リボン面に小さなドット絵風の可愛いドクロマークを描く。二本の細い紐を画像左（−x）へなびかせる。ラッパの開口部の内側だけをどす黒くし、花弁とラッパ外側の黄色は保つ。根・葉は付けない。戦闘枠は2x2（中ボス標準枠として採用）。"
