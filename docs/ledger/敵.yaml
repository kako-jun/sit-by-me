  "役割": "主人公たち4人とは別の女の子。「カッペボーイ」は見た目から付いた呼び名。仲間になりたいが、いまさら深い関係にはなれないとも感じており、意地悪をしてしまう（story.md、kako-jun 2026-10-22）。オルトロスのように何度も再戦する中ボス。戦闘中にイベントがよく起き、ギルガメッシュやオルトロスを思わせる、親しみと照れ隠しのあるセリフを言う。台詞例（文言は案）:「そんときはオラも仲間……ふっ なんでもねぇべ！」。ノストラダムラー戦で絶対に防げない攻撃から子供たちをかばい、死亡する。そのとき「友だちになりたいと思ったらすぐ声をかけろ」という助言を送る（kako-jun 2026-10-22）。**二周目では、一周目の世界線には生まれなかったホワへ転生する。性別は長子の性別によって変わり、転生は明かさず喋り方の類似だけで匂わせる（kako-jun 2026-10-22）**。名前・性別・中ボス扱い・再戦する位置づけ・人物の動機・最期・転生設定は決定。外見（kako-jun 2026-10-22）: 実際は少女だが、少年のようにも見える性別不明な外見。へのへのもへ（「じ」は書かなくてよい）を書いた段ボールの仮面を輪ゴムで耳に留め、野球帽をスケベかぶりする。敵トレーナー風の活動的な決めポーズで、片足を上げ、右手を上方向に掲げて自信満々のグーを作り、もう一方の手は曲げる（kako-jun 2026-10-22）。短いジーンズの短パンの裾と帽子にダメージ加工を施し、膝に絆創膏を貼る。裸足、冬でも半袖半ズボン。胸の膨らみは目立たない体格だが、シャツ1枚だと少女らしさが出るため、手足を出す穴を開けたシースルーのゴミ袋を上から着て体の輪郭を見えにくくする。ゴミ袋の正面に、サンリオキャラクターのような単純で可愛いマスコット調にした、独自デザインの紫色のタコのキャラクターマークを描く。**大人時代も同じ敵の別年齢形態として作る（kako-jun 2026-10-22）**: 成人後の姿と分かる頭身・体格にし、子供時代の同じ服を着続けて成長で丈が足りず、シャツとゴミ袋の前裾が上がって腹部とへそが小さく見える（非性的な表現）。マスク・帽子・タコ印などの識別要素は継承し、ポーズは変えてよい。大人版も戦闘用グリッドは1x2とし、別ファイル `M031-adult.webp` にする案。**技（案。kako-jun 2026-10-21）:「さんしむらまつり」と「かんなかんな」**。マンガ『マテリアル・パズル』の敵「ジールボーイ」が使う技へのオマージュ（kako-jun の説明。出典の一次情報は未確認）。技名は和語・ひらがな中心の方針に沿っている。**技の効果・属性・威力・どちらが先に出るか・ラーニング可否〔敵の技名はそのまま魔法名になる規則〕は未決**。登場回数・場所・時期・強さ・負けたときの扱いは未決。フィールドの子供モブとしてのカッペボーイ（お面なしのショートカットの女の子、服装は別、1周目は同一人物と気づかない）は決定 SIT.field-mob-kappa-boy を参照（採用素材 A-1055、未決 U-1839）"
