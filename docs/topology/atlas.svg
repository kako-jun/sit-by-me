<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2100" viewBox="0 0 2400 2100" role="img" aria-labelledby="title desc">
<title id="title">sit-by-me 全MAPトポロジー・アトラス</title><desc id="desc">104 MAPをエリアごとに枠で分け、丸をMAP、線を接続として表す。北は各屋外フレームの上。</desc>
<style>
 text{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;fill:#182532}.frame{fill:#fbfdff;stroke:#587086;stroke-width:3}.title{font-size:26px;font-weight:700}.sub{font-size:16px;fill:#526574}.n{fill:#fff;stroke:#263f54;stroke-width:3}.nd{fill:#fff7ee;stroke:#a65a35;stroke-width:3}.id{font-size:17px;font-weight:700;text-anchor:middle}.line{fill:none;stroke:#344c60;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.door{fill:none;stroke:#ae633d;stroke-width:3;stroke-dasharray:10 7}.opt{fill:none;stroke:#7c8792;stroke-width:3;stroke-dasharray:5 7}.hint{font-size:14px;fill:#61707c}.north{font-size:18px;font-weight:700;fill:#3d617a}
</style>
<rect width="2400" height="2100" fill="#f0f4f6"/><text x="55" y="52" font-size="34" font-weight="700">sit-by-me：全104 MAP 接続アトラス（北＝上）</text><text x="55" y="82" class="hint">実線＝必須主路、茶破線＝扉／乗車／ワープ、灰破線＝任意枝（宝箱等。主路を塞がない）。丸内はMAP ID。各屋外フレーム上端が北。</text>

<!-- Teramachi -->
<g><rect class="frame" x="45" y="120" width="700" height="770" rx="18"/><text class="title" x="70" y="157">寺町・河岸段丘</text><text class="north" x="680" y="157">↑ N</text><text class="hint" x="70" y="182">県営住宅・石段は犀川側／小学校は反対側。石段枝と車椅子主路を混同しない。</text>
