<!-- Body -->
<g><rect class="frame" x="45" y="930" width="550" height="510" rx="18"/><text class="title" x="70" y="967">体内（抽象ダンジョン）</text><path class="line" d="M155 1280 L270 1280 L385 1280 L485 1280"/><path class="line" d="M270 1280 L270 1150 L175 1080"/><path class="line" d="M270 1280 L270 1150 L365 1080"/><path class="line" d="M385 1280 L385 1150 L485 1080"/><g class="n"><circle cx="155" cy="1280" r="31"/><text class="id" x="155" y="1286">F19</text></g><g class="n"><circle cx="270" cy="1280" r="31"/><text class="id" x="270" y="1286">F24</text></g><g class="n"><circle cx="385" cy="1280" r="31"/><text class="id" x="385" y="1286">F25</text></g><g class="n"><circle cx="485" cy="1280" r="31"/><text class="id" x="485" y="1286">F26</text></g><g class="n"><circle cx="175" cy="1080" r="31"/><text class="id" x="175" y="1086">F20</text></g><g class="n"><circle cx="365" cy="1080" r="31"/><text class="id" x="365" y="1086">F21</text></g><g class="n"><circle cx="485" cy="1080" r="31"/><text class="id" x="485" y="1086">F22/23</text></g><text class="hint" x="70" y="1385">F20→F22、F21→F23 は任意枝。F24→F26 が主路、F25 は遠回り。</text></g>

<!-- Overseas -->
<g><rect class="frame" x="635" y="930" width="800" height="510" rx="18"/><text class="title" x="660" y="967">K空港・海外（帰路なし）</text><path class="door" d="M710 1280 L820 1280 L930 1280"/><path class="line" d="M930 1280 L1040 1280 L1150 1280 L1260 1280 L1360 1280"/><path class="line" d="M1260 1280 L1260 1135"/><g class="nd"><circle cx="710" cy="1280" r="31"/><text class="id" x="710" y="1286">F39</text></g><g class="nd"><circle cx="820" cy="1280" r="31"/><text class="id" x="820" y="1286">F40</text></g><g class="nd"><circle cx="930" cy="1280" r="31"/><text class="id" x="930" y="1286">F27</text></g><g class="n"><circle cx="1040" cy="1280" r="31"/><text class="id" x="1040" y="1286">F28</text></g><g class="n"><circle cx="1150" cy="1280" r="31"/><text class="id" x="1150" y="1286">F29</text></g><g class="n"><circle cx="1260" cy="1280" r="31"/><text class="id" x="1260" y="1286">F30</text></g><g class="n"><circle cx="1360" cy="1280" r="31"/><text class="id" x="1360" y="1286">F31</text></g><g class="n"><circle cx="1260" cy="1135" r="31"/><text class="id" x="1260" y="1141">F32–F38</text></g><text class="hint" x="660" y="1385">F39→F40→F27 は扉／飛行機の一方通行。縦都市は F30→F31→F32→F33→F34→F35→F36→F37→F38。</text></g>

<!-- Garden castle -->
<g><rect class="frame" x="1475" y="930" width="875" height="510" rx="18"/><text class="title" x="1500" y="967">兼六園・金沢城（最終ダンジョン）</text><path class="line" d="M1535 1280 L1630 1280 L1725 1280 L1820 1280 L1915 1280 L2010 1280 L2105 1280 L2200 1280"/><path class="line" d="M2200 1280 L2200 1135 L2290 1135"/><g class="n"><circle cx="1535" cy="1280" r="31"/><text class="id" x="1535" y="1286">F41</text></g><g class="n"><circle cx="1630" cy="1280" r="31"/><text class="id" x="1630" y="1286">F42</text></g><g class="n"><circle cx="1725" cy="1280" r="31"/><text class="id" x="1725" y="1286">F43</text></g><g class="n"><circle cx="1820" cy="1280" r="31"/><text class="id" x="1820" y="1286">F44</text></g><g class="n"><circle cx="1915" cy="1280" r="31"/><text class="id" x="1915" y="1286">F45</text></g><g class="n"><circle cx="2010" cy="1280" r="31"/><text class="id" x="2010" y="1286">F46</text></g><g class="n"><circle cx="2105" cy="1280" r="31"/><text class="id" x="2105" y="1286">F47</text></g><g class="n"><circle cx="2200" cy="1280" r="31"/><text class="id" x="2200" y="1286">F48</text></g><g class="n"><circle cx="2200" cy="1135" r="31"/><text class="id" x="2200" y="1141">F49/50</text></g><g class="n"><circle cx="2290" cy="1135" r="31"/><text class="id" x="2290" y="1141">F51–60</text></g><text class="hint" x="1500" y="1385">F41→…→F50（石川橋）→F51→…→F60。詳細連鎖は台帳 v2、実線の一本道には画面内の枝を別途持たせる。</text></g>

<!-- Explicit missing / continuation key -->
<g><rect class="frame" x="45" y="1480" width="2305" height="545" rx="18"/><text class="title" x="70" y="1518">連鎖の展開表（アトラス内でまとめた連続ノードを、全MAP単位へ展開）</text><text class="hint" x="70" y="1552">見落としを避けるため、上の省略ノードの全IDと順序をここに明示する。接続の辺名・扉名は map-topology.md の「MAP相互接続台帳 v2」が正本。</text>
<text x="90" y="1600" class="title">卯辰山・サニーランド</text><text x="90" y="1632" class="hint">N8 → E22 → F04 → F05 → F06 → F07 --door→ F08 --door→ E24 --door→ F09 --door→ E25 --door→ F10 --door→ E23</text>
<text x="90" y="1695" class="title">能登（被災前／後）</text><text x="90" y="1727" class="hint">E28 --door→ E29 → N5 → N6 → N7 → E30 → E31 ／ F12 → F13 → F14 → F15 → F16 → F17、F12 → F18 --door→ E32</text>
<text x="90" y="1790" class="title">体内</text><text x="90" y="1822" class="hint">F19 → F24 → F26（主路）、F19 → F20 → F22（任意）、F19 → F21 → F23（任意）、F24 → F25 → F26（遠回り）</text>
<text x="90" y="1885" class="title">海外・縦都市</text><text x="90" y="1917" class="hint">F39 --door→ F40 --door（飛行機）→ F27 → F28 → F29 → F30 → F31 → F32 → F33 → F34 → F35 → F36 → F37 → F38</text>
