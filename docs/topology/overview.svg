<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">sit-by-me 全体位置関係</title><desc id="desc">北を上とするエリア間の接続図。実線は徒歩主路、破線は乗車または扉・ワープ遷移。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; fill:#20252b; }
    .area { fill:#fafcff; stroke:#51677e; stroke-width:3; rx:18; }
    .area-title { font-size:24px; font-weight:700; }.note{font-size:15px;fill:#53606b}.node{fill:#fff;stroke:#25394b;stroke-width:3}.map{font-size:17px;font-weight:700;text-anchor:middle}.route{fill:none;stroke:#273b4b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.door{fill:none;stroke:#a45532;stroke-width:4;stroke-dasharray:11 8}.rail{fill:none;stroke:#52765b;stroke-width:5;stroke-dasharray:16 8}.legend{font-size:17px}
  </style>
  <rect width="1600" height="980" fill="#f2f5f7"/>
  <text x="60" y="58" font-size="32" font-weight="700">sit-by-me：全体位置関係（北＝上）</text>
  <text x="60" y="85" class="note">枠＝エリア／丸＝MAP群／実線＝徒歩主路／緑破線＝鉄道／茶破線＝扉・ワープ・飛行機。詳細な全MAP接続は atlas.svg。</text>

  <rect class="area" x="55" y="610" width="295" height="225"/><text class="area-title" x="76" y="650">寺町・河岸段丘</text><text class="note" x="76" y="677">県営住宅（犀川側）／学校（反対側）</text><circle class="node" cx="200" cy="750" r="38"/><text class="map" x="200" y="756">E01–E13</text>
  <rect class="area" x="420" y="550" width="300" height="200"/><text class="area-title" x="442" y="590">茶屋街・犀川</text><text class="note" x="442" y="617">寺町と香林坊の間、南岸</text><circle class="node" cx="570" cy="680" r="38"/><text class="map" x="570" y="686">E17–19, N1</text>
  <rect class="area" x="430" y="305" width="300" height="165"/><text class="area-title" x="452" y="345">香林坊・広坂</text><circle class="node" cx="580" cy="410" r="38"/><text class="map" x="580" y="416">E14–16, N9</text>
  <rect class="area" x="795" y="250" width="285" height="175"/><text class="area-title" x="817" y="290">武蔵ヶ辻・金沢駅</text><circle class="node" cx="940" cy="360" r="38"/><text class="map" x="940" y="366">N11, E21</text>
  <rect class="area" x="1120" y="215" width="355" height="210"/><text class="area-title" x="1142" y="255">浅野川・卯辰山・サニーランド</text><circle class="node" cx="1295" cy="355" r="38"/><text class="map" x="1295" y="361">N8, E22–25, F04–10</text>
  <rect class="area" x="785" y="535" width="295" height="175"/><text class="area-title" x="807" y="575">小立野・病院</text><circle class="node" cx="930" cy="650" r="38"/><text class="map" x="930" y="656">E20</text>
  <rect class="area" x="1110" y="520" width="365" height="195"/><text class="area-title" x="1132" y="560">兼六園・金沢城</text><circle class="node" cx="1292" cy="655" r="38"/><text class="map" x="1292" y="661">F41–F60</text>
  <rect class="area" x="95" y="205" width="270" height="190"/><text class="area-title" x="117" y="245">内灘・砂丘</text><circle class="node" cx="230" cy="345" r="38"/><text class="map" x="230" y="351">N12, E26–27, F11</text>
  <rect class="area" x="55" y="430" width="295" height="130"/><text class="area-title" x="77" y="470">小学校</text><circle class="node" cx="200" cy="520" r="38"/><text class="map" x="200" y="526">N10, E33</text>
  <rect class="area" x="65" y="110" width="300" height="78"/><text class="area-title" x="87" y="154">能登・蛸島（前後）</text><text class="note" x="87" y="178">E28–32, N5–7, F12–18</text>
  <rect class="area" x="1190" y="760" width="285" height="120"/><text class="area-title" x="1212" y="802">体内</text><text class="note" x="1212" y="830">F19–F26</text>
  <rect class="area" x="760" y="760" width="365" height="120"/><text class="area-title" x="782" y="802">K空港・海外</text><text class="note" x="782" y="830">F39–40 → F27–38（一方通行）</text>

  <path class="route" d="M350 720 L420 680"/><text class="note" x="360" y="690">北：N2</text>
  <path class="route" d="M570 550 L580 470"/><text class="note" x="591" y="516">北：N1→E14</text>
  <path class="route" d="M730 370 L795 360"/><text class="note" x="738" y="345">北東：N11</text>
  <path class="route" d="M1080 350 L1120 350"/><text class="note" x="1088" y="330">東：N8（浅野川橋）</text>
  <path class="route" d="M700 410 L785 640"/><text class="note" x="717" y="533">東：N9→E20</text>
  <path class="route" d="M700 380 C855 420,1010 520,1110 620"/><text class="note" x="820" y="487">東：N9→兼六園</text>
  <path class="route" d="M200 610 L200 560"/><text class="note" x="216" y="595">E13→N10</text>
  <path class="rail" d="M940 250 C760 120,480 160,365 160"/><text class="note" x="604" y="150">のと鉄道：E21→E28</text>
  <path class="rail" d="M865 250 C675 105,470 195,365 285"/><text class="note" x="548" y="245">浅野川線：E21→N12→E26</text>
  <path class="door" d="M1080 720 C1160 735,1210 755,1230 760"/><text class="note" x="1088" y="748">中3：体内へ</text>
  <path class="door" d="M1080 710 C995 735,940 752,925 760"/><text class="note" x="930" y="725">青年：K空港へ</text>
  <path class="door" d="M1125 820 L1190 820"/><text class="note" x="1128" y="853">飛行機：一方通行</text>
  <line class="route" x1="60" y1="930" x2="105" y2="930"/><text class="legend" x="115" y="936">徒歩主路</text><line class="rail" x1="270" y1="930" x2="315" y2="930"/><text class="legend" x="325" y="936">鉄道</text><line class="door" x1="420" y1="930" x2="465" y2="930"/><text class="legend" x="475" y="936">扉・イベント・ワープ</text>
</svg>
