<text x="850" y="1047" class="label">E01園庭 → F19口（物語イベント）</text>
<g data-area="teramachi"><rect x="245" y="1026" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="390" y="1062" class="label">寺町・寺院と住居</text><text x="390" y="1091" class="label">17 MAP（teramachi）</text></g>
<g data-area="city"><rect x="505" y="696" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="650" y="732" class="label">香林坊・茶屋街・広坂・病院</text><text x="650" y="761" class="label">11 MAP（city）</text></g>
<g data-area="station"><rect x="285" y="386" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="430" y="422" class="label">金沢駅</text><text x="430" y="451" class="label">1 MAP（station）</text></g>
<g data-area="school"><rect x="505" y="1116" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="650" y="1152" class="label">小学校と通学坂</text><text x="650" y="1181" class="label">2 MAP（school）</text></g>
<g data-area="mountain"><rect x="1005" y="406" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="1150" y="442" class="label">卯辰山の一本道</text><text x="1150" y="471" class="label">5 MAP（mountain）</text></g>
<g data-area="sunnyland"><rect x="1335" y="266" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="1480" y="302" class="label">サニーランド</text><text x="1480" y="331" class="label">12 MAP（sunnyland）</text></g>
<g data-area="uchinada"><rect x="115" y="106" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="260" y="142" class="label">内灘・浅野川線</text><text x="260" y="171" class="label">5 MAP（uchinada）</text></g>
<g data-area="noto_train"><rect x="1255" y="76" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="1400" y="112" class="label">能登への鉄道</text><text x="1400" y="141" class="label">1 MAP（noto_train）</text></g>
<g data-area="noto_before"><rect x="1585" y="106" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="1730" y="142" class="label">能登・被災前</text><text x="1730" y="171" class="label">8 MAP（noto_before）</text></g>
<g data-area="noto_after"><rect x="1585" y="606" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="1730" y="642" class="label">能登・被災後</text><text x="1730" y="671" class="label">7 MAP（noto_after）</text></g>
<g data-area="body"><rect x="1565" y="1256" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="1710" y="1292" class="label">幼稚園児の想像する抽象体内</text><text x="1710" y="1321" class="label">17 MAP（body）</text></g>
<g data-area="airport"><rect x="265" y="1556" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="410" y="1592" class="label">K空港</text><text x="410" y="1621" class="label">2 MAP（airport）</text></g>
<g data-area="overseas"><rect x="965" y="1556" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="1110" y="1592" class="label">海外・凍結荒野と三塔</text><text x="1110" y="1621" class="label">20 MAP（overseas）</text></g>
<g data-area="garden"><rect x="1045" y="936" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="1190" y="972" class="label">兼六園</text><text x="1190" y="1001" class="label">10 MAP（garden）</text></g>
<g data-area="castle"><rect x="1045" y="716" width="290" height="88" rx="10" fill="#fff" stroke="#527b69" stroke-width="3"/><text x="1190" y="752" class="label">金沢城</text><text x="1190" y="781" class="label">10 MAP（castle）</text></g>
<text x="100" y="1305" class="note">能登被災前／後は時期差分（徒歩接続ではない）。未登録の接続を補って描かない。</text><text x="100" y="1340" class="note">K空港はワープ到達・起点を固定しない。体内は園庭のイベントから、海外へは一方向の旅客機。</text>
<text x="30" y="1765" class="heading">エリアをまたぐ全12接続の出入口（線の交差は乗換・接続を意味しない）</text>
