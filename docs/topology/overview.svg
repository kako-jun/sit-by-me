<svg xmlns="http://www.w3.org/2000/svg" width="2050" height="2596" viewBox="0 0 2050 2596" role="img"><title>全エリア間の位置関係と接続</title><defs><marker id="directed-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8b4c83"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;fill:#263f4e}.node{fill:#fff;stroke:#527b69;stroke-width:3}.ref{fill:#fff7eb;stroke:#ad8456;stroke-width:2}.edge{fill:none;stroke:#527b69;stroke-width:3}.door{fill:none;stroke:#a16b42;stroke-width:3;stroke-dasharray:8 5}.event{fill:none;stroke:#ac4871;stroke-width:4;stroke-dasharray:6 5}.oneway{fill:none;stroke:#5262a8;stroke-width:4}.id{font-size:21px;font-weight:bold;text-anchor:middle}.label{font-size:16px;text-anchor:middle;paint-order:stroke;stroke:#fbfdfb;stroke-width:5;stroke-linejoin:round}.note{font-size:16px}.small{font-size:14px}.heading{font-size:25px;font-weight:bold}</style><rect width="2050" height="2596" fill="#edf3f1"/>
<text x="30" y="45" class="heading">全15エリアの位置関係と全接続</text>
<text x="30" y="83" class="note">北↑（実在地域の相対配置）。距離・縮尺は模式化。下段の空港境界・海外・体内は地理配置から分離。</text>
<rect x="80" y="100" width="1910" height="1110" rx="15" fill="#f9fcfa" stroke="#a4b9ae"/><rect x="80" y="1230" width="1910" height="490" rx="15" fill="#fff8f0" stroke="#b9a38e"/><text x="100" y="1260" class="note">非地理のイベント層／所在・方角を固定しない空港境界と海外</text>
