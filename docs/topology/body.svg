<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1950" viewBox="0 0 1180 1950" role="img" aria-labelledby="title desc">
<title id="title">体内17MAP：上半身と下半身・手各2枚・足各3枚</title><desc id="desc">幼稚園児の想像する架空人体。園庭から一方向のイベント移動。頭は上、手は左右斜め上、足は左右斜め下の一本道。</desc>
