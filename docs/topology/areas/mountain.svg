<path class="edge" data-edge-id="E22.top&gt;F04.bottom:edge" data-kind="edge" data-from="E22" data-to="F04" data-from-port="top" data-to-port="bottom" d="M360 475 L160 370"/>
<path class="edge" data-edge-id="F04.top&gt;F05.bottom:edge" data-kind="edge" data-from="F04" data-to="F05" data-from-port="top" data-to-port="bottom" d="M160 370 L370 265"/>
<path class="edge" data-edge-id="F05.top&gt;F06.bottom:edge" data-kind="edge" data-from="F05" data-to="F06" data-from-port="top" data-to-port="bottom" d="M370 265 L180 160"/>
<circle class="node" data-map="N8" cx="140" cy="580" r="30"/><text class="id" x="140" y="587">N8</text>
