<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="880" viewBox="0 0 1540 880" role="img" aria-labelledby="title desc">
<title id="title">サニーランド双方向円環</title><desc id="desc">入口1階から廊下と地下水族館、屋外空間、動物園、創作の階段、宿泊棟、入口2階へ巡る。任意施設は入口出口別。方位や正確な勾配の図ではない。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;fill:#233a47}.door{fill:none;stroke:#a45f30;stroke-width:4;stroke-dasharray:9 6}.node{fill:white;stroke:#467260;stroke-width:3}.label{font-size:17px;text-anchor:middle}.note{font-size:18px}.id{font-size:15px;font-weight:bold;text-anchor:middle}</style>
<rect width="1540" height="880" fill="#edf3f1"/><text x="35" y="45" font-size="30" font-weight="bold">サニーランド：最初から両方向に進める円環・12MAP</text>
<text x="35" y="85" class="note">概念図：紙面の上下＝階高や南北ではない。下り廊下は約2MAP、周囲は雪の森。ゲームセンターの右は下降時の進行基準。</text>
<text x="35" y="122" class="note">入口棟は八角形。水族館出口付近＝ピラルク巨大水槽／壁際＝サメ・クジラの陰茎標本。</text>
