<circle class="node" data-map="F07" cx="140" cy="290" r="31"/><text class="id" x="140" y="298">F07</text><text class="label" x="140" y="350">入口1F・受付</text>
<circle class="node" data-map="F08" cx="360" cy="290" r="31"/><text class="id" x="360" y="298">F08</text><text class="label" x="360" y="350">下り廊下・前半</text>
<circle class="node" data-map="F09" cx="590" cy="290" r="31"/><text class="id" x="590" y="298">F09</text><text class="label" x="590" y="350">下り廊下・後半</text>
<circle class="node" data-map="E24" cx="820" cy="290" r="31"/><text class="id" x="820" y="298">E24</text><text class="label" x="820" y="350">地下水族館</text>
<circle class="node" data-map="E23" cx="1080" cy="420" r="31"/><text class="id" x="1080" y="428">E23</text><text class="label" x="1080" y="480">小さな屋外・シャチホコ</text>
<circle class="node" data-map="F10" cx="1080" cy="680" r="31"/><text class="id" x="1080" y="688">F10</text><text class="label" x="1080" y="740">狭い昭和の屋外動物園</text>
<circle class="node" data-map="F63" cx="820" cy="680" r="31"/><text class="id" x="820" y="688">F63</text><text class="label" x="820" y="740">創作の屋外階段</text>
<circle class="node" data-map="F62" cx="590" cy="680" r="31"/><text class="id" x="590" y="688">F62</text><text class="label" x="590" y="740">和室の宿泊棟</text>
<circle class="node" data-map="F61" cx="140" cy="680" r="31"/><text class="id" x="140" y="688">F61</text><text class="label" x="140" y="740">入口2F・全方向の窓</text>
<circle class="node" data-map="E25" cx="360" cy="440" r="31"/><text class="id" x="360" y="448">E25</text><text class="label" x="360" y="500">途中右のゲームセンター</text>
<circle class="node" data-map="F64" cx="1320" cy="245" r="31"/><text class="id" x="1320" y="253">F64</text><text class="label" x="1320" y="305">ラッコ館・任意宝箱</text>
<circle class="node" data-map="F65" cx="1320" cy="580" r="31"/><text class="id" x="1320" y="588">F65</text><text class="label" x="1320" y="640">海底洞窟・任意宝箱</text>
<text x="35" y="790" class="note">入口1F→水族館側と入口2F→宿泊棟側の2経路。動物園→屋外階段→宿泊棟端はユーザー創作。</text>
<text x="35" y="825" class="note">ラッコ館・洞窟は入口と出口別、主円環には不要。同じ屋外空間の別扉へ戻すのはゲーム配置の採用。</text>
<text x="35" y="858" class="note">洞窟＝低予算昭和の海底探検の作り物（ダイオウイカ・難破船・ニンゲン）。画像・mask未生成、階内経路／幅TBD。</text>
</svg>
