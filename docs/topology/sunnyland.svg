<circle class="node" data-map="SNL-01" cx="140" cy="290" r="34"/><text class="id" x="140" y="295">SNL-01</text><text class="label" x="140" y="353">入口1F・受付</text>
<circle class="node" data-map="SNL-02" cx="360" cy="290" r="34"/><text class="id" x="360" y="295">SNL-02</text><text class="label" x="360" y="353">下り廊下・前半</text>
<circle class="node" data-map="SNL-04" cx="590" cy="290" r="34"/><text class="id" x="590" y="295">SNL-04</text><text class="label" x="590" y="353">下り廊下・後半</text>
<circle class="node" data-map="SNL-05" cx="820" cy="290" r="34"/><text class="id" x="820" y="295">SNL-05</text><text class="label" x="820" y="353">地下水族館</text>
<circle class="node" data-map="SNL-06" cx="1080" cy="420" r="34"/><text class="id" x="1080" y="425">SNL-06</text><text class="label" x="1080" y="483">小さな屋外・シャチホコ</text>
<circle class="node" data-map="SNL-09" cx="1080" cy="680" r="34"/><text class="id" x="1080" y="685">SNL-09</text><text class="label" x="1080" y="743">狭い昭和の屋外動物園</text>
<circle class="node" data-map="SNL-10" cx="820" cy="680" r="34"/><text class="id" x="820" y="685">SNL-10</text><text class="label" x="820" y="743">創作の屋外階段</text>
<circle class="node" data-map="SNL-11" cx="590" cy="680" r="34"/><text class="id" x="590" y="685">SNL-11</text><text class="label" x="590" y="743">和室の宿泊棟</text>
<circle class="node" data-map="SNL-12" cx="140" cy="680" r="34"/><text class="id" x="140" y="685">SNL-12</text><text class="label" x="140" y="743">入口2F・全方向の窓</text>
<circle class="node" data-map="SNL-03" cx="360" cy="440" r="34"/><text class="id" x="360" y="445">SNL-03</text><text class="label" x="360" y="503">途中右のゲームセンター</text>
<circle class="node" data-map="SNL-07" cx="1320" cy="245" r="34"/><text class="id" x="1320" y="250">SNL-07</text><text class="label" x="1320" y="308">ラッコ館・任意宝箱</text>
<circle class="node" data-map="SNL-08" cx="1320" cy="580" r="34"/><text class="id" x="1320" y="585">SNL-08</text><text class="label" x="1320" y="643">海底洞窟・任意宝箱</text>
<text x="35" y="790" class="note">入口1F→水族館側と入口2F→宿泊棟側の2経路。動物園→屋外階段→宿泊棟端はユーザー創作。</text>
<text x="35" y="825" class="note">ラッコ館・洞窟は入口と出口別、主円環には不要。同じ屋外空間の別扉へ戻すのはゲーム配置の採用。</text>
<text x="35" y="858" class="note">洞窟＝低予算昭和の海底探検の作り物（ダイオウイカ・難破船・ニンゲン）。画像・mask未生成、階内経路／幅TBD。</text>
</svg>
