[project]
name = "sit-by-me-tools"
version = "0.0.0"
description = "sit-by-me のツール群。台帳（docs/ledger/*.yaml）の読み込みに PyYAML が要る。"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[tool.uv]
package = false

# 画像の検査・斜めツール（oblique_*・verify_seam_boundaries・戦闘背景）とそのテストが使う。
# dev は uv run の既定グループなので、素の `uv run python3 -m unittest discover -s tests` で全テストが cv2 などを読める（#316）。
[dependency-groups]
dev = ["numpy", "opencv-python-headless", "pillow", "scipy"]
